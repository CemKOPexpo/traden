<style>
/* Layout: pixelkantoor bovenaan als podium, daaronder het "notulenblok" met de echte tekst en de bediening. */
:root {
  --bg: #e6eee4; --panel: #f7faf5; --ink: #1e2b22; --muted: #5b6b5f; --line: #c5d3c4;
  --accent: #2f7d4f; --accent-ink: #ffffff;
  --feit: #2f6fae; --aanname: #a8741a; --schatting: #7a4fa3;
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "Atkinson Hyperlegible", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161c24; --panel: #1f2731; --ink: #e8edf2; --muted: #9aa7b4; --line: #344150;
  --accent: #e0a64a; --accent-ink: #1b1408; --feit: #7fb3e6; --aanname: #e5b45c; --schatting: #c29be6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161c24; --panel: #1f2731; --ink: #e8edf2; --muted: #9aa7b4; --line: #344150;
  --accent: #e0a64a; --accent-ink: #1b1408; --feit: #7fb3e6; --aanname: #e5b45c; --schatting: #c29be6; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.3rem); margin: 0; letter-spacing: .02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: .95rem; }
.badge-demo { font-family: var(--display); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
  border: 2px solid var(--accent); color: var(--accent); padding: 2px 8px; }
.stage { position: relative; border: 3px solid var(--ink); background: #000; line-height: 0; }
canvas { width: 100%; height: auto; image-rendering: pixelated; display: block; }
.bubble { position: absolute; transform: translate(-50%, -100%); max-width: min(46%, 300px); line-height: 1.3;
  background: #fffef6; color: #1b1b1b; border: 2px solid #1b1b1b; padding: 6px 9px; font-family: var(--body); font-size: clamp(.72rem, 1.6vw, .9rem);
  box-shadow: 3px 3px 0 #1b1b1b; pointer-events: none; transition: left .15s linear, top .15s linear; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -6px; border: 6px solid transparent; border-top-color: #1b1b1b; border-bottom: 0; }
.bubble b { font-family: var(--display); font-weight: 500; display: block; font-size: .8em; letter-spacing: .04em; color: #555; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select { font-family: var(--display); font-size: 1rem; background: var(--panel); color: var(--ink); border: 2px solid var(--ink);
  padding: 6px 12px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
button:active { transform: translate(2px, 2px); box-shadow: none; }
button.primary { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.spacer { flex: 1; }
label.small { font-size: .85rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.timeline { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--display); font-size: .8rem; border: 2px solid var(--line); padding: 2px 8px; color: var(--muted); background: transparent; box-shadow: none; }
.chip[aria-current="step"] { border-color: var(--accent); color: var(--ink); background: var(--panel); }
.chip.done { color: var(--ink); }
.notes { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .notes { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 2px solid var(--line); padding: 16px; min-width: 0; }
.card h2 { font-family: var(--display); font-weight: 700; font-size: 1.25rem; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }
.detail { display: grid; gap: 8px; }
.detail p { margin: 0; max-width: 68ch; }
.detail ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.lbl { font-family: var(--display); font-size: .72rem; letter-spacing: .06em; padding: 0 5px; border: 1.5px solid currentColor; margin-right: 4px; white-space: nowrap; }
.lbl.FEIT { color: var(--feit); } .lbl.AANNAME { color: var(--aanname); } .lbl.SCHATTING { color: var(--schatting); }
.detail a { color: var(--feit); word-break: break-all; }
.who { display: grid; gap: 6px; }
.who div { display: flex; gap: 8px; align-items: center; font-size: .92rem; }
.dot { width: 12px; height: 12px; border: 2px solid var(--ink); flex: none; }
.foot { color: var(--muted); font-size: .85rem; max-width: 75ch; }
@media (prefers-reduced-motion: reduce) { .bubble { transition: none; } }
</style>

</div>

poort-dossiers voor importeurs, mits de ingangsdatum standhoudt.", "blokken": [{"kop": "Voorstellen", "items": ["VSME-duurzaamheidsrapport als dienst voor MKB-toeleveranciers van grote bedrijven — Gestructureerde intake (vragenlijst + upload van facturen/energiegegevens), AI maakt een VSME-basisrapport en beantwoordt klantvragenlijsten. SCHATTING: EUR 490 eenmalig per jaarrapport, EUR 29 per maand voor jaarlijkse updates en nieuwe klantvragenlijsten.", "Informatieplicht energiebesparing: rapport en erkende-maatregelenlijst voor bedrijfslocaties — Checker + automatisch rapport: upload energierekening, krijgt plichtcheck, lijst van toepasselijke erkende maatregelen met terugverdientijd en een ingevulde rapportage. SCHATTING: EUR 149 per locatie eenmalig; EUR 19 per maand voor monitoring en herinnering.", "Regelingen- en subsidiemonitor voor verduurzaming bij MKB en installateurs — Wekelijkse e-mailmonitor met per profiel de relevante regelingen, deadlines en een vooringevulde checklist. SCHATTING: EUR 29 per maand voor MKB, EUR 79 per maand voor installateurs/adviseurs (inclusief klantklare samenvattingen).", "ONCONVENTIONEEL: batterijpaspoort-dossier als dienst voor importeurs van e-bikes, e-scooters en industriele accu's — Intake-agent die leveranciersdocumenten leest, de datapunten structureert en een dossier plus QR-pagina oplevert. SCHATTING: EUR 1.500 eenmalig per productfamilie plus EUR 99 per maand onderhoud."]}, {"kop": "Eerste test per voorstel", "items": ["VSME-duurzaamheidsrapport…: Eén landingspagina met voorbeeldrapport en betaalde pre-order (EUR 490, terugbetaalbaar). Na goedkeuring eigenaar 30 handmatig gekozen B2B-bedrijven benaderen (geen consumenten-mail). Succes: 3 betaalde pre-orders of 10 gesprekken met 3 ondertekende intenties.", "Informatieplicht…: Gratis plichtcheck (zonder persoonsgegevens) als lead-magneet; betaalde pre-order van het rapport. Succes: 5 betaalde rapporten of 2 installateurs die per rapport willen betalen.", "Regelingen-…: Een n verwerken bedrijfsdata (energiefacturen). De eigenaar moet dat goedkeuren, heeft nog geen KvK, geen betaalaccount en weinig tijd.", "Inhoudelijke fouten in rapporten of subsidieadvies kunnen aansprakelijkheid geven; menselijke review en disclaimers zijn nodig.", "Concurrentie van bestaande ESG-software en adviesbureaus is niet onderzocht; mijn zoekopdrachten gaven vooral secundaire bronnen."]}]}, {"fase": "Blinde ronde", "kort": "3 Klantstem", "titel": "Klantstem: blinde analyse", "spreker": "Klantstem", "bubbel": "Laat zien dat het mij tijd of een boete bespaart, dan betaal ik.", "locaties": {"Oprichter": "bureau", "Criticus": "bureau", "CFO": "bureau", "Jurist": "bureau", "Klantstem": "bureau", "Voorzitter": "glas", "Auditor": "auditor"}, "samenvatting": "Mkb-ondernemers en VvE-besturen voelen de verduurzamingsdruk het meest (energiebesparingsplicht, ketenvragen, label C), maar vooral als uitzoek- en papierwerk waar begeleiding ontbreekt. Betalen doen ze alleen voor een concreet, goedkoop antwoord op 'wat moet ik, wat kost het, wat levert het op'; woningeigenaren betalen weinig voor subsidie-hulp.", "blokken": [{"kop": "Pijnpunten", "items": ["Mkb-ondernemers (kantoor, winkel, kleine productie) onder de energiebesparingsplicht/informatieplicht: Weten niet welke maatregelen van de erkende maatregelenlijst voor hen gelden, hoe ze rapporteren aan RVO en wat het kost. Tijd en technische kennis ontbreken. Zou betalen als: Het binnen een uur een bedrijfsspecifieke maatregellijst met kosten en terugverdientijd plus een kant-en-klare RVO-rapportage geeft, tegen een vaste lage prijs, bijvoorbeeld onder 200 euro per jaar (AANNAME).", "Mkb-leveranciers van grotere bedrijven (keten): Opdrachtgevers vragen CO2- en duurzaamheidsdata (vragenlijsten, VSME) zonder uitleg. Mkb'ers ervaren gebrek aan begeleiding en lopen opdrachten mis. Zou betalen als: Een tool hun gegevens eenmalig verzamelt en voor elke klantvragenlijst antwoorden genereert, zodat ze een opdracht behouden. De betaling is dan gekoppeld aan omzet die ze anders verliezen.", "Huiseigenaren die willen isoleren of een warmtepomp willen: Subsidie (ISDE) is pas achteraf aan te vragen, vraagt foto's en bewijs, en blijkt vaak lager dan verwacht. Voorwaarden wijzigen regelmatig. Het is onduidelijk wat zich terugverdient. Zou betalen als: De hulp gratis of heel goedkoop voelt en bewijsbaar subsidie oplevert die ik anders mis (betalen uit het succes). Als losse dienst waarschijnlijk niet (AANNAME).", "VvE-besturen en kantooreigenaren (energielabel C, collectieve verduurzaming): Label C-verplichting voor kantoren wordt door gemeenten stilaan gehandhaafd. VvE's moeten eigenaren overtuigen en financiering en subsidie uitzoeken, vaak als vrijwilliger zonder expertise. Zou betalen als: Een heldere, onafhankelijke stappenplan-uitkomst die zij kunnen voorleggen aan de ledenvergadering, met subsidiecheck, en een boete of waardedaling voorkomt."]}, {"kop": "Bezwaren als klant", "items": ["Dit staat gratis bij RVO, Ondernemersplein en mijn brancheorganisatie; waarom zou ik betalen voor een herverpakking?", "Ik vertrouw geen AI-tool met mijn energiegegevens en bedrijfsdata, zeker niet als de uitkomst juridisch of financieel gevolgen heeft; wie is aansprakelijk bij een fout?", "De regels veranderen steeds (Omnibus, subsidievoorwaarden 2027); mijn betaling is vandaag weg als het morgen anders is.", "Ik heb geen tijd om gegevens in te voeren; als het meer dan een kwartier kost, haak ik af."]}, {"kop": "Beweringen", "items": [{"tekst": "Volgens MKB Servicedesk moesten ongeveer 80.000 mkb-bedrijven vóór 1 december 2023 rapporteren aan RVO; tekort aan technisch personeel en verkeerd begrip van de informatieplicht speelden mee, en de Erkende maatregelenlijst kwam laat beschikbaar.", "label": "FEIT", "bron": "https://www.mkbservicedesk.nl/nieuws/ondernemersnieuws/ondernemers-worstelen-met-energiebesparingsplicht"}, {"tekst": "Vakcentrum wijst in een consultatiereactie (2026) op liquiditeit van het mkb als hoofdbeperking en op netcongestie die maatregelen soms onuitvoerbaar maakt.", "label": "FEIT", "bron": "https://www.vakcentrum.nl/media/4cape0it/energiebesparingsplicht-consultatie-2026-def.pdf"}, {"tekst": "Niet-beursgenoteerde mkb-bedrijven hoeven de CSRD niet toe te passen, maar grote opdrachtgevers kunnen duurzaamheidsdata vragen; een enquête onder 431 mkb'ers laat gebrek aan begeleiding zien. CSRD-scope is mogelijk veranderd door Omnibus, niet geverifieerd.", "label": "FEIT", "bron": "https://ondernemersplein.overheid.nl/duurzaam-ondernemen/duurzame-bedrijfsvoering/csrd-voor-mkb-bedrijven-dit-moet-u-weten/"}, {"tekst": "Vereniging Eigen Huis opende een meldpunt omdat veel huiseigenaren er niet uitkwamen met de ISDE-aanvraag; wie het afrondde kreeg soms minder subsidie dan verwacht. Subsidie wordt pas na uitvoering en betaling aangevraagd.", "label": "FEIT", "bron": "https://www.hypotheker.nl/actueel/nieuwsberichten/2023/verduurzamen-subsidieaanvraag-blijkt-nog-niet-zo-makkelijk-te-zijn/"}, {"tekst": "Gemeenten zijn bevoegd gezag voor de label C-verplichting kantoren en beginnen eigenaren van onvoldoende verduurzaamde panden aan te schrijven.", "label": "FEIT", "bron": "https://www.binnenlandsbestuur.nl/ruimte-en-milieu/handhaving-label-c-krijgt-langzaam-vorm"}, {"tekst": "Mkb'ers betalen zelden voor losse uitleg over regelgeving en kiezen gratis overheids- of brancheinfo tenzij een boete of verloren opdracht dreigt.", "label": "AANNAME", "bron": null}, {"tekst": "Een mkb-leverancier betaalt waarschijnlijk 100 tot 300 euro per jaar voor een tool die ketenvragenlijsten en RVO-rapportage afhandelt.", "label": "SCHATTING", "bron": null}]}]}, {"fase": "Blinde ronde", "kort": "4 CFO", "titel": "CFO: blinde analyse", "spreker": "CFO", "bubbel": "Testbudget max. 250 euro; verwacht verlies, maar een betaling bewijst de vraag.", "locaties": {"Oprichter": "bureau", "Criticus": "bureau", "CFO": "bureau", "Jurist": "bureau", "Klantstem": "bureau", "Voorzitter": "glas", "Auditor": "auditor"}, "samenvatting": "Een eerste richting moet met een testbudget van ca. EUR 150-300 (bovenop de abonnementen, binnen de EUR 200 totaalgrens) een betaling of voorverkoop kunnen opleveren, met een prijs van minimaal ca. EUR 99 per klant en vrijwel nul handmatige tijd. Beste financiele pasvorm: betaalde digitale rapporten/checks voor MKB (VSME, energiebesparingsplicht) en een subsidie/maatregelcheck voor woningeigenaren.", "blokken": [{"kop": "Financiële eisen", "items": ["Testkosten per idee max. EUR 150-300 voor 60 dagen (advertenties, domein), VOORSTEL aan eigenaar; elke uitgave is niveau C en vereist eerst goedkeuring; waarschuwing bij 80%, stop bij 100%.", "Totale maandkosten (Pro-abonnement, API max. EUR 50, hosting, test) blijven onder de harde grens van EUR 200; API-kosten per idee in de marktest bij voorkeur < EUR 20/mnd.", "Prijs per klant minimaal ca. EUR 99 (B2B) of EUR 29 (B2C) zodat een CAC van ca. EUR 30-100 niet direct verlies geeft; hogere prijs verkiest wegens weinig klikken in het budget.", "Brutomarge >= 80% (digitaal product, geen levering/handwerk); betaalprovider- en BTW-kosten meegerekend.", "Acceptabele CAC: <= 50% van de eerste-jaars klantwaarde (LTV); terugverdientijd marketing < 3 maanden.", "Terugkerende omzet of herhaalaankoop (jaarlijkse verlenging, nieuwe regelgeving, meerdere locaties) wegen zwaar; eenmalige verkoop is acceptabel als test.", "Betalingsbereidheid meetbaar zonder KvK/Stripe-productie: voorverkoop of wachtlijst met betaalintentie; echte omzet pas na KvK, bankrekening en betaalaccount (door eigenaar). Accountant/belastingadviseur nodig voor BTW/KOR/inschrijving zodra de eerste echte omzet komt.", "Weinig eigenaarstijd (<1 uur/week) en geen kosten voor menselijk werk of aansprakelijkheidsrisico (geen certificering/assurance-claims)."]}, {"kop": "Scenario's per richting (60 dagen)", "items": ["VSME-duurzaamheidsrapport voor MKB-leveranciers (automatisch opgesteld, wordt gevraagd door grotere klanten/banken): prijs EUR 149 eenmalig of EUR 199/jaar (SCHATTING; referentie: VSME Ready EUR 199-375/jaar volgens Capterra). Pessimistisch: CPC EUR 5 -> 50 klikken, 0,5% conversie naar voorverkoop: 0 klanten, omzet EUR 0, verlies EUR 250-265. Verwacht: CPC EUR 3,50 -> ca. 70 klikken, 2% conversie: 1-2 klanten, omzet EUR 150-300, verlies ca. EUR 0-110 (marge 80% over omzet). Optimistisch: CPC EUR 2 -> 125 klikken, 4% conversie: 5 klanten, omzet ca. EUR 750-1.000 (deels jaarlijks), netto winst ca. EUR 450-700.", "Energiebesparingsplicht-check voor kleine bedrijven/kantoren (wat moet u wettelijk, welke maatregelen, tijdlijn): prijs EUR 99-199 eenmalig (SCHATTING). Pessimistisch: Weinig zoekvolume, CPC EUR 5: 40-50 klikken, 0 klanten; verlies EUR 210-265. Verwacht: CPC EUR 3: ca. 70 klikken, 1,5% conversie: 1 klant a EUR 149; verlies ca. EUR 90-140. Optimistisch: CPC EUR 2: 100-125 klikken, 4% conversie: 4-5 klanten, omzet EUR 600-900, netto winst ca. EUR 250-500.", "Subsidie- en maatregelcheck voor woningeigenaren (persoonlijk verduurzamingsplan met subsidies/volgorde): prijs EUR 29-49 eenmalig (SCHATTING); referentie: definitief energielabel ca. EUR 190 volgens slimster.nl. Pessimistisch: CPC EUR 1,50 -> 130 klikken, 0,5% conversie: 0-1 klant, omzet max. EUR 39; verlies ca. EUR 175-215. Verwacht: CPC EUR 1 -> 200 klikken, 1,5% conversie: 3 klanten a EUR 39, omzet ca. EUR 117; verlies ca. EUR 100. Optimistisch: CPC EUR 0,70 -> ca. 285 klikken, 3% conversie: ca. 8-9 klanten, omzet ca. EUR 330; verlies ca. EUR 0-50; break-even alleen bij herhaalverkoop of affiliate."]}, {"kop": "Beweringen", "items": [{"tekst": "Gemiddelde Nederlandse Google Search CPC ligt volgens bronnen op ca. EUR 1,20-2,80; B2B-diensten ca. EUR 2-6 (bronnen lopen uiteen en zijn adviesbureau-blogs).", "label": "FEIT", "bron": "https://searchlab.nl/blog/hoeveel-kost-google-ads"}, {"tekst": "Een definitief energielabel kost in 2026 gemiddeld ca. EUR 190 (een secundaire bron).", "label": "FEIT", "bron": "https://slimster.nl/energielabel"}, {"tekst": "VSME Ready kost EUR 199/jaar (Basic) en EUR 375/jaar (Professional); VLAIO biedt een gratis Excel-tool voor Vlaamse kmo's.", "label": "FEIT", "bron": "https://www.capterra.ie/software/1095800/VSME-Ready"}, {"tekst": "Een nieuw energielabel geldt vanaf 29 mei 2026.", "label": "FEIT", "bron": "https://www.volkshuisvestingnederland.nl/actueel/nieuws/2026/04/02/nieuw-energielabel-voor-woningen-en-gebouwen-vanaf-29-mei-2026"}, {"tekst": "Conversie van advertentieklik naar betaling is 0,5-4% (B2B) en 0,5-3% (B2C); niet gemeten.", "label": "SCHATTING", "bron": null}, {"tekst": "B2C-CPC voor woningverduurzaming ligt ca. EUR 0,70-1,50; geen bron gevonden.", "label": "SCHATTING", "bron": null}, {"tekst": "Testbudget van EUR 150-300 per idee past binnen de EUR 200 totaalgrens alleen als abonnementskosten laag blijven (Pro-abonnement en API tellen mee); eigenaar moet elke uitgave goedkeuren.", "label": "AANNAME", "bron": null}, {"tekst": "Vooraf is bij alle drie de richtingen verlies op de test het verwachte resultaat; het doel is signaal van betalingsbereidheid, geen winst in 60 dagen.", "label": "SCHATTING", "bron": null}]}]}, {"fase": "Blinde ronde", "kort": "5 Jurist", "titel": "Jurist: blinde analyse", "spreker": "Jurist", "bubbel": "Informeren mag; gecertificeerde labels en beloofd advies zonder mens en KvK niet.", "locaties": {"Oprichter": "bureau", "Criticus": "bureau", "CFO": "bureau", "Jurist": "bureau", "Klantstem": "bureau", "Voorzitter": "glas", "Auditor": "auditor"}, "samenvatting": "Informatieve, niet-gecertificeerde diensten (CO2-rapportage, subsidiescan, vergelijkingsplatform) kunnen als ORANJE starten; energielabels als eigen product en eigen groene claims zijn ROOD of strikt voorwaardelijk. Zonder KvK en met sterke automatisering zijn oprichting, AVG, AI-transparantie en aansprakelijkheid de gemeenschappelijke voorwaarden.", "blokken": [{"kop": "Beoordelingen", "items": ["ROOD — Energielabels (woning/utiliteit) opstellen en afgeven: Label opstellen is voorbehouden aan gecertificeerde EP-adviseurs (BRL 9500, geattesteerde software, aansluiting bij een Certificerende Instelling) en registratie in EP-Online. Een starter zonder certificaat en zonder KvK kan dit niet rechtmatig leveren; een AI-'label' zonder registratie is rechtsgeldig waardeloos en misleidend.", "ORANJE — CO2-/duurzaamheidsrapportage (voetafdruk, ESG-lite) voor mkb: Niet wettelijk beschermd en goed te automatiseren, maar foutieve berekeningen of een onterechte 'CO2-neutraal'-uitkomst geven aansprakelijkheids- en misleidingsrisico, zeker als klanten het publiek of richting banken/aanbesteders gebruiken.", "ORANJE — Subsidie- en regelingenscan met automatische aanvraagvoorbereiding (ISDE, SEEH e.d.): Informeren en aanvraagdossiers voorbereiden mag, maar fouten kunnen subsidie kosten (aansprakelijkheid). Namens de klant indienen vereist machtiging en verwerkt persoonsgegevens (BSN/IBAN/adres), en eHerkenning/DigiD is niet te delegeren aan een AI zonder zorg.", "ORANJE — Marktplaats/leadplatform die consumenten en installateurs koppelt (zonnepanelen, warmtepomp, isolatie): Platformmodel is toegestaan, maar levert consumentenrecht- en reclamerisico's: transparantie over rangschikking en betaalde plaatsing, geen nep-reviews, verwerking van consumentengegevens en doorgifte aan derden, en ongevraagde commerciële berichten zijn niet toegestaan. Installateurs kunnen zelf certificeringseisen hebben (bijv. voor subsidie).", "ORANJE — Groene-claimcheck/-tekstservice voor bedrijven (toetsing marketing aan ACM-leidraad): Vraag is aannemelijk en de ACM-leidraad is publiek, maar een automatische 'goedkeuring' van claims wekt schijnzekerheid: een AI-oordeel beschermt de klant niet tegen een ACM-boete. Absolute termen als 'duurzaam' of 'klimaatneutraal' hebben een hoge bewijslast.", "ROOD — Volledig geautomatiseerd 'verduurzamingsadvies' aan consumenten (woningplan met rendementsbeloftes en besparingscijfers): Zonder KvK, zonder verzekering en zonder menselijke controle is aansprakelijkheid voor foutief advies (besparing, terugverdientijd, bouwkundige geschiktheid) en misleidende rendementsclaims niet te dragen; consumenten hebben extra bescherming. Niveau C-handelingen (juridische verplichtingen, persoonsgegevens) zijn nog niet geregeld."]}, {"kop": "Echte professional nodig bij", "items": ["Oprichting en rechtsvorm (KvK, eenmanszaak/BV) en beroepsaansprakelijkheidsverzekering", "Algemene voorwaarden en aansprakelijkheidsbeperking voor adviesachtige diensten", "Elke nieuwe verwerking van persoonsgegevens (AVG: grondslag, verwerkersovereenkomsten, DPIA indien nodig)", "Samenwerking met erkende EP-adviseurs of installateurs (certificeringseisen, doorverwijsvergoedingen)", "Belastingen/btw op commissies en platformomzet (accountant of belastingadviseur)", "Juridische toetsing van AI-transparantieplichten en groene-claimcontent voor publicatie"]}, {"kop": "Beweringen", "items": [{"tekst": "ACM Leidraad Duurzaamheidsclaims (versie 2, 2023): claims moeten juist, duidelijk, specifiek en volledig zijn, onderbouwd met actuele feiten, eerlijk vergelijkend en concreet bij toekomstambities.", "label": "FEIT", "bron": "https://www.acm.nl/system/files/documents/acm-leidraad-duurzaamheidsclaims-versie-2.pdf"}, {"tekst": "Absolute termen als 'duurzaam', 'klimaatneutraal' of 'milieuvriendelijk' zijn in de leidraad alleen in zeer uitzonderlijke gevallen te onderbouwen; een wettelijke eis mag niet als duurzaamheidsvoordeel worden gepresenteerd.", "label": "FEIT", "bron": "https://www.acm.nl/en/publications/guidelines-regarding-sustainability-claims"}, {"tekst": "Voor utiliteitsgebouwen moet de EP-adviseur aangesloten zijn bij een Certificerende Instelling en werken voor een organisatie met een BRL 9500-U-certificaat; labels worden bepaald met geattesteerde software (BRL 9501).", "label": "FEIT", "bron": "https://www.rvo.nl/onderwerpen/wetten-en-regels-gebouwen/energielabel-utiliteitsgebouwen"}, {"tekst": "Alleen in EP-Online geregistreerde energielabels zijn rechtsgeldig; EP-Online wordt beheerd door RVO.", "label": "FEIT", "bron": "https://www.rvo.nl/sites/default/files/2025-02/handleiding-ep-online-opvragen-van-bestanden.pdf"}, {"tekst": "De uitgebreide labelverplichting voor woningen gaat volgens RVO per 29 mei 2026 in; de details heb ik niet gecontroleerd.", "label": "AANNAME", "bron": "https://www.rvo.nl/onderwerpen/wetten-en-regels-gebouwen/energielabel-woningen"}, {"tekst": "Een automatisch gegenereerd rapport of advies zonder menselijke controle brengt een hoger aansprakelijkheidsrisico mee dan een geverifieerd advies; zonder verzekering is dat risico voor een starter bijna niet af te dekken.", "label": "AANNAME", "bron": null}, {"tekst": "AI-transparantieplichten (EU AI Act) en AVG-eisen voor chatbots en verwerking van consumentengegevens zijn van toepassing; exacte artikelen en ingangsdata zijn in deze ronde niet opgezocht en moeten door een jurist worden gecontroleerd.", "label": "AANNAME", "bron": null}, {"tekst": "Zonder KvK-inschrijving kan geen zakelijke rekening, betaalaccount of rechtsgeldig contract met aansprakelijkheidsbeperking worden opgezet; elke dienst moet dus pas na oprichting commercieel starten.", "label": "AANNAME", "bron": null}]}]}, {"fase": "Presentatie", "kort": "6 Presentatie", "titel": "Iedereen naar de vergaderzaal", "spreker": "Voorzitter", "bubbel": "De analyses liggen op tafel. Criticus en Klantstem: vallen jullie maar aan.", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor"}, "samenvatting": "De vier blinde analyses worden gedeeld. Pas vanaf nu ziet iedereen elkaars werk. De Auditor blijft in zijn eigen kamer en ziet het debat niet."}, {"fase": "Aanval", "kort": "7 Criticus", "titel": "Criticus valt aan", "spreker": "Criticus", "bubbel": "Regels zwakken af of komen pas in 2027; eerst klanten spreken.", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor"}, "samenvatting": "Geen enkele richting heeft één gesproken of betalende klant. De twee favorieten leunen op regelgeving die is afgezwakt (CSRD/VSME na Omnibus I) of pas eind 2027 weer urgent wordt (informatieplicht). Ik blokkeer het batterijpaspoort en de B2C-subsidiecheck als eerste richting; VSME en energiebesparing mogen alleen door met strengere testvoorwaarden. Mijn grootste zorg blijft: de directie kiest richtingen op basis van regelgeving die afzwakt (VSME na Omnibus I) of pas eind 2027 weer knelt (informatieplicht). Daarbovenop kan geen enkele voorverkooptest betaling ophalen zonder KvK en betaalaccount, binnen een budget dat de CFO-scenario's al overschrijden. Eerst 10 echte klantgesprekken, dan pas een landingspagina.", "blokken": [{"kop": "VSME-/CO2-duurzaamheidsrapport voor mkb-toeleveranciers (Oprichter, CFO, Klantstem, Jurist)", "items": ["[hoog] De vraagdriver is grotendeels weg. Na Omnibus I (Richtlijn 2026/470) valt de CSRD alleen nog op ondernemingen met meer dan 1.000 werknemers en meer dan EUR 450 mln omzet. Er zijn dus veel minder opvragende klanten, en de eerste rapportage schuift naar boekjaar 2027. (weerlegbaar door: Bewijs dat Nederlandse/Belgische mkb'ers nu wél vragenlijsten krijgen: 10 gesprekken met mkb-leveranciers, of voorbeelden van bank-/aanbestedingseisen waarin VSME wordt gevraagd.)", "[middel] De value-chain-cap werkt tegen het idee. Leveranciers onder 1.000 werknemers mogen weigeren meer te leveren dan VSME, dus het grootste deel van de 'pijn' (eindeloze vragenlijsten) verdwijnt bij wet. De Oprichter stelt dit voor als een kans ('één duidelijk format'), maar het verkleint ook de urgentie. (weerlegbaar door: Bewijs dat banken of aanbesteders (die buiten de cap vallen) een VSME-rapport eisen en daarvoor laten betalen.)", "[hoog] Er bestaan al gratis en goedkope alternatieven: het gratis Excel-hulpmiddel van VLAIO, VSME Ready (EUR 199-375/jaar) en accountants die het bijleveren. De prijzen in de analyses lopen uiteen van EUR 149 tot 490 plus EUR 29/mnd. Dat laat zien dat niemand de prijs weet. (weerlegbaar door: Een prijstest met twee prijspunten op een landingspagina, of een concurrentieoverzicht dat een onbediend gat aantoont.)", "[middel] Aansprakelijkheid en vertrouwen: de klant moet energiefacturen en bedrijfsdata aan een AI-tool geven, en een fout cijfer in een rapport voor een bank of klant raakt de studio. Volgens de Jurist zijn een disclaimer, menselijke steekproeven en algemene voorwaarden nodig. Dat staat haaks op 'bijna nul handwerk'. (weerlegbaar door: Een reviewproces dat aantoonbaar minder dan 15 minuten per rapport kost, plus getoetste algemene voorwaarden.)"]}, {"kop": "Energiebesparingsplicht/informatieplicht-check en rapport voor bedrijfslocaties (Oprichter, CFO, Klantstem)", "items": ["[hoog] Verkeerde timing voor een test van 60 dagen. Volgens RVO is de volgende uiterste datum van de informatieplicht 1 december 2027. Nu dreigt er geen deadline, dus de koopdrang is waarschijnlijk laag. Achterblijvers uit 2023 bestaan wel, maar lopen vooral risico bij handhaving. (weerlegbaar door: Een segment met acute druk, bijv. bedrijven die nu een handhavingsbrief van een omgevingsdienst krijgen. Of: test als voorverkoop richting 2027 en meet dan wat de betaalbereidheid is.)", "[hoog] Het gratis overheidsalternatief is sterk: de erkende maatregelenlijsten, het eLoket van RVO en ondernemersinformatie. Daarnaast doen installateurs en adviseurs dit vaak als bijproduct. Het bezwaar van de Klantstem ('dit staat gratis bij RVO') is hier op zijn sterkst. (weerlegbaar door: Gesprekken met 5 plichtige bedrijven die bevestigen dat ze nu betalen of uren kwijt zijn, of met 2 installateurs die per rapport willen betalen (het succescriterium van de Oprichter zelf).)", "[middel] Je kunt niet namens de klant indienen. Rapporteren gaat via het eLoket met eHerkenning en een machtiging, en de verantwoordelijkheid ligt bij de drijver van de inrichting. Het product blijft daarom een concept dat de klant zelf moet uploaden, en die belooft 'kant-en-klare rapportage' te veel. (weerlegbaar door: Een werkende XML-upload die de klant in minder dan 10 minuten zelf indient, of een geldige machtigingsroute.)", "[middel] De doelgroep is smaller dan gesuggereerd. De plicht geldt pas vanaf 50.000 kWh of 25.000 m3 gas per locatie, dus niet voor het gemiddelde kleine kantoor of de winkel. Het zoekvolume is onbekend (de CFO labelt het terecht als SCHATTING). (weerlegbaar door: Zoekvolumedata (bijv. Google Keyword Planner) en een telling van plichtige locaties per sector.)"]}, {"kop": "Regelingen- en subsidiemonitor voor mkb, installateurs en adviseurs (Oprichter)", "items": ["[hoog] De markt is al bediend. Subsidieadviesbureaus en hun nieuwsbrieven, brancheorganisaties en RVO zelf informeren gratis of als lokmiddel. Een abonnement van EUR 29-79/mnd op informatie die elders gratis te krijgen is, is moeilijk te verkopen. Er is geen concurrentieonderzoek gedaan (de Oprichter geeft dat zelf toe). (weerlegbaar door: 3 installateurs die na een gratis proefeditie betalen, zoals de Oprichter voorstelt als succescriterium.)", "[middel] Het inhoudelijke risico zit hier constant. Regelingen wijzigen voortdurend, en één gemiste of verkeerd samengevatte deadline kost de klant geld en de studio haar reputatie. 'Bijna nul handwerk' is ongelabeld en onwaarschijnlijk. (weerlegbaar door: Een proefperiode van 4 weken waarin elke regel automatisch naar de officiële bron linkt en een steekproef geen fouten vindt.)", "[middel] Het bereik hangt af van het netwerk van de eigenaar ('installateurs die de eigenaar kent') en van handmatig LinkedIn-werk. De eigenaar heeft weinig tijd, en dit is één kanaal dat niet schaalt. (weerlegbaar door: Een lijst van minimaal 10 concrete installateurs die de eigenaar binnen 2 uur kan benaderen.)"]}, {"kop": "Subsidie- en maatregelcheck / persoonlijk verduurzamingsplan voor woningeigenaren (B2C, CFO) — GEBLOKKEERD", "items": ["[hoog] De eigen cijfers van de CFO tonen verlies in het pessimistische en het verwachte scenario, en in het optimistische scenario hooguit break-even. Bij EUR 29-49 is betaalde acquisitie niet terug te verdienen. (weerlegbaar door: Een organisch of affiliatekanaal met aantoonbaar lage CAC (minder dan EUR 10).)", "[hoog] Juridisch komt dit gevaarlijk dicht bij wat de Jurist ROOD noemt: een volledig geautomatiseerd verduurzamingsadvies aan consumenten met besparings- en volgordeadvies, zonder KvK, verzekering of menselijke adviseur. Consumenten genieten extra bescherming. (weerlegbaar door: Een afbakening die aantoonbaar alleen informeert (geen besparings- of rendementscijfers), getoetst door een echte jurist.)", "[hoog] De Klantstem stelt dat de betaalbereidheid laag is: VEH, ANWB, RVO, het Energieloket en installateurs helpen gratis. (weerlegbaar door: Een rookproef met minimaal 3% betaalconversie bij minstens 200 bezoekers.)", "Blokkade: De richting combineert drie dingen: een eigen verliesmodel (CFO), een juridisch ROOD-profiel (Jurist) en lage betaalbereidheid (Klantstem). Daarmee is het idee als eerste richting een fundamentele denkfout tegenover het doel van aantoonbare betalingsbereidheid tegen aanvaardbaar risico. De blokkade vervalt als er een informerende, juridisch getoetste variant komt met een kanaal zonder betaalde acquisitie."]}, {"kop": "Batterijpaspoort-dossier voor importeurs van e-bikes, LMT en industriële accu's (Oprichter, onconventioneel) — GEBLOKKEERD", "items": ["[hoog] Het past niet bij de randvoorwaarden. EUR 1.500 per productfamilie vraagt een B2B-verkoopproces, interviews met 15 importeurs, technische documentextractie en een QR-hosting die jaren in de lucht moet blijven. De eigenaar heeft weinig tijd en geen technische kennis, en het budget is EUR 200/mnd. (weerlegbaar door: 2 betaalde intakes van EUR 250 binnen 30 dagen zonder dat de eigenaar meer dan 1 uur per week kwijt is.)", "[hoog] Het ligt buiten het oneerlijke voordeel van de eigenaar (gebouwverduurzaming) en de aansprakelijkheid is hoog. Een fout in een verplicht productpaspoort kan markttoegang blokkeren. De Oprichter erkent dit zelf. (weerlegbaar door: Een partner met productcompliance-expertise en een beroepsaansprakelijkheidsverzekering.)", "[middel] De markt bestaat uit grote spelers. Battery-passport-softwareleveranciers en certificeerders zitten hier al, en grote fabrikanten regelen het intern. Kleine importeurs schuiven de plicht vaak door naar hun leverancier. (weerlegbaar door: Interviews die bewijzen dat kleine EU-importeurs zelf de 'marktdeelnemer' zijn en geen leveranciersoplossing hebben.)", "[laag] De startdatum staat niet volledig vast. 18 februari 2027 is in mijn zoektocht niet uitgesteld, maar er lopen omnibus-voorstellen voor delen van de batterijverordening. (weerlegbaar door: Bevestiging op EUR-Lex of in een Raadsbesluit dat 18-02-2027 ongewijzigd geldt.)", "Blokkade: Als EERSTE richting is dit een fundamentele mismatch: technisch zwaar, hoge aansprakelijkheid, buiten de expertise van de eigenaar en een verkooptraject dat binnen 60 dagen en EUR 200/mnd niet haalbaar is. Het kan als latere optie op de lijst blijven."]}, {"kop": "Stappenplan label C kantoren / collectieve verduurzaming voor VvE's (Klantstem, pijnpunt)", "items": ["[hoog] Het is geen uitgewerkt voorstel. Prijs, aanbod en test ontbreken, en de bestaande prijzen ('enkele honderden tot duizenden euro') zijn AANNAME. (weerlegbaar door: Een uitgewerkt voorstel met prijs en een test van 60 dagen.)", "[hoog] De besluitvorming in een VvE (ledenvergadering, vrijwillige besturen) duurt maanden. Een betaling binnen 60 dagen is daardoor onwaarschijnlijk. (weerlegbaar door: Een VvE-bestuur dat zelfstandig kleine uitgaven mag doen en binnen 4 weken betaalt.)", "[middel] Er dreigt juridisch overlap met het voorbehouden energielabelwerk (ROOD bij de Jurist) en met MJOP-adviseurs. Een stappenplan zonder EP-adviseur wekt al snel schijnzekerheid. (weerlegbaar door: Een positionering als voorbereiding en doorverwijzing naar erkende adviseurs, getoetst door de Jurist.)"]}, {"kop": "Betwiste beweringen", "items": ["Oprichter: 'CSRD-plichtige bedrijven mogen van leveranciers alleen informatie uit de VSME-standaard opvragen' (gelabeld FEIT, terwijl hij zelf zegt de primaire tekst niet te hebben gelezen). — Gelabeld als FEIT op basis van zoeksamenvattingen. De bewering is ook te absoluut: het is een weigerrecht voor leveranciers onder 1.000 werknemers en geldt alleen voor verzoeken voor duurzaamheidsrapportage, niet voor banken of aanbestedingen.", "Oprichter: 'Het is onduidelijk of in 2026 een nieuwe rapportagecyclus loopt' en voorstel 2 doet alsof rapportage nu urgent is. — Onzekerheid die eerst opgelost moest worden. Ze is nu opgelost en verzwakt de urgentie van voorstel 2.", "CFO: testkosten per idee 'max. EUR 150-300' plus Pro-abonnement plus API max. EUR 50, allemaal 'onder de harde grens van EUR 200'. — Dit is intern tegenstrijdig. EUR 250 advertenties + EUR 50 API + het Pro-abonnement is meer dan EUR 200 per maand, tenzij de test over meerdere maanden wordt verdeeld. Dat staat er niet. De CFO labelt het zelf als AANNAME, maar de getallen in de scenario's gaan uit van de volle EUR 250.", "Oprichter (VSME-test): 'Na goedkeuring eigenaar 30 handmatig gekozen B2B-bedrijven benaderen (geen consumenten-mail)'. — Suggereert dat ongevraagde zakelijke e-mail wel mag. In Nederland geldt de opt-in van art. 11.7 Telecommunicatiewet naar mijn kennis ook voor e-mail aan rechtspersonen. Dit is niet in deze ronde gecontroleerd; de Jurist moet het toetsen voordat iemand wordt benaderd.", "Klantstem: 'Niet-beursgenoteerde mkb-bedrijven hoeven de CSRD niet toe te passen ... CSRD-scope is mogelijk veranderd door Omnibus, niet geverifieerd' (gelabeld FEIT). — Een FEIT-label op een bewering die zelf zegt 'niet geverifieerd', zonder datum. Het verkeerde label versluiert dat de scope sterk is ingeperkt.", "Oprichter: batterijpaspoort start '18 februari 2027 ... een bron noemt uitstel naar 18 augustus 2027'. — Correct als AANNAME gelabeld, maar het voorstel hangt ervan af.", "Diverse FEIT-beweringen (Oprichter, CFO) met als 'datum' 2026-10-30, en Klantstem-FEITEN (80.000 bedrijven, handhaving label C) zonder datum. — De ophaaldatum wordt gebruikt als brondatum, of een datum ontbreekt helemaal. Een bericht uit 2023 wordt zo gepresenteerd als actueel feit, wat in strijd is met de bewijsplicht (bron plus datum).", "Ongelabelde beweringen van de Oprichter: 'berekening is deterministisch', 'bijna nul handwerk', 'eigenaar kan de inhoud snel beoordelen en is hier oneerlijk voordeel'. — Geen label. Ze botsen met de eis van de Jurist (menselijke controle) en met de context (eigenaar heeft weinig tijd). Het zijn AANNAMES."]}]}, {"fase": "Aanval", "kort": "8 Klantstem", "titel": "Klantstem valt aan", "spreker": "Klantstem", "bubbel": "Waarom betalen voor wat RVO gratis geeft, en wie bent u eigenlijk?", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor"}, "samenvatting": "Als koper zou ik hooguit de goedkope energiecheck en misschien het VSME-rapport proberen; EUR 490 voor een onbekend AI-bedrijf zonder KvK koop ik niet, en de batterijpaspoort-dienst alleen na een gesprek met een mens. Gratis RVO- en VLAIO-tools en mijn accountant zijn de maatstaf, dus bewijs moet komen uit echte voorbeeldrapporten en een naam die ik kan bellen.", "blokken": [{"kop": "VSME-duurzaamheidsrapport voor MKB-toeleveranciers (EUR 490 eenmalig, EUR 29/mnd; CFO: EUR 149-199) — zou kopen: misschien", "items": ["Koper: Eigenaar van een toeleverancier met 20 medewerkers die een ESG-vragenlijst van een grote klant of bank krijgt", "Nu: Gratis VLAIO Excel-tool (Vlaanderen), RVO-uitleg, eigen uitzoekwerk, accountant of milieuadviseur; VSME Ready kost EUR 199-375/jaar. Anders: niets doen tot de klant dwingt.", "EUR 490 is 2,5x de EUR 199 van VSME Ready en er bestaat een gratis Excel-tool; ik betaal alleen EUR 149-199 voor een herverpakking.", "Onbekend AI-bedrijf zonder KvK, zonder gezicht: ik stuur geen facturen en energiedata op en mijn klant of bank accepteert zo'n rapport misschien niet.", "Wie is aansprakelijk als het rapport fout is en mijn opdrachtgever dat merkt? Een disclaimer 'indicatie' helpt me niet als ik het als bewijs insturen moet.", "Mijn klant vraagt vaak een eigen format; als de AI dat niet goed invult, heb ik EUR 490 betaald en doe ik het alsnog zelf.", "Overtuigt mij: Een echt voorbeeldrapport van een vergelijkbaar bedrijf, bevestiging dat een grote afnemer of bank het formaat accepteert, een KvK-nummer met contactpersoon, en voorverkoop met terugbetalingsgarantie."]}, {"kop": "Informatieplicht energiebesparing: rapport en maatregelenlijst per bedrijfslocatie (EUR 149 per locatie, EUR 19/mnd) — zou kopen: misschien", "items": ["Koper: Eigenaar van een kleine productie- of kantoorlocatie met 20 medewerkers boven 50.000 kWh of 25.000 m3 gas", "Nu: Gratis RVO-pagina's met Erkende Maatregelenlijst en rapportagesjabloon, MKB-Nederland DEB-tool, installateur of adviseur (prijs niet gevonden, AANNAME enkele honderden euro). Veel bedrijven doen niets.", "De RVO-lijst en sjablonen zijn gratis; ik betaal alleen als het echt meer werk uit handen neemt dan zelf invullen.", "Indienen gaat via RVO eLoket met eHerkenning; als de tool dat niet afmaakt, heb ik alleen een lijst gekocht.", "Maandabonnement EUR 19 voor herinnering: ik krijg eens per vier jaar een verplichting, dat is geen maandelijkse behoefte.", "Onbekende partij zonder KvK met mijn energierekeningen; bij een fout riskeer ik een bestuurlijke boete en niet de leverancier.", "Overtuigt mij: Een gratis check die direct zegt of ik onder de plicht val, een ingevuld voorbeeld voor mijn branche, bevestiging dat het RVO-formaat klopt, en een betaling pas na resultaat."]}, {"kop": "Regelingen- en subsidiemonitor (EUR 29/mnd MKB, EUR 79/mnd installateurs/adviseurs) — zou kopen: nee", "items": ["Koper: Eigenaar van een mkb-bedrijf met een bedrijfspand, of een installateur met 5 medewerkers", "Nu: Gratis nieuwsbrieven van RVO, brancheorganisatie, Rabobank en MKB-Nederland, subsidieadviseur op succesbasis, installateur die regelingen meeneemt, vaak niets.", "Voor EUR 29 per maand krijg ik wat gratis nieuwsbrieven al leveren; ik zie niet wat het meerwaarde heeft.", "Subsidies zijn maar een paar keer per jaar relevant; een doorlopend abonnement voelt als een kostenpost zonder geld terug.", "Een installateur betaalt EUR 79 pas als het aantoonbaar opdrachten oplevert; een AI-samenvatting zonder juridische zekerheid vertrouw ik niet naar mijn klanten.", "Onbekend bedrijf zonder KvK, geen referenties.", "Overtuigt mij: Drie gemelde regelingen die ik nog niet kende en waarvoor ik daadwerkelijk subsidie kreeg, een gratis proefperiode van 2-3 maanden, en bewijs dat het sneller en vollediger is dan RVO plus mijn brancheorganisatie."]}, {"kop": "Batterijpaspoort-dossier voor importeurs van e-bikes, e-scooters en accu's (EUR 1.500 per productfamilie, EUR 99/mnd) — zou kopen: nee", "items": ["Koper: Eigenaar van een kleine e-bike-importeur met 10 medewerkers", "Nu: Leverancier of fabrikant levert data, brancheorganisatie, jurist of compliance-adviseur, of gewoon wachten tot het verplicht is en de norm helder is.", "EUR 1.500 plus EUR 99 per maand voor een verplichting waarvan de ingangsdatum en uitvoering nog onzeker zijn; ik betaal pas als het zeker moet.", "Compliancefouten kunnen mijn producten van de markt halen; ik leg dat niet bij een onbekend AI-bedrijf zonder KvK, verzekering of aansprakelijkheid.", "Ik ben afhankelijk van mijn leverancier voor de data; als die niet meewerkt kan niemand het dossier maken.", "Nog geen gevestigde standaard; ik wil een partij die de norm kent en getekend heeft, geen experiment.", "Overtuigt mij: Een bevestigde ingangsdatum, een referentiedossier door een erkende autoriteit goedgekeurd, een beroepsaansprakelijkheidsverzekering en een branchereferentie."]}, {"kop": "Subsidie- en maatregelcheck voor woningeigenaren (CFO-voorstel, EUR 29-49 eenmalig) — zou kopen: nee", "items": ["Koper: Particuliere woningeigenaar die wil isoleren of een warmtepomp overweegt", "Nu: Gratis: RVO, ANWB, Vereniging Eigen Huis, Energieloket van de gemeente, installateur die de ISDE-aanvraag meeneemt.", "Alles wat ik zoek is gratis bij Energieloket en installateur; EUR 29-49 voor dezelfde info is geen deal.", "Subsidievoorwaarden veranderen; mijn betaling is morgen mogelijk waardeloos.", "Onbekende site zonder KvK vraagt mijn adres en woningdata; dat voelt als lead-farm voor installateurs.", "Ik vertrouw een AI-plan niet voor een investering van duizenden euro's.", "Overtuigt mij: Een gratis uitkomst met een concrete subsidiebedrag voor mijn woning, een onafhankelijk keurmerk of review van VEH of een gemeente, en betaling pas na een bruikbaar resultaat."]}]}, {"fase": "Verdediging", "kort": "9 Verdediging", "titel": "Oprichter verdedigt en past aan", "spreker": "Oprichter", "bubbel": "Eerst tien gesprekken, dan pas een prijs; en een mens als gezicht.", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor"}, "samenvatting": "Ik verdedig de kern van VSME en de energieplicht, maar pas prijs, timing en aanpak aan: geen EUR 490, geen koude mail, geen abonnement op een vierjaarlijkse plicht. Subsidiemonitor en batterijpaspoort trek ik in als eerste richting. Fase 2 begint met gratis gesprekken in plaats van een betaalde landingspagina, en een accountant als gezicht naast de studio.", "blokken": [{"kop": "Per idee: verdedigd / aangepast / ingetrokken", "items": ["VSME-rapport voor MKB-toeleveranciers: aangepast — Criticus toont (Omnibus I, weigerrecht onder 1.000 werknemers) dat de vragenlijstdruk kleiner is en Klantstem noemt VSME Ready (EUR 199-375/jaar, Capterra, niet geverifieerd) en de gratis VLAIO-tool; de kern (vaste standaard, banken/aanbesteders vallen buiten de cap, SCHATTING) blijft, maar de prijs gaat naar EUR 149-249 en de eerste stap is vragen wie nu echt een vragenlijst krijgt.", "Informatieplicht energiebesparing: aangepast — RVO-datum 1 december 2027 (Criticus, FEIT) maakt een koopdrang nu onwaarschijnlijk en Klantstem wijst het EUR 19/mnd-abonnement af (eens per vier jaar); ik verdedig alleen het segment achterblijvers uit 2023 met een gratis plichtcheck en betaling na resultaat, zonder abonnement.", "Regelingen- en subsidiemonitor: ingetrokken als eerste richting — Klantstem zegt nee (gratis nieuwsbrieven RVO/brancheorganisaties), Criticus noemt de markt al bediend en ik heb geen concurrentieonderzoek; kan later als lead-magneet voor een andere richting dienen.", "Batterijpaspoort-dossier (onconventioneel): ingetrokken voor fase 2 — Klantstem zegt nee, Criticus toont misfit met eigenaar (weinig tijd, geen technische kennis, EUR 200/mnd) en hoge aansprakelijkheid; buiten het eigenaarsvoordeel verduurzaming. Alleen heropenen als de ingangsdatum op EUR-Lex vaststaat en een compliance-partner meedoet.", "B2C subsidie-/maatregelcheck woningeigenaren (niet van mij): niet verdedigd — de blokkade van Criticus (CFO-verlies, Jurist ROOD, lage betaalbereidheid) is correct en ik heb geen kanaal met CAC onder EUR 10.", "VvE-stappenplan label C (niet van mij): niet verdedigd — geen prijs, aanbod of test, en besluitvorming in een VvE duurt langer dan 60 dagen (Criticus).", "Mijn FEIT-label op het leveranciersweigerrecht: gecorrigeerd — ik las geen primaire tekst; Criticus' versie is nauwkeuriger (weigerrecht, alleen voor duurzaamheidsrapportage, bronnen secundair)."]}, {"kop": "Standpuntwijzigingen", "items": ["Prijs VSME van EUR 490 naar EUR 149-249 met twee prijspunten testen — reden: Klantstem (EUR 490 is 2,5x VSME Ready, gratis VLAIO-tool) en Criticus (niemand kent de prijs; analyses lopen van EUR 149 tot 490).", "Geen betaalde pre-order of landingspagina als eerste stap, maar eerst gesprekken — reden: Criticus (zonder KvK en betaalaccount is voorverkoop niet te innen) en Klantstem (zonder naam of KvK koop ik niet).", "Geen koude e-mail aan 30 bedrijven; alleen netwerk eigenaar, persoonlijk LinkedIn-contact en bellen, na toets Jurist — reden: Criticus (art. 11.7 Telecommunicatiewet, opt-in geldt mogelijk ook voor rechtspersonen; AANNAME, niet gecontroleerd).", "Energieplicht: abonnement EUR 19/mnd vervalt, segment wordt achterblijvers en betaling na resultaat — reden: RVO-deadline 1 december 2027 (Criticus) en Klantstem (vierjaarlijkse plicht is geen maandbehoefte).", "Subsidiemonitor en batterijpaspoort uit mijn top 3 — reden: beide beoordeeld als nee door Klantstem, en misfit met eigenaar en aansprakelijkheid (Criticus).", "Marktkosten van de test: eerst EUR 0 aan advertenties — reden: Criticus wijst de CFO-som (EUR 50 API + EUR 250 advertenties boven de grens van EUR 200/mnd) terecht aan; gesprekken kosten alleen tijd."]}, {"kop": "Aangepaste top 3 voor onderzoek", "items": ["1. VSME-/klantvragenlijst-rapport voor MKB-toeleveranciers (aangescherpt: bank- en klantvragenlijsten invullen, niet 'wettelijk verplicht'): test 10 gesprekken via netwerk eigenaar (geen koude mail), vraag wie in 12 maanden een vragenlijst kreeg en hoeveel uren het kostte; toon voorbeeldrapport; leg EUR 149 en EUR 249 voor aan de helft elk; drempel: minstens 6 van 10 kregen een vragenlijst, minstens 3 noemen EUR 149 of meer als redelijk, en 2 betalingen of getekende intenties binnen 60 dagen na de start van de marktest. Onder 3 van 10 met een vragenlijst: stoppen.", "2. Energieplicht-check voor achterblijvers (bedrijfslocaties boven 50.000 kWh of 25.000 m3 gas): test gratis plichtcheck zonder persoonsgegevens plus 5 gesprekken met plichtige bedrijven of installateurs, betaling alleen na resultaat; drempel: 3 van 5 hebben nog niet gerapporteerd en bevestigen te betalen voor een kant-en-klaar rapport (SCHATTING EUR 99-199 per locatie), of 2 installateurs willen per rapport betalen; onder 2 bevestigingen: parkeren tot voorjaar 2027 (deadline 1 december 2027).", "3. Onconventioneel, nieuw: partnerkanaal via accountants/milieuadviseurs die het AI-rapport onder eigen naam leveren (wholesale; studio is achter de schermen, accountant is het gezicht en de aansprakelijke partij, AANNAME): test 8 gesprekken met kleine accountants of adviseurs, bij voorkeur uit netwerk eigenaar, met een voorbeeldrapport (VSME of energieplicht) en een inkoopprijs van EUR 79-99 per rapport; drempel: 2 partners met een getekende intentie of proefrapport voor een echte klant, en minstens 1 die zonder aandringen een prijs noemt. Dit lost naam/KvK-wantrouwen (Klantstem) en aansprakelijkheid (Criticus, Jurist) deels op; of dit echt mag moet de Jurist toetsen."]}]}, {"fase": "Financiële toets", "kort": "10 CFO-toets", "titel": "CFO rekent de overgebleven ideeën door", "spreker": "CFO", "bubbel": "Ruim binnen budget zonder advertenties; het partnerkanaal is financieel het veiligst.", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor"}, "samenvatting": "Zonder advertenties kosten alle drie de richtingen samen ca. EUR 30-150 over 60 dagen, ruim binnen de grens van EUR 200/mnd; mijn eerdere EUR 250 advertentiebudget paste niet. Financieel is het partnerkanaal (richting 3) het veiligst, VSME (1) heeft het hoogste bedrag per verkoop maar meer bewijslast, en de energieplicht (2) levert binnen 60 dagen vrijwel zeker geen omzet. Alle cijfers zijn SCHATTING; gerealiseerd is nu EUR 0 omzet en EUR 0 uitgegeven.", "blokken": [{"kop": "Budgetruimte per maand", "items": ["Harde grens EUR 200/mnd, inclusief Claude-abonnement (ca. EUR 22/mnd, AANNAME: werkelijk bedrag controleren) en API (max. EUR 50/mnd): wat overblijft voor testkosten buiten de API is ca. EUR 128/mnd (200 - 22 - 50), of ca. EUR 256 over 60 dagen als elke maand volledig wordt benut. Dat is een plafond, geen doel.", "Raming testkosten voor alle drie de richtingen samen over 60 dagen (SCHATTING): domein EUR 10-15; API voor voorbeeldrapporten en gespreksvoorbereiding EUR 20-60 totaal (ruim onder EUR 20/mnd per idee); hosting gratis tot EUR 10; KvK-inschrijving ca. EUR 50-100 eenmalig (niet geverifieerd) pas nodig bij de eerste echte betaling. Totaal ca. EUR 30-150, dus ca. EUR 15-75 per maand buiten het abonnement.", "Duurste denkbare maand: EUR 22 abonnement + EUR 50 API + EUR 15 domein + EUR 100 KvK = ca. EUR 187; blijft onder EUR 200 maar zonder ruimte voor advertenties in dezelfde maand.", "Advertenties: EUR 0 in de gespreksfase (volgt Oprichter). Pas na goedkeuring en na een positieve drempel uit de gesprekken: max. EUR 50 per maand en EUR 100 totaal.", "Elke uitgave (domein, KvK, advertenties, betaalaccount) vereist vooraf goedkeuring van de eigenaar. Waarschuwing bij 80% van het goedgekeurde testbudget, stop bij 100%.", "Niet in de euro's meegeteld: eigenaarstijd (weinig beschikbaar; 10 gesprekken kosten bij benadering 10-15 uur, SCHATTING) en BTW. Boekhouder of belastingadviseur nodig zodra KvK en eerste omzet er zijn (BTW, KOR, inkomstenbelasting)."]}, {"kop": "Scenario's per richting", "items": ["1. VSME-/klantvragenlijst-rapport (EUR 149-249): pessimistisch 0 vragenlijst-ja's en 0 betalingen, kosten EUR 30-60, resultaat -EUR 30 tot -60, stop na 3 van 10 / verwacht 1 betaling of getekende intentie, omzet EUR 0-249, kosten EUR 50-130 (incl. KvK bij betaling), resultaat ca. -EUR 130 tot +EUR 200, middelpunt rond break-even / optimistisch 2 betalingen plus 3 intenties, omzet EUR 300-500, kosten EUR 100-130, resultaat ca. +EUR 170 tot +400 (SCHATTING). Gratis alternatieven (VLAIO-tool, VSME Ready EUR 199-375/jaar) drukken prijs en conversie.", "2. Energieplicht-check achterblijvers (betaling na resultaat, EUR 99-199 per locatie): pessimistisch 0 omzet, kosten EUR 20-50, resultaat -EUR 20 tot -50 / verwacht 0 omzet in 60 dagen (betaling pas na resultaat, deadline pas 1 december 2027), kosten EUR 30-70, resultaat -EUR 30 tot -70 / optimistisch 1-2 betaalde rapporten, omzet EUR 99-400, kosten EUR 50-100, resultaat ca. +EUR 0 tot +300 (SCHATTING). Indienen via eHerkenning blijft bij de klant; dat beperkt wat verkocht kan worden.", "3. Partnerkanaal accountants/adviseurs (inkoop EUR 79-99 per rapport): pessimistisch 0 partners, kosten EUR 20-45, resultaat -EUR 20 tot -45 / verwacht 1 proefrapport, omzet EUR 0-99, kosten EUR 30-70, resultaat ca. -EUR 70 tot +70 / optimistisch 2 partners met 3-5 rapporten, omzet EUR 240-500, kosten EUR 50-100, resultaat ca. +EUR 140 tot +400 (SCHATTING). Lagere prijs per rapport, maar geen advertentiekosten, geen KvK-wantrouwen en terugkerende volumes per partner mogelijk.", "Alle scenario's zijn voorspeld (SCHATTING, geen bron voor conversie of prijs); verwacht is nog niet gemeten; gerealiseerd (betaalprovider, administratie) is op dit moment EUR 0 omzet en EUR 0 kosten. Omzet geldt pas als echt betaald na KvK en betaalaccount, een intentie is geen omzet. Rapportreview door een mens (Jurist) is niet in euro's meegenomen en kan de brutomarge van 80% onder druk zetten."]}, {"kop": "Correcties op eerdere analyse", "items": ["De Criticus had gelijk: mijn testbudget van EUR 250 advertenties plus API (EUR 50) en het abonnement (ca. EUR 22) is ca. EUR 322 en komt boven de grens van EUR 200/mnd. Ik schreef ten onrechte dat dit paste. Ook gespreid over twee maanden (EUR 125/mnd advertenties) kom ik op ca. EUR 197/mnd, zonder marge voor domein, KvK of BTW: nog steeds te krap.", "Mijn scenario's met koude advertentieklikken (CPC EUR 2-5, conversie 0,5-4%) vervallen: de eerste stap is nu gesprekken zonder advertentiekosten. Die conversiecijfers waren SCHATTING zonder meting en gelden pas als een advertentietest later wordt goedgekeurd.", "Mijn voorverkoop 'zonder KvK' was te optimistisch: zonder KvK en betaalaccount is geen betaling te innen (Criticus, Klantstem). KvK en betaalaccount zijn daarom een kostenpost en een voorwaarde voor omzet.", "Mijn eerdere voorkeur voor de subsidiecheck voor woningeigenaren trek ik in: eigen cijfers laten verlies zien en prijs EUR 29-49 verdient advertentiekosten niet terug.", "Mijn FEIT-labels (CPC searchlab, energielabelprijs, Capterra) zijn secundaire bronnen met als datum de ophaaldatum; lees ze als SCHATTING tot de brondatum is vastgesteld."]}, {"kop": "Advies", "items": ["Financieel beste richting: 3 (partnerkanaal), omdat de testkosten het laagst zijn, de aansprakelijkheid deels bij de partner ligt en herhaalverkoop per partner mogelijk is; nadeel is de lagere prijs en dat de vraag nog niet is aangetoond. Tweede: 1 (VSME), hoogste prijs per verkoop. Derde: 2 (energieplicht), vrijwel zeker geen omzet binnen 60 dagen; parkeren tot voorjaar 2027 is financieel verstandig.", "Voorstel: voer de gespreksronde voor 1 en 3 samen uit met één voorbeeldrapport (gedeelde kosten); totaal testbudget voor eigenaar ter goedkeuring: max. EUR 100 buiten API en abonnement, API max. EUR 20/mnd per idee.", "Beslismomenten: geen KvK-uitgave voor de eerste echte betaling of getekende intentie; geen advertenties tot minstens 6 van 10 een vragenlijst kregen; stoppen bij 100% van het goedgekeurde bedrag.", "Aandachtspunt: een accountant of belastingadviseur inschakelen bij KvK-inschrijving en eerste omzet; dit is een nieuwe uitgave die de eigenaar moet goedkeuren."]}]}, {"fase": "Besluit", "kort": "11 Besluit", "titel": "De Voorzitter besluit", "spreker": "Voorzitter", "bubbel": "Eerst echte klanten spreken; VSME en partners samen, energieplicht op papier.", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor"}, "samenvatting": "Proefbesluit: fase 2 onderzoekt in deze volgorde (1) het VSME-/klantvragenlijst-rapport voor mkb-toeleveranciers, (2) het partnerkanaal via accountants en adviseurs en (3) de energieplicht-check voor achterblijvers, deze laatste alleen als goedkoop bureauonderzoek. Subsidiemonitor, batterijpaspoort, B2C-subsidiecheck en het VvE-stappenplan vallen af. Er komt eerst een gespreksronde zonder advertenties en zonder koude e-mail, met harde stopdrempels.", "blokken": [{"kop": "Feitencheck", "items": [{"tekst": "Ongevraagde commerciële e-mail valt in Nederland onder de opt-in van art. 11.7 lid 1 Telecommunicatiewet. Sinds de wetswijziging van 2008/2009 (Stb. 2008, 525) geldt die ook voor rechtspersonen. Koude e-mail aan bedrijven is dus niet vrij toegestaan, en de Criticus had gelijk. Opgezocht op 2026-10-30.", "label": "FEIT", "bron": "https://zoek.officielebekendmakingen.nl/stb-2008-525.pdf"}, {"tekst": "Lid 3 kent een voorwaardelijke uitzondering voor zakelijke adressen, maar een algemeen info@-adres is geen toestemming. De precieze reikwijdte heb ik niet in de primaire wettekst gelezen. De Jurist toetst dit vóór elk contact, en tot dan geldt: geen koude e-mail.", "label": "AANNAME", "bron": "https://overloop.com/nl/blog/koude-acquisitie-wetgeving"}, {"tekst": "Omnibus I (Richtlijn (EU) 2026/470) is op 18 maart 2026 in werking getreden. De CSRD geldt alleen nog voor ondernemingen met meer dan 1.000 werknemers én meer dan EUR 450 mln omzet. Leveranciers met hooguit 1.000 werknemers mogen informatie buiten de VSME-standaard weigeren. Dit bevestigt de betwiste bewering van de Criticus (secundaire bronnen: advocatenkantoren, opgezocht op 2026-10-30).", "label": "FEIT", "bron": "https://www.stibbe.com/nl/publications-and-insights/omnibus-i-duidelijkheid-over-de-toekomst-van-de-csrd-en-csddd"}, {"tekst": "Het weigerrecht geldt alleen voor verzoeken voor duurzaamheidsrapportage. Vragen van banken en aanbesteders vallen erbuiten, en of de uitzondering voor 'in de sector gebruikelijke informatie' in de definitieve tekst staat, is niet bevestigd. Of er nog vraag naar VSME is, moet dus uit gesprekken blijken, niet uit de wet.", "label": "AANNAME", "bron": "https://www.williamfry.com/wp-content/uploads/2026/03/Omnibus-1-Directive-comes-into-force-in-March-2026-key-amendments-to-CSRD-and-CS3D.pdf"}, {"tekst": "De webinhoud is als data behandeld. Ik kwam geen instructies tegen. Eén zoeksamenvatting bevatte een onjuiste uitspraak over de drempel van vóór Omnibus, en die heb ik genegeerd.", "label": "FEIT", "bron": null}]}, {"kop": "Besluit", "items": ["1. VSME-/klantvragenlijst-rapport voor mkb-toeleveranciers (10-250 medewerkers, NL en Vlaanderen). We positioneren het als 'vragenlijst van klant, bank of aanbesteder invullen', niet als wettelijke plicht. In de gesprekken testen we twee prijspunten: EUR 149 en EUR 249.", "2. Partnerkanaal: accountants en milieuadviseurs leveren het AI-rapport onder eigen naam (inkoop EUR 79-99 per rapport). Deze gespreksronde draait gelijktijdig met richting 1 en gebruikt hetzelfde voorbeeldrapport.", "3. Energieplicht-check voor achterblijvers uit 2023 (locaties boven 50.000 kWh of 25.000 m3 gas). In fase 2 alleen bureauonderzoek en hooguit 5 gesprekken, zonder bouwen. Zonder bewijs van acute druk parkeren we deze richting tot voorjaar 2027.", "Valt af: regelingen- en subsidiemonitor (al bediend door gratis nieuwsbrieven, ingetrokken), batterijpaspoort (blokkade gevolgd, kan later terugkomen), B2C-subsidiecheck voor woningeigenaren (blokkade gevolgd) en VvE-/label C-stappenplan (geen aanbod, en de besluitvorming duurt langer dan 60 dagen)."]}, {"kop": "Waarom", "items": ["Eerst dit: we hebben nog geen enkel contact met een echte klant en geen meetbare vraag (FEIT, uit alle analyses). Fase 2 moet dat eerst oplossen, en daarom is de eerste stap gesprekken in plaats van een betaalde landingspagina.", "Criterium 'dichter bij omzet tegen aanvaardbaar risico': richting 1 heeft de hoogste prijs per verkoop en een directe koper. Richting 2 pakt de twee grootste koopbezwaren aan, namelijk 'onbekende partij zonder KvK' (Klantstem) en aansprakelijkheid (Jurist, Criticus). Beide gebruiken dezelfde intake en hetzelfde voorbeeldrapport, wat de kosten deelt (CFO).", "VSME staat vóór het partnerkanaal omdat het partnerkanaal geen eigen vraag heeft. Het is een verkoopweg voor product 1 of 3. Zonder bewezen eindvraag verkoopt ook een accountant niets (AANNAME).", "Energieplicht staat op 3 omdat de volgende RVO-deadline 1 december 2027 is (FEIT, Criticus, rvo.nl). De CFO verwacht daardoor binnen 60 dagen geen omzet (SCHATTING). Bureauonderzoek kost bijna niets en houdt de optie open.", "Het bewijs is te dun voor een grote stap (A1-regel). Het besluit beperkt zich daarom tot goedkoop onderzoek van ca. EUR 30-150 over 60 dagen (SCHATTING, CFO), ruim binnen de grens van EUR 200 per maand."]}, {"kop": "Reactie op blokkades Criticus", "items": ["Blokkade B2C-subsidiecheck: gevolgd. Het verliesmodel van de CFO, het ROOD-profiel bij de Jurist en de lage betaalbereidheid volgens de Klantstem zijn niet weerlegd, en er is geen kanaal met een CAC onder EUR 10. Heropenen kan alleen onder de voorwaarde die de Criticus zelf noemt: een juridisch getoetste, puur informerende variant met een kanaal zonder betaalde acquisitie.", "Blokkade batterijpaspoort: gevolgd. Het past niet bij de eigenaar (weinig tijd, geen technische kennis), de aansprakelijkheid is hoog en de verkoopcyclus past niet in 60 dagen. De Oprichter heeft het idee ingetrokken. Heropenen kan alleen als de ingangsdatum op EUR-Lex vaststaat en een compliance-partner meedoet.", "Bezwaar 'VSME-vraag is weggevallen door Omnibus I' (geen blokkade): de feitencheck bevestigt dat de CSRD-scope is ingeperkt. Banken en aanbesteders vallen echter buiten het weigerrecht. Ik neem daarom de toets van de Criticus over als stopdrempel: kregen minder dan 3 van de 10 een vragenlijst, dan stoppen we met richting 1.", "Bezwaar 'zonder KvK geen betaling': geaccepteerd. In fase 2 is getekende intentie of een proefrapport voor een echte klant het bewijs, geen omzet. KvK en een betaalaccount volgen pas na de eerste getekende intentie en met goedkeuring van de eigenaar. De 60-dagenklok van het eerste doel loopt pas vanaf de start van de marktest.", "Bezwaar 'koude e-mail': geaccepteerd en door de feitencheck bevestigd. We benaderen mensen alleen via het netwerk van de eigenaar, persoonlijk LinkedIn-contact of bellen, en pas na toetsing door de Jurist."]}, {"kop": "Minderheidsstandpunt (niet overgenomen)", "items": ["CFO (gesteund door de grootste zorg van de Criticus): zet het partnerkanaal op 1, omdat het de laagste testkosten heeft, de aansprakelijkheid deels bij de partner legt, herhaalvolume per partner mogelijk maakt en minder leunt op afzwakkende VSME-regelgeving.", "Niet overgenomen, omdat een partner alleen inkoopt als er eindvraag is. Die vraag toetsen we met richting 1. Beide gespreksrondes lopen tegelijk, dus de volgorde bepaalt vooral welke drempel beslist, niet welke als eerste start. Blijkt het partnerkanaal sterker (2 getekende partnerintenties terwijl richting 1 de drempel mist), dan wisselen 1 en 2 automatisch van plaats."]}, {"kop": "Opdracht fase 2 met klaar-criteria", "items": ["Looptijd max. 6 weken. Budget max. EUR 100 buiten API en abonnement, API max. EUR 20 per maand per idee en EUR 0 voor advertenties. Waarschuwing bij 80%, stop bij 100%.", "A. Voorbereiding (agents, zonder klantcontact): één voorbeeldrapport (VSME-basis plus ingevulde klantvragenlijst) op basis van een fictief bedrijf, duidelijk als voorbeeld gelabeld. Daarnaast een gespreksleidraad en een concurrentieoverzicht (VLAIO-tool, VSME Ready, Regreener en accountantsdiensten) met prijzen, bronnen en brondata. Klaar als de Jurist het voorbeeldrapport en de disclaimer heeft getoetst en het overzicht minstens 5 aanbieders bevat.", "B. Juridische toets door de Jurist vóór elk contact: de benaderingsroute (art. 11.7 Tw), een white-label/partnerconstructie en een minimale privacytekst voor de gesprekken. Klaar als er een schriftelijk ja/nee per route ligt.", "C. Richting 1: 10 gesprekken met mkb-toeleveranciers via de toegestane route. Klaar als alle 10 gevoerd en vastgelegd zijn. Doorgaan bij minstens 6 van 10 met een vragenlijst in de afgelopen 12 maanden, minstens 3 die EUR 149 of meer redelijk vinden en minstens 2 getekende intenties. Stoppen bij minder dan 3 van 10 met een vragenlijst.", "D. Richting 2: 8 gesprekken met kleine accountants of adviseurs. Klaar als alle 8 gevoerd zijn. Doorgaan bij minstens 2 getekende intenties of proefrapporten voor een echte klant, en minstens 1 partner die zonder aandringen een prijs noemt.", "E. Richting 3, alleen bureauwerk plus hooguit 5 gesprekken: aantal achterblijvers uit 2023, signalen van handhaving door omgevingsdiensten en zoekvolume. Klaar als er een cijfer met bron ligt. Doorgaan alleen bij minstens 3 van 5 achterblijvers die betaling bevestigen, anders parkeren tot voorjaar 2027.", "Elke bewering in het eindverslag heeft een label, en bij FEIT staan publicatiedatum en ophaaldatum apart (eis van de Criticus). Het eindproduct is een vergaderstuk voor de keuze van één richting voor de marktest."]}, {"kop": "Voor de eigenaar (niveau C)", "items": ["Behandel dit als proefbesluit uit een demonstratievergadering. U heeft het laatste woord, en niets wordt uitgevoerd zonder uw akkoord.", "Akkoord op het testbudget: max. EUR 100 buiten API en abonnement, API max. EUR 20 per maand per idee, geen advertenties. Elke uitgave (domein, KvK, betaalaccount) blijft vooraf ter goedkeuring.", "Akkoord op klantcontact: mogen we bedrijven uit uw netwerk benaderen via persoonlijk LinkedIn-contact of telefoon, na toetsing door de Jurist? Kunt u ca. 10 mkb-toeleveranciers en 8 accountants of adviseurs aanwijzen?", "Uw tijd: de gesprekken kosten ca. 10-15 uur (SCHATTING, CFO), en dat botst met 'weinig tijd'. Kiest u: zelf voeren, een deel schrappen, of een ander gezicht zoeken (bijvoorbeeld een bevriende accountant)?", "Vooraankondiging: bij de eerste getekende intentie moet u beslissen over KvK-inschrijving, een betaalaccount en een boekhouder of belastingadviseur (kosten en juridische gevolgen)."]}], "eigenaar": true}, {"fase": "Controle", "kort": "12 Auditor", "titel": "De Auditor controleert", "spreker": "Auditor", "bubbel": "Feiten houden stand; tijd van de eigenaar en kostenband moeten worden gecorrigeerd.", "locaties": {"Oprichter": "bureau", "Criticus": "bureau", "CFO": "bureau", "Jurist": "bureau", "Klantstem": "bureau", "Voorzitter": "glas", "Auditor": "auditor"}, "samenvatting": "De feiten die het besluit dragen (Omnibus I, opt-in voor e-mail aan bedrijven, RVO-deadline 1 december 2027) kloppen in de kern. De energiedeadline wordt wel verkeerd uitgelegd, en de VSME Ready-prijzen kon ik niet verifiëren. Twee rekenfouten van de CFO en een onderschatting van de tijd die de eigenaar kwijt is, leiden niet tot een ander besluit, maar moeten vóór akkoord worden hersteld. Geen ernstige bevindingen.", "blokken": [{"kop": "Gecontroleerde feiten", "items": [{"tekst": "Omnibus I (Richtlijn (EU) 2026/470) is op 18 maart 2026 in werking getreden. De CSRD geldt nu alleen voor ondernemingen met meer dan 1.000 werknemers én meer dan EUR 450 mln omzet, en leveranciers met hooguit 1.000 werknemers mogen informatie buiten de VSME weigeren — klopt. Meerdere advocatenkantoren bevestigen dit (gepubliceerd 26-02-2026 in het Publicatieblad, opgehaald 2026-10-30). Wel ontbreekt een aanvulling: lidstaten hebben tot 19 maart 2027 om de richtlijn om te zetten, en de begrenzing voor de keten geldt vanaf boekjaar 2027. De Nederlandse omzetting heb ik niet gevonden.", "label": "FEIT", "bron": "https://cms.law/en/ita/publication/esg-news-as-of-18-march-omnibus-i-reduces-thresholds-and-obligations-for-undertakings"}, {"tekst": "Art. 11.7 lid 1 Telecommunicatiewet (opt-in voor ongevraagde commerciële e-mail) geldt sinds Stb. 2008, 525 ook voor rechtspersonen, dus koude e-mail aan bedrijven is niet vrij — klopt. De Staatsblad-publicatie bestaat en secundaire bronnen bevestigen de reikwijdte. Het precieze bereik van de uitzondering voor zakelijke adressen heb ik ook niet in de geldende wettekst gelezen, dus het label AANNAME van de Voorzitter is terecht.", "label": "FEIT", "bron": "https://zoek.officielebekendmakingen.nl/stb-2008-525.pdf"}, {"tekst": "De volgende RVO-deadline voor de informatieplicht energiebesparing is 1 december 2027 — klopt deels. De datum klopt, maar er staat ook dat de geactualiseerde energiebesparingsplicht op 1 juli 2027 ingaat (planning na een consultatie die tot 19-08-2026 liep) en dat het oude regime per 1 december 2027 vervalt. Voor 'achterblijvers uit 2023' is die deadline niet de bron van urgentie: zij zijn nu al in overtreding, dus druk ontstaat alleen door handhaving. Daarmee wordt richting 3 eerder zwakker dan het besluit aanneemt.", "label": "FEIT", "bron": "https://iplo.nl/thema/energiebesparing/ontwikkeling-wetgeving-energiebesparing/ontwikkelingen-energiebesparingsplicht-2027/"}, {"tekst": "VSME Ready kost EUR 199/jaar (Basic) en EUR 375/jaar (Professional) — niet te verifiëren. Mijn zoekopdracht leverde geen prijspagina op. De enige bron is Capterra, een secundaire bron met als datum de ophaaldatum. Dit drukt het prijspunt van EUR 149-249 en weegt dus mee in het besluit.", "label": "AANNAME", "bron": "https://www.capterra.ie/software/1095800/VSME-Ready"}, {"tekst": "Ongeveer 80.000 mkb-bedrijven moesten vóór 1 december 2023 rapporteren (MKB Servicedesk) — niet te verifiëren. Ik heb dit niet zelf opgezocht omdat het zoekbudget op was, en de bron heeft geen datum. Het label FEIT is hier te sterk zolang de publicatiedatum ontbreekt.", "label": "AANNAME", "bron": "https://www.mkbservicedesk.nl/nieuws/ondernemersnieuws/ondernemers-worstelen-met-energiebesparingsplicht"}]}, {"kop": "Herrekeningen", "items": ["Budgetruimte: 200 - 22 - 50 = EUR 128/mnd, en x2 = EUR 256 over 60 dagen — klopt.", "Duurste maand: 22 + 50 + 15 + 100 = EUR 187 — klopt. De correctie 250 + 50 + 22 = EUR 322 en de gespreide variant 125 + 50 + 22 = EUR 197 kloppen ook.", "Totale testkosten 'ca. EUR 30-150' — klopt niet. De eigen posten tellen op tot 10-15 (domein) + 20-60 (API) + 0-10 (hosting) = EUR 30-85 zonder KvK en EUR 80-185 met KvK (50-100). De bovengrens is dus EUR 185, niet 150. Het past nog steeds binnen de grens, maar het voorgestelde testbudget van max. EUR 100 buiten de API is met KvK en domein (60-115) krap.", "VSME optimistisch: 2 x 149-249 = EUR 298-498, min kosten 100-130 = +168 tot +398 — klopt (afgerond +170 tot +400).", "Partnerkanaal optimistisch: 3-5 x 79-99 = EUR 237-495, min kosten 50-100 = +137 tot +445. De CFO noemt +140 tot +400, dus de bovengrens is te laag (klein verschil). Energieplicht optimistisch: 1-2 x 99-199 = 99-398, min 50-100 = -1 tot +348 (CFO: 0 tot +300), eveneens iets te laag.", "Fase-2-budget: abonnement 22 + API 3 x 20 + 100 eenmalig = EUR 182 in de zwaarste maand — past binnen EUR 200."]}, {"kop": "Aannames gebruikt als feit", "items": ["Dat mkb-toeleveranciers via banken en aanbesteders nog vragenlijsten krijgen, is een AANNAME die richting 1 draagt. Het is netjes gelabeld, maar de rangorde 1 boven 2 steunt er volledig op.", "De inkoopprijs van EUR 79-99 per rapport bij partners is een niet-onderbouwde schatting en wordt in het besluit als vast gegeven gebruikt.", "De ca. 10-15 uur eigenaarstijd is door de CFO geschat voor 10 gesprekken, maar het besluit vraagt 10 + 8 + 5 = 23 gesprekken. Bij dezelfde verhouding is dat ca. 23-35 uur.", "Het item 'webinhoud als data behandeld' in de feitencheck van de Voorzitter heeft het label FEIT zonder bron. Het is een procesverklaring en geen feit.", "Oprichter: de CSRD-bewering heeft label FEIT terwijl die volgens hemzelf uit zoeksamenvattingen komt en hij de primaire tekst niet heeft gelezen. Klantstem: drie FEIT-beweringen zonder publicatiedatum. Beide zijn in strijd met regel 1."]}, {"kop": "Bevindingen (ernst)", "items": ["[middel] De tijd van de eigenaar is onderschat: 23 gesprekken in plaats van 10. Aanbeveling: herreken dit vóór de vraag aan de eigenaar, of schrap richting 3-gesprekken en een deel van D.", "[middel] De kostenband van EUR 30-150 is onjuist opgeteld (met KvK EUR 80-185). Aanbeveling: corrigeer dit en zet KvK-kosten apart in het budget van EUR 100.", "[middel] De logica van de energiedeadline klopt niet: voor achterblijvers is 1 december 2027 geen drukmiddel, en het regime verandert op 1 juli 2027. Aanbeveling: laat het bureauonderzoek van richting 3 zich richten op handhaving en het nieuwe regime.", "[info] De nummering van de richtingen verschilt tussen de CFO-toets (partner = 3, energie = 2) en het besluit (partner = 2, energie = 3). Dat is verwarrend voor de eigenaar. Aanbeveling: gebruik één nummering.", "[info] De prijzen van concurrenten (VSME Ready) zijn niet geverifieerd en zijn een taak in onderdeel A. Ze zijn geen basis voor de prijspunten.", "[info] Punt 4 van de A8-taak (zijn eerdere besluiten uitgevoerd?) is niet van toepassing: dit is de eerste vergadering. Er is geen melding voor de eigenaar nodig, want er is geen ernstige bevinding."]}, {"kop": "Dient dit het eerste doel?", "items": ["Grotendeels wel. Het besluit leidt naar echt klantcontact (18 gesprekken) met cijfermatige door- en stopdrempels, inclusief getekende intenties en het noemen van een prijs. Het is dus geen praten zonder klantcontact.", "Beperking: een getekende intentie is een benadering van betalingsbereidheid, geen betaling. Echte betaling vraagt eerst KvK en een betaalaccount, en die horen in het plan te staan vóór de start van de marktest, niet pas daarna.", "Risico: alle klantcontact hangt af van het netwerk en de tijd van de eigenaar, en juist die is beperkt. Als de eigenaar geen 10 + 8 contacten kan aanwijzen, staat fase 2 stil. Dat is het grootste uitvoeringsrisico."]}, {"kop": "Oordeel over de proefvergadering", "items": ["Het systeem laat waarde zien. Zwakke ideeën vielen af (B2C, batterijpaspoort), de CFO corrigeerde zichzelf aantoonbaar (EUR 322 boven de grens) en de Voorzitter heeft een betwist feit zelf nagezocht. Het eindresultaat is een toetsbare opdracht met stopdrempels, in plaats van een vage richting.", "De labeldiscipline is beter dan gemiddeld, maar niet sluitend: FEIT zonder publicatiedatum, FEIT op basis van zoeksamenvattingen en FEIT zonder bron komen alle drie voor. De eis 'publicatiedatum en ophaaldatum apart' moet in het uitvoerformat worden afgedwongen.", "Wat beter moet: (1) laat de CFO-toets mechanisch optellen (bijvoorbeeld een rekentool), zodat bandbreedtes kloppen; (2) hertoets schattingen als de scope verandert (de uren voor 10 gesprekken werden 23 gesprekken); (3) een vaste nummering van opties door de hele vergadering heen; (4) in de eerste ronde primaire bronnen (EUR-Lex, wetten.overheid.nl, rvo.nl) in plaats van blogs.", "Kanttekening: dit is één proefvergadering zonder echte klantdata. Of het systeem waarde heeft, blijkt pas uit de uitkomst van fase 2, niet uit de kwaliteit van het debat."]}, {"kop": "Wat ik gecontroleerd heb", "items": ["Gelezen: 0-vraag.md, 8-besluit-voorzitter.json, 7-toets-cfo.json en alleen de beweringen uit 2-blind-oprichter/klantstem/cfo/jurist. De aanval- en verdedigingsstukken heb ik niet gelezen.", "Zelf opgezocht met 4 standaardzoekopdrachten op 2026-10-30: Omnibus I (scope, inwerkingtreding, ketenbegrenzing), de RVO-deadline voor de informatieplicht energiebesparing, art. 11.7 Tw voor rechtspersonen en de prijzen van VSME Ready (geen resultaat).", "Herrekend: budgetruimte, duurste maand, het correctiebedrag van EUR 322/197, de totale testkosten, de optimistische scenario's van alle drie de richtingen en het fase-2-budget.", "Niet gecontroleerd: het aantal van 80.000 (MKB Servicedesk), de drempels van 50.000 kWh/25.000 m3, de KvK-tarieven, de abonnementsprijs van ca. EUR 22 en de uitzondering in art. 11.7 lid 3. Webinhoud heb ik als data behandeld en ik ben geen instructies tegengekomen."]}], "eigenaar": true}]}, {"titel": "Brainstorm 1 · beste idee", "vraag": "Wat is het commercieel sterkste, legale idee waarmee we zo automatisch mogelijk geld verdienen?", "budget": {"besteed": 0, "limiet": 50}, "deelnemers": ["Voorzitter", "Oprichter", "Criticus", "CFO", "Jurist", "Klantstem", "Groei", "Auditor"], "voet": "Brainstorm op 30-10-2026, gespeeld door Claude Code-helpers via het Pro-abonnement. Er zijn geen API-kosten gemaakt. De scores en bedragen zijn schattingen van de agents. Het eindtotaal is in code berekend.", "stappen": [{"fase": "Vraag", "kort": "1 Vraag", "titel": "De Voorzitter opent de brainstorm", "spreker": "Voorzitter", "bubbel": "Alles mag, als het legaal en automatisch is. Verzin het sterkste idee!", "locaties": {"Oprichter": "bureau", "Criticus": "bureau", "CFO": "bureau", "Jurist": "bureau", "Klantstem": "bureau", "Voorzitter": "zaal", "Auditor": "auditor", "Groei": "bureau"}, "samenvatting": "Wat is het commercieel sterkste, legale idee waarmee we zo automatisch mogelijk geld verdienen? Ronde 1: iedereen bedenkt blind 5 ideeën en kritiek is verboden. Daarna volgen sparren, toetsen, scoren in code, uitwerken, besluiten en de controle door de Auditor."}, {"fase": "Ideeën (blind)", "kort": "2 Oprichter", "titel": "Oprichter bedenkt 5 ideeën", "spreker": "Oprichter", "bubbel": "Laat verduurzaming ons zoekverkeer leveren, en AI de rest draaien!", "locaties": {"Oprichter": "bureau", "Criticus": "bureau", "CFO": "bureau", "Jurist": "bureau", "Klantstem": "bureau", "Voorzitter": "glas", "Auditor": "auditor", "Groei": "bureau"}, "samenvatting": "Vijf ideeën die zichzelf verkopen via zoekverkeer, self-service en abonnementen, vaak met verduurzaming als eerlijk voordeel. Van veilig (subsidiegids per gemeente) tot wild (betaalde datafeed voor AI-agents).", "blokken": [{"kop": "Ideeën", "items": ["SubsidieRadar Gemeente (veilig): Per gemeente en maatregel automatisch actuele pagina's en een rekentool voor verduurzamingssubsidies, met betaald persoonlijk rapport en alert-abonnement. Klant: Huiseigenaren in Benelux die een warmtepomp, isolatie of zonnepanelen overwegen..
