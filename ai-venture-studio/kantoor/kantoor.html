 Tegenmaatregel: regels in code, wekelijkse broncontrole, datum per gegeven, herstel binnen 48 uur met geld terug, en een aansprakelijkheidsbeperking in de voorwaarden (binnen het dwingend recht).", "[Oprichter] Reactie van een installateur of beschuldiging van bevooroordeling. Tegenmaatregel: geen namen en geen oordelen, alleen posten en openbare bandbreedtes, en een openbare methodiekpagina.", "[Groei] Communities zien posts als spam, of een account wordt geblokkeerd. Tegenmaatregel: alleen fora die het toestaan, antwoorden die eerst inhoudelijk helpen, openheid over onze betrokkenheid en hoogstens 2 per week. Er is geen afhankelijkheid, want het kanaal levert in het verwachte scenario maar 2 klanten per maand.", "[CFO] De betaaldienst of het advertentienetwerk weigert ons (geen KvK, adviesachtige dienst). Tegenmaatregel: vooraf de voorwaarden controleren; plan-B-betaling via een tweede merchant-of-record of meteen een KvK-inschrijving als eenmanszaak (beslissing van de eigenaar).", "[CFO] De tijd van de eigenaar loopt boven 1 uur per week. Tegenmaatregel: alles in batches goedkeuren, de community-frequentie omlaag, en het tijdlogboek als meetpunt; bij meer dan 1,5 uur per week 2 weken achter elkaar bespreekt de Voorzitter de afbouw.", "[Groei] SEO groeit langzamer dan verwacht (pessimistisch +80 bezoekers per maand). Tegenmaatregel: de stopregel na m3. We investeren geen extra budget in SEO voordat de betalingsbereidheid bewezen is."]}, {"kop": "Plan-B: K5 in het kort", "items": ["[Oprichter] Propositie: 'NL-sjablonen voor wonen en verduurzaming', met Nederlandstalige spreadsheets en checklists (offertevergelijker, energieverbruikslogboek, verbouwplanner, VvE-verduurzamingsplanning, opzegbrief-sjablonen na een check door de Jurist). Verkocht op Etsy plus een eigen downloadpagina, met een jaarbundel inclusief updates. De eerste spreadsheet is dezelfde als in K1, dus de twee plannen delen het eerste product.", "[Oprichter] Prijzen: €12 per sjabloon (excl. btw; AANNAME: Etsy rekent EU-btw af bovenop de prijs), jaarbundel €29. Juridisch GROEN, met de voorwaarden van de Jurist: eigen werk, licentietekst, AI-melding volgens het Etsy-beleid, en de herroepingscheckbox op de eigen site.", "[CFO] Unit economics (Etsy-kosten volgens de CFO-ronde: €0,20 listing + 6,5% + ~4% + €0,30, SCHATTING): €12 → 0,20 + 0,78 + 0,48 + 0,30 = €1,76 kosten; bijdrage 12 − 1,76 − 0,05 (API) = €10,19. €29 → 0,20 + 1,885 + 1,16 + 0,30 = €3,545; bijdrage 29 − 3,545 − 0,10 = €25,355 ≈ €25,36.", "[Groei] Test van 60 dagen: 30 listings in 2 batches (de eigenaar keurt 15 per kwartier goed), €40 Etsy-ads (€20 per maand) en €6 listingkosten → €46 totaal. Succes: ≥10 verkopen binnen 60 dagen en ≥1 bundel. Stop: <3 verkopen na 60 dagen.", "[CFO] Projectie (SCHATTING): het aantal verkopen groeit lineair naar s12 in maand 12, dus verkopen(m) = s12 × m/12 en het totaal over 12 maanden = s12 × 78/12 = 6,5 × s12. Pessimistisch s12 = 10, bundelaandeel 10%: gemengd 0,9 × 10,19 + 0,1 × 25,355 = €11,71; 65 verkopen × 11,7065 = €760,92; − €24 listing-verlengingen − €40 ads = €696,92; na studiokosten (−864) = −€167,08.", "[CFO] Verwacht s12 = 40, bundel 15%: gemengd 0,85 × 10,19 + 0,15 × 25,355 = €12,46; 260 × 12,46475 = €3.240,84; − 64 = €3.176,84; na studiokosten €2.312,84. Optimistisch s12 = 120, bundel 20%: gemengd €13,22; 780 × 13,223 = €10.313,94; − 64 = €10.249,94; na studiokosten €9.385,94. Verkopen na 60 dagen: s12 × 3/12 = 2,5 / 10 / 30.", "[CFO] Vergelijking voor de Voorzitter (verwacht scenario, 12 maanden na studiokosten): K1 €8.793,79 tegenover K5 €2.312,84. Testbudget K1 €216 tegenover K5 €46. Pessimistisch: K1 −€191,17 (met stopregel) tegenover K5 −€167,08. K5 is goedkoper, sneller en juridisch schoner, maar heeft een lager plafond, geen verdediging en een platformrisico (Etsy).", "[Oprichter] Advies: K1 als hoofdtest. Zet de K5-spreadsheet tegelijk live als goedkope tweede meting (die zit al in het K1-budget). Als K1 de dag-28-toets niet haalt en de spreadsheet wel verkoopt, wordt K5 de hoofdtest zonder nieuw bouwwerk."]}, {"kop": "Voor de eigenaar (niveau C)", "items": ["Beslissen: K1 als hoofdtest met de K5-spreadsheet als bijmeting, of meteen plan-B K5 (dat beslist de Voorzitter eerst, daarna de eigenaar).", "Goedkeuren: testbudget €216 over 60 dagen (domein €15, Google Ads €200, Etsy circa €1), plus de bestaande API-ruimte van €8 per maand. Geen andere uitgaven zonder nieuw verzoek.", "Beslissen: betalen via een merchant-of-record zonder eigen btw-administratie, of nu al een KvK-inschrijving als eenmanszaak (eenmalige kosten, AANNAME circa €80; vergroot ook het vertrouwen, een les uit proefvergadering 1). Vraag een accountant of de test al als onderneming geldt (btw, KOR, inkomstenbelasting).", "Uitvoeren (alleen jij kunt dat, identiteit vereist), circa 2 uur: accounts aanmaken voor domein, hosting, betaaldienst, Google Ads en eventueel Etsy, met tweestapsverificatie. De agents krijgen geen wachtwoorden, alleen beperkte API-sleutels waar dat kan.", "Inbreng (2,5 uur): de prijsbandbreedtes per kW en de checklist voor de offerte die de agents uit openbare bronnen voorstellen, toetsen aan je eigen praktijkervaring.", "Goedkeuren vóór publicatie: de landingspagina, het voorbeeldrapport, de disclaimer, de voorwaarden, de privacyverklaring, de advertenties, de LinkedIn-post en elk community-antwoord (in batches).", "Zelf plaatsen: de LinkedIn-post en de community-antwoorden, vanaf je eigen account, met een openlijke vermelding van je betrokkenheid.", "Beslissen na succes (niet nu): een jurist de voorwaarden en het rapportformat laten nalezen (kosten onbekend; SCHATTING €150–400, buiten het testbudget) en een eventuele beroepsaansprakelijkheidsverzekering.", "Wekelijks (≤1 uur): het weekrapport lezen, escalaties en terugbetalingen afhandelen, en op dag 28 en dag 60 meebeslissen over doorgaan, aanpassen of stoppen."]}, {"kop": "Beweringen", "items": [{"tekst": "Homedeal noemt voor een warmtepomp een prijsbandbreedte van €4.000 tot €30.000 en raadt aan om meerdere offertes te vergelijken; Homedeal en Bobex werken met offerteaanvragen waarbij installateurs contact opnemen (via WebSearch-samenvatting, 2026-10-30).", "label": "FEIT", "bron": "https://www.homedeal.nl/warmtepomp/kosten-warmtepomp/"}, {"tekst": "Selectra ontvangt een vergoeding als een verkoop via partner Vaillant loopt, en adviseert om een offerte naast die van minstens één andere installateur te leggen (via WebSearch-samenvatting, 2026-10-30).", "label": "FEIT", "bron": "https://selectra.nl/energie/verwarming/warmtepomp/kosten"}, {"tekst": "De Consumentenbond heeft een 'Warmtepomp Collectief' met een eigen offertetraject via homeQgo, wat een indirecte concurrent is (via WebSearch-samenvatting, 2026-10-30).", "label": "FEIT", "bron": "https://consumentenbond.nl/binaries/content/assets/cbhippowebsite/tests//warmtepomp/actievoorwaarden-warmtepomp-collectief.pdf"}, {"tekst": "Een overgangsregeling beschermt kopers van een warmtepomp tegen de halvering van de subsidie (koop vóór 31-12-2026) (titel van het artikel; details via WebSearch-samenvatting, 2026-10-30).", "label": "FEIT", "bron": "https://solarmagazine.nl/nieuws-zonne-energie/i45146/overgangsregeling-beschermt-kopers-warmtepomp-tegen-halvering-van-subsidie"}, {"tekst": "Solar Magazine meldt '30 procent minder subsidie aangevraagd voor warmtepompen' (titel); de onderliggende cijfers zijn niet gecontroleerd.", "label": "FEIT", "bron": "https://solarmagazine.nl/nieuws-zonne-energie/i44370/de-harde-cijfers-30-procent-minder-subsidie-aangevraagd-voor-warmtepompen"}, {"tekst": "Consumenten deden in het eerste halfjaar van 2026 circa 106.826 ISDE-aanvragen en het RVO-budget voor 2026 is €509 miljoen. Deze cijfers komen uit een WebSearch-samenvatting zonder eenduidige bron en moeten bij RVO worden gecontroleerd.", "label": "AANNAME", "bron": "https://solarmagazine.nl/nieuws-zonne-energie/i44514/de-harde-cijfers-aangevraagde-isde-subsidie-bereikt-in-juli-hoogste-punt-van-2026"}, {"tekst": "Mollie rekent voor iDEAL | Wero €0,32 per geslaagde transactie, zonder maandkosten (via WebSearch-samenvatting, 2026-10-30).", "label": "FEIT", "bron": "https://www.mollie.com/payments/ideal"}, {"tekst": "RVO biedt een gratis ISDE-rekentool voor warmtepompen (overgenomen uit de ronde van de Criticus).", "label": "FEIT", "bron": "https://www.rvo.nl/subsidies-financiering/isde/woningeigenaren/warmtepomp"}, {"tekst": "Er is geen onafhankelijke betaalde dienst gevonden die een ontvangen warmtepompofferte inhoudelijk toetst; dat kan een gat zijn, of een teken dat er geen vraag is.", "label": "AANNAME", "bron": null}, {"tekst": "Een merchant-of-record (Lemon Squeezy/Paddle) accepteert deze dienst zonder KvK en rekent ~5% + €0,50 per transactie.", "label": "AANNAME", "bron": null}, {"tekst": "CPC €0,90–2,50 en conversie klik→betaald 1,5–5% voor zoektermen rond warmtepompoffertes.", "label": "SCHATTING", "bron": null}, {"tekst": "SEO-verkeer groeit vanaf m3/m4 met 80–400 bezoekers per maand per maand, met 1–3% conversie.", "label": "SCHATTING", "bron": null}, {"tekst": "Productmix, upsell- (5–15%) en volgerpercentages (2–10%) en spreadsheetverkopen (0,2–0,4 per kern-klant).", "label": "SCHATTING", "bron": null}, {"tekst": "API-kosten van €0,20–0,50 per rapport en €8 per maand vast voor de pijplijn.", "label": "SCHATTING", "bron": null}, {"tekst": "Cloudflare Pages, Cloudflare Web Analytics en een transactionele maildienst zijn voor dit volume gratis te gebruiken.", "label": "AANNAME", "bron": null}, {"tekst": "De KvK-inschrijving als eenmanszaak kost circa €80 eenmalig.", "label": "AANNAME", "bron": null}, {"tekst": "De Etsy-kosten (€0,20 listing + 6,5% + ~4% + €0,30) zijn overgenomen uit de CFO-ronde en niet opnieuw gecontroleerd.", "label": "SCHATTING", "bron": null}, {"tekst": "Er zijn 3 WebSearch-zoekopdrachten (standard) gebruikt; webinhoud is als data behandeld en er zijn geen instructies in aangetroffen.", "label": "FEIT", "bron": null}]}], "eigenaar": false}, {"fase": "Besluit", "kort": "12 Besluit", "titel": "De Voorzitter besluit", "spreker": "Voorzitter", "bubbel": "We testen K1 met een echte betaalknop en stoppen meteen als niemand betaalt.", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor", "Groei": "zaal"}, "samenvatting": "Proefbesluit: de studio test als eerste K1, de Warmtepomp-Offertecheck (€29/€49), met de K5-spreadsheet (€12) als goedkope bijmeting. Dat de score in code (64,5 tegen 60,0) hoger is, telt niet als argument, want de top 3 is niet stabiel. Het besluit rust op de waarde van het probleem, de expertise van de eigenaar en een snel weerlegbare betaaltest van maximaal €216. Er komt eerst een poortcontrole op dag 14 en dag 28. De eigenaar heeft het laatste woord.", "blokken": [{"kop": "Zelf gecontroleerd", "items": [{"tekst": "In een gerichte zoekopdracht naar een onafhankelijke, betaalde warmtepomp-offertecheck vond ik geen aanbieder. De resultaten zijn offerteplatforms die van installateurs leven (Homedeal, Bobex), checklists van consumentenorganisaties en lokale, gratis renovatiebegeleiding in België. Dit bevestigt het gat dat de Oprichter zag, maar het bewijst geen vraag.", "label": "FEIT", "bron": "https://www.homedeal.nl/warmtepomp/offerte-warmtepomp/"}, {"tekst": "Test Aankoop geeft gratis een lijst met wat in een offerte moet staan (merk, model, vermogen, afvoer van het oude toestel, erkenning). Kopers kunnen de basis dus ook zelf en gratis controleren. Onze toegevoegde waarde moet zitten in de toets van hun eigen cijfers aan de bandbreedte en in de netto prijs na subsidie.", "label": "FEIT", "bron": "https://www.test-aankoop.be/woning-energie/warmtepompboilers/antwoord-van-expert/een-warmtepompboiler-installeren"}, {"tekst": "Er zijn openbare prijsbandbreedtes voor 2026 waartegen de check in code kan toetsen. Trustoo noemt gemiddeld €5.000–14.000 na ISDE, Slimster €5.000–9.000 voor lucht-water inclusief installatie. Daaruit volgt een eigen ruwe ijkwaarde van circa €1.000 per kW voor 8 kW. Het product is dus te bouwen zonder gegevens te verzinnen. De bronnen zijn wel commercieel, dus de eigenaar moet ze ijken.", "label": "FEIT", "bron": "https://trustoo.nl/kosten/warmtepomp-installateur-kosten/"}, {"tekst": "Een zoekopdracht naar forumvragen zoals 'is mijn warmtepompofferte te duur' leverde geen forumdraadjes op, alleen kostenpagina's van commerciële partijen. Met WebSearch is het zoekvolume niet te meten. Dat er zoekvraag naar een offertecheck is, blijft daarom de dragende, onbewezen aanname. De advertentietest van dag 1–14 moet die meten.", "label": "AANNAME", "bron": "https://slimster.nl/warmtepomp/warmtepomp-kosten/lucht-water-warmtepomp-prijs/"}, {"tekst": "Er is een nieuw timingrisico dat de uitwerking niet doorrekende. Start de test medio november, dan valt de tweede helft van de 60 dagen na de ISDE-overgangsdatum van 31-12-2026, wanneer de vraag kan dalen. Een slechte dag-60-uitkomst is dan deels seizoen. De dag-28-toets weegt daarom zwaarder.", "label": "SCHATTING", "bron": "https://solarmagazine.nl/nieuws-zonne-energie/i45146/overgangsregeling-beschermt-kopers-warmtepomp-tegen-halvering-van-subsidie"}, {"tekst": "Ik heb 2 WebSearch-zoekopdrachten (standard) gedaan. De webinhoud is als data behandeld en er stonden geen instructies in.", "label": "FEIT", "bron": null}]}, {"kop": "Besluit", "items": ["Hoofdtest: K1, de Warmtepomp-Offertecheck, zoals uitgewerkt in 5-uitwerking.json. Een formulier zonder upload, de cijfers uit regels in code, €29 voor één offerte en €49 voor tot 3 offertes, en een gratis lichte scan als instap.", "Bijmeting zonder eigen bouwwerk: de K5-offertevergelijkingsspreadsheet van €12 op de eigen site en eventueel op Etsy, binnen het K1-budget.", "Aanscherping ten opzichte van de uitwerking: vóór de start een poort op dag 14 (zie Opdracht), naast de bestaande toetsen op dag 28 en dag 60. De upsell (stappenplan €59), de volger (€24/jaar) en de B2B-widget worden in de test niet gebouwd. Ze staan alleen als 'binnenkort' op de site, zonder betaalknop. Zo blijft de test gericht op één vraag: betaalt iemand €29?", "Blokkade van de Criticus op K6 gevolgd: K6 is geen test en krijgt geen budget en geen bouwtijd.", "Plan-B, vooraf vastgelegd: haalt K1 de dag-28-toets niet en verkoopt de spreadsheet wel (≥3 verkopen), dan wordt K5 de hoofdtest zonder nieuw besluit van de directie (wel niveau C voor uitgaven). Haalt geen van beide de toets, dan volgt een nieuwe brainstorm met K2 en K3 als eerste kandidaten."]}, {"kop": "Waarom", "items": ["Criterium 'dichter bij aantoonbare omzet tegen aanvaardbaar risico': K1 heeft per klant de hoogste bijdrage (€21,82–37,15 tegenover €10,19 bij K5, SCHATTING CFO), een groot bedrag op het spel voor de klant (€4.000–30.000) en een maximaal verlies van €216. Het pessimistische verlies van K1 (−€191) en dat van K5 (−€167) liggen dicht bij elkaar, terwijl het plafond van K1 veel hoger is.", "De score in code beslist niet. Het verschil K1–K5–K2 (64,5 / 60,0 / 59,5) valt binnen de instabiliteit (top3_stabiel_bij_5pp_verschuiving = false). Mijn keuze rust op drie kwalitatieve argumenten die in de score onderbelicht zijn. (1) De expertise van de eigenaar maakt het product geloofwaardig voor een onbekend merk, de les uit proefvergadering 1. (2) Er is tot 31-12-2026 een tijdsvenster met kopers die haast hebben. (3) In mijn eigen zoekopdracht vond ik geen onafhankelijke betaalde concurrent.", "De grootste zorg van de Criticus ('eerst een harde betaalknop, geen product') wordt gevolgd. Het eerste dat live gaat is een betaalpagina met een echte prijs, en het product is bewust minimaal (formulier, regels, PDF).", "Kritiekpunten van de Criticus op K1, zonder blokkade, beoordeeld. Gratis rekentool geen onderscheid: gevolgd, de subsidietool is geschrapt als product. SEO te traag: gevolgd, de test meet via ads, netwerk en community. Te dicht bij advies: weerlegd, er staan geen oordelen in en de cijfers komen uit code met bron en datum, zoals de Jurist eiste. Alert-abonnement onwaarschijnlijk: gevolgd, uit de test gehaald. Gratis tweede offerte: deels weerlegd door de €49-vergelijking; de test beslist.", "Jurist ORANJE op K1: de voorwaarden (formulier zonder upload, disclaimer, herroepingscheckbox, AI-label, geen namen van installateurs) zijn harde klaar-criteria van de volgende stap. Zonder die voorwaarden geen livegang."]}, {"kop": "Minderheidsstandpunt (niet overgenomen)", "items": ["CFO (toetsronde) en de Criticus wijzen op de goedkoopste en snelste route: begin met K5. Dat kost €46 in plaats van €216, juridisch GROEN, een marktplaats die vertrouwen levert, en geen productbouw of aansprakelijkheid. Niet overgenomen, omdat de sjabloonmarkt volgens de Criticus zelf verzadigd is met gratis en AI-aanbod, het plafond laag is (verwacht €2.313 tegenover €8.794 na 12 maanden, SCHATTING) en Etsy een platformrisico is dat we niet beheersen. Het standpunt wordt wel gerespecteerd: de K5-spreadsheet loopt mee als bijmeting en is het vooraf vastgelegde plan-B.", "Sterkste tegenargument tegen K1 dat ik niet overneem: 'er is geen bewijs van zoekvraag en de gratis checklists volstaan'. Dat klopt (zie Zelf gecontroleerd), maar het is precies wat de test van €216 met een echte betaalknop goedkoop weerlegt of bevestigt. Meer vooronderzoek zonder betaalknop levert geen bewijs van betalingsbereidheid op."]}, {"kop": "Opdracht volgende stap met klaar-criteria", "items": ["Opdracht aan Oprichter, Groei en CFO, met de Jurist voor de toets: maak het testpakket voor K1 startklaar, zodat de eigenaar het in één goedkeuringssessie van maximaal 1 uur kan beoordelen. Er wordt niets gepubliceerd en niets uitgegeven vóór die goedkeuring.", "Klaar 1, huiswerk eerst: de agents zoeken zelf uit en documenteren met bron en datum (1) of Lemon Squeezy en/of Paddle deze dienst accepteren zonder KvK, en tegen welk tarief; (2) de beleidsregels van Google Ads voor deze categorie en of een particulier een advertentieaccount mag hebben; (3) de actuele ISDE-bedragen en de apparatenlijst bij RVO zelf (niet via vergelijkers). Is één punt negatief, dan staat het alternatief erbij.", "Klaar 2, minimaal product: een werkend formulier met regelgebaseerde checks (ISDE-lijst, prijs per kW tegen de bandbreedte, checklist van ontbrekende posten) dat een PDF-rapport maakt. Getest met minstens 5 fictieve, als fictief gemarkeerde offertes, die elk een correct rapport opleveren, met de bron en datum bij elk getal. Geen cijfer komt uit het taalmodel.", "Klaar 3, prijsijking: een voorstel van bandbreedtes per kW en type (hybride, all-electric) uit minstens 3 openbare bronnen, klaar om door de eigenaar te ijken in ≤2,5 uur.", "Klaar 4, site en teksten als concept: landingspagina, lichte scan, betaalpagina (€29/€49, spreadsheet €12), voorbeeldrapport, methodiek- en 'wie zit erachter'-pagina, voorwaarden, privacyverklaring, AI-label en een niet vooraf aangevinkte herroepingscheckbox. De Jurist heeft alles schriftelijk aan zijn K1-voorwaarden getoetst met de uitkomst GROEN of ORANJE-opgelost.", "Klaar 5, meetplan: een cookieloos meetplan met de gebeurtenissen uit de uitwerking, een exitvraag bij het afbreken van de checkout, een tijdlogboek voor de eigenaar en een sjabloon voor het weekrapport.", "Klaar 6, concepten voor kanalen: 3–5 advertentieteksten, 1 LinkedIn-post en een lijst fora met de huisregels per forum (promotie toegestaan: ja/nee, met bron). Alles als concept voor de eigenaar.", "Klaar 7, poorten vastgelegd. Dag 14: ≥150 advertentieklikken met ≥15 gestarte lichte scans; zo niet, dan eerst de advertentietekst of zoektermen aanpassen, één keer. Dag 28: ≥3 betalingen OF ≥30 afgeronde scans met opt-in. Dag 60: succes bij ≥10 betalende kern-klanten uit ≥2 kanalen en ≥€250 bruto, stop bij <5, met de grijze zone uit de uitwerking. Omdat de test over de jaarwisseling loopt, telt de seizoensdip alleen als verzachtende omstandigheid bij de grijze zone, niet als reden om de stopdrempel te verlagen.", "Klaar 8, budget: het totaal blijft ≤€216 over 60 dagen en ≤€128 per maand naast abonnement en API-plafond. Ligt het pakket uiterlijk 14 dagen na de goedkeuring van dit besluit klaar, dan kan de test nog vóór 31-12-2026 kopers vangen."]}, {"kop": "Voor de eigenaar (niveau C)", "items": ["Niveau C: dit proefbesluit bevestigen of verwerpen (K1 als hoofdtest met K5 als bijmeting, of meteen K5).", "Niveau C (geld): het testbudget van maximaal €216 over 60 dagen goedkeuren: domein circa €15, Google Ads €100 per maand in maand 1–2, Etsy-listings circa €1. Het geld wordt pas uitgegeven na de goedkeuring van het testpakket.", "Niveau C (geld, juridisch): kiezen tussen een merchant-of-record zonder KvK of nu een KvK-inschrijving als eenmanszaak (AANNAME circa €80), nadat de agents de voorwaarden hebben uitgezocht (Klaar 1).", "Niveau C (identiteit): de accounts zelf aanmaken (domein, hosting, betaaldienst, Google Ads, eventueel Etsy) met tweestapsverificatie. Circa 2 uur, eenmalig.", "Niveau C (inbreng): de prijsbandbreedtes en de checklist ijken met je eigen expertise (≤2,5 uur, eenmalig).", "Niveau C (publicatie, naar buiten): de site, het voorbeeldrapport, de voorwaarden, de privacyverklaring, de advertenties, de LinkedIn-post en de community-antwoorden goedkeuren. De post en de antwoorden plaats je zelf, vanaf je eigen account en open over je betrokkenheid.", "Niveau C (klantcontact, geld): terugbetalingen en klachten uit de supportwachtrij afhandelen, en meebeslissen op dag 14, 28 en 60."]}], "eigenaar": true}, {"fase": "Bezig", "kort": "…", "titel": "De brainstorm loopt nog", "spreker": "Voorzitter", "bubbel": "Even geduld, we werken het idee nog uit.", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor", "Groei": "zaal"}, "samenvatting": "De volgende stappen worden toegevoegd zodra ze klaar zijn."}]}]/*DATA_END*/;

  // bureaus

    if (!a.absent && (Math.floor(t / 300) + x) % 3 === 0) R(x - 3, y - 12, 4, 1, "#7fd18b");

function drawPerson(name, p, t) {
  const a = AGENTS[name];
  const x = Math.round(p.x), y = Math.round(p.y);
  const step = p.moving ? Math.floor(t / 140) % 2 : 0;
  R(x - 3, y + 6, 7, 2, "rgba(0,0,0,0.25)");
  R(x - 2, y + 2, 2, 4 - step, "#2b2b35"); R(x + 1, y + 2, 2, 3 + step, "#2b2b35");   // benen

  if (p.speaking && Math.floor(t / 250) % 2) R(x + 4, y - 9, 1, 1, "#fff");
  if (p.highlight) { ctx.strokeStyle = "#ffd84a"; ctx.lineWidth = 2; ctx.strokeRect((x - 5) * S, (y - 12) * S, 11 * S, 21 * S); }
}

  if (where === "bieb") return BIEB;
  if (where === "glas") return [236, 40];
  if (where === "auditor") return [282, 162];
  return [a.desk[0], a.desk[1] + 10];
}
const zoneOf = (x) => x < 172 ? "L" : "R";
function route(from, to) {
  if (zoneOf(from[0]) === zoneOf(to[0]) && Math.abs(from[1] - to[1]) < 30 && zoneOf(from[0]) === "L") return [to];
  const pts = [];
  pts.push([173, from[1]]); pts.push([173, to[1]]);
  return pts.concat([to]);
}
for (const n of Object.keys(AGENTS)) { const [x, y] = spot(n, AGENTS[n].home); pos[n] = { x, y, path: [], moving: false }; }

function applyStep(i) {
  const st = DATA.stappen[i]; if (!st) return;
  for (const n of Object.keys(AGENTS)) {
    if (AGENTS[n].absent) continue;
    const where = (st.locaties && st.locaties[n]) || AGENTS[n].home;
    const target = spot(n, where), p = pos[n];
    if (Math.hypot(p.x - target[0], p.y - target[1]) > 1) p.path = route([p.x, p.y], target);
    p.speaking = st.spreker === n; p.highlight = false;
  }
}

// ---------- Weergave notulen ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function renderDetail(st) {
  const parts = [];
  if (st.samenvatting) parts.push(`<p>${esc(st.samenvatting)}</p>`);
  for (const blok of st.blokken || []) {
    parts.push(`<p><strong>${esc(blok.kop)}</strong></p><ul>${blok.items.map((it) => {
      if (typeof it === "string") return `<li>${esc(it)}</li>`;
      const src = it.bron ? ` <a href="${esc(it.bron)}" target="_blank" rel="noopener">bron</a>` : "";
      return `<li><span class="lbl ${esc(it.label)}">${esc(it.label)}</span>${esc(it.tekst)}${src}</li>`;
    }).join("")}</ul>`);
  }
  return parts.join("");
}
let cur = 0, playing = false, timer = null;
function show(i) {
  cur = Math.max(0, Math.min(DATA.stappen.length - 1, i));
  const st = DATA.stappen[cur];
  applyStep(cur);
  $("stapTitel").textContent = st.titel;
  $("stapMeta").textContent = `Stap ${cur + 1} van ${DATA.stappen.length} · ${st.fase}` + (st.spreker ? ` · ${st.spreker}` : "");
  $("stapDetail").innerHTML = renderDetail(st);
  document.querySelectorAll(".chip").forEach((c, k) => { c.toggleAttribute("aria-current", k === cur); if (k === cur) c.setAttribute("aria-current", "step"); c.classList.toggle("done", k < cur); });
}
$("timeline").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b) { stop(); show(+b.dataset.k); } });
function buildTimeline() {
  AGENTS.Groei.absent = !(DATA.deelnemers || []).includes("Groei");
  $("timeline").innerHTML = DATA.stappen.map((s, k) => `<button type="button" class="chip" data-k="${k}">${esc(s.kort || s.fase)}</button>`).join("");
  $("who").innerHTML = Object.entries(AGENTS).map(([n, a]) => `<div><span class="dot" style="background:${a.shirt}"></span>${n}${a.absent ? " <span class='meta' style='margin:0'>(niet uitgenodigd)</span>" : ""}</div>`).join("");
}
function stop() { playing = false; clearTimeout(timer); $("play").textContent = "▶ Afspelen"; }
function tick() {
  if (!playing) return;
  if (cur >= DATA.stappen.length - 1) { stop(); return; }
  show(cur + 1);
  const len = (DATA.stappen[cur].bubbel || "").length;
  timer = setTimeout(tick, (3200 + len * 45) * +$("speed").value);
}
$("play").onclick = () => { if (playing) return stop(); playing = true; $("play").textContent = "❚❚ Pauze"; if (cur >= DATA.stappen.length - 1) show(0); timer = setTimeout(tick, 2500 * +$("speed").value); };
$("next").onclick = () => { stop(); show(cur + 1); };
$("prev").onclick = () => { stop(); show(cur - 1); };
cvs.addEventListener("click", (e) => {
  const r = cvs.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  for (const [n, p] of Object.entries(pos)) if (Math.abs(p.x - x) < 7 && Math.abs(p.y - y) < 11) {
    for (let k = cur; k >= 0; k--) if (DATA.stappen[k].spreker === n) { stop(); show(k); return; }
    for (let k = cur; k < DATA.stappen.length; k++) if (DATA.stappen[k].spreker === n) { stop(); show(k); return; }
  }
});
function setTheme(name) {
  theme = THEMES[name]; document.documentElement.setAttribute("data-theme", theme.page);
  try { localStorage.setItem("kantoorThema", name); } catch (e) {}
}
$("thema").onchange = (e) => setTheme(e.target.value);
let saved = null; try { saved = localStorage.getItem("kantoorThema"); } catch (e) {}
const startTheme = saved && THEMES[saved] ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "avond" : "groen");
$("thema").value = startTheme; setTheme(startTheme);

// ---------- Animatielus ----------
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let last = performance.now();
function frame(t) {
  const dt = Math.min(50, t - last); last = t;
  for (const p of Object.values(pos)) {
    if (p.path && p.path.length) {
      const [tx, ty] = p.path[0], dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy), v = reduce ? 999 : 0.05 * dt;
      if (d <= v) { p.x = tx; p.y = ty; p.path.shift(); } else { p.x += dx / d * v; p.y += dy / d * v; }
      p.moving = p.path.length > 0;
    } else p.moving = false;
  }
  drawOffice(t);
  const order = Object.keys(pos).filter((n) => !AGENTS[n].absent).sort((a, b) => pos[a].y - pos[b].y);
  order.forEach((n) => drawPerson(n, pos[n], t));
  const st = DATA.stappen[cur], bub = $("bubble");
  if (st && st.spreker && st.bubbel && pos[st.spreker]) {
    const p = pos[st.spreker];
    bub.hidden = false; bub.innerHTML = `<b>${esc(st.spreker)}</b>${esc(st.bubbel)}`;
    bub.style.left = Math.min(82, Math.max(18, p.x / W * 100)) + "%"; bub.style.top = ((p.y - 13) / H * 100) + "%";
  } else bub.hidden = true;
  requestAnimationFrame(frame);
}
function loadSessie(i) {
  stop(); DATA = SESSIES[i]; cur = 0;
  for (const n of Object.keys(AGENTS)) { const [x, y] = spot(n, AGENTS[n].home); Object.assign(pos[n], { x, y, path: [] }); }
  $("vraag").textContent = DATA.vraag; $("foot").textContent = DATA.voet; $("badge").textContent = DATA.titel || "";
  buildTimeline(); show(0);
}
$("sessie").innerHTML = SESSIES.map((s, i) => `<option value="${i}">${esc(s.titel)}</option>`).join("");
$("sessie").value = String(SESSIES.length - 1);
$("sessie").onchange = (e) => loadSessie(+e.target.value);
loadSessie(SESSIES.length - 1); requestAnimationFrame(frame);
</script>
