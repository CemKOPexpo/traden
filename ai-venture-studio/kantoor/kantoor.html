Betaalt: Rapport €9-19 eenmalig; alert-abonnement €3-5 per maand (SCHATTING, vergelijkbaar met kleine consumentenabonnementen).. Vindt ons via: Programmatic SEO: honderden zoekopdrachten als 'subsidie warmtepomp [gemeente]'; later nieuwsbrief met opt-in.", "Offerte-Check (gedurfd): Consument uploadt een installateursofferte (warmtepomp, zonnepanelen, dakisolatie); AI toetst op volledigheid, ontbrekende posten en redelijkheid en legt uit wat te vragen. Klant: Particulieren met een offerte van €5.000-20.000 in de hand die twijfelen.. Betaalt: €15-29 per check, eenmalig; herhaalaankoop bij tweede offerte (SCHATTING).. Vindt ons via: Zoekverkeer ('is deze offerte warmtepomp redelijk'), forums en communities, deelbare uitslag.", "MKB-Plichtenwijzer (veilig): Abonnement dat MKB-bedrijven laat zien welke energie- en milieuverplichtingen (zoals energiebesparingsplicht, EED) voor hen gelden, met deadlines en stappenplan. Klant: Kleine en middelgrote bedrijven met kantoor, winkel of bedrijfspand.. Betaalt: €19-49 per maand (SCHATTING); jaarplan met korting.. Vindt ons via: Zoekverkeer op verplichtingen en deadlines, branchesites, gratis zelftest als lead met opt-in.", "Wijk-Leadradar (gedurfd): Dashboard met open data (energielabels, bouwjaar, zonnepaneeldichtheid per buurt) dat installateurs vertelt in welke buurten de vraag het hoogst is. Klant: Installateurs van warmtepompen, zonnepanelen en isolatie, en lokale adviesbureaus.. Betaalt: €79-199 per maand per regio (SCHATTING).. Vindt ons via: Inbound via zoekverkeer op 'warmtepomp leads regio', branche-LinkedIn (organisch), gratis buurtkaart als etalage.", "RegelFeed voor AI-agents (wild): Betaalde, gestructureerde en altijd actuele API met Nederlandse en Europese regels, subsidies en tenders, die andere AI-agents per aanroep betalen. Klant: Ontwikkelaars en bedrijven die AI-assistenten bouwen en betrouwbare lokale data missen.. Betaalt: €0,01-0,05 per aanroep of €29-99 per maand per ontwikkelaar (SCHATTING, onbewezen markt).. Vindt ons via: Vermelding in MCP- en API-catalogi, developer-zoekverkeer, gratis tier, agent-marktplaatsen."]}, {"kop": "Beweringen", "items": [{"tekst": "Subsidieregels voor verduurzaming verschillen per gemeente en veranderen regelmatig, wat zoekvraag en versnippering oplevert.", "label": "AANNAME", "bron": null}, {"tekst": "Consumenten betalen €9-29 voor een eenmalige, onafhankelijke offertecheck.", "label": "AANNAME", "bron": null}, {"tekst": "MKB-bedrijven betalen €19-49 per maand voor een nalevingswijzer.", "label": "SCHATTING", "bron": null}, {"tekst": "Installateurs betalen €79-199 per maand per regio voor wijkdata. Dit is niet getoetst.", "label": "SCHATTING", "bron": null}, {"tekst": "Er is een markt voor betaalde per-aanroep-API's voor AI-agents; omvang onbekend.", "label": "AANNAME", "bron": null}, {"tekst": "Geen webzoekopdrachten gedaan in deze ronde; alle cijfers zijn eigen schattingen en moeten gevalideerd worden.", "label": "FEIT", "bron": null}]}]}, {"fase": "Ideeën (blind)", "kort": "3 Groei", "titel": "Groei bedenkt 5 ideeën", "spreker": "Groei", "bubbel": "Wij openen winkels waar kopers al lopen, en laten AI daar de toonbank bemannen.", "locaties": {"Oprichter": "bureau", "Criticus": "bureau", "CFO": "bureau", "Jurist": "bureau", "Klantstem": "bureau", "Voorzitter": "glas", "Auditor": "auditor", "Groei": "bureau"}, "samenvatting": "Vijf ideeën die starten bij kanalen met bestaand koopklaar verkeer (app-stores, Etsy, zoekmachines, vergelijkers, AI-antwoordmachines) en zichzelf verkopen zonder koude acquisitie. Het wilde idee verkoopt data en diensten aan AI-agents in plaats van aan mensen.", "blokken": [{"kop": "Ideeën", "items": ["Compliance-app webshops (veilig): Shopify/WooCommerce-app die automatisch de verplichte webshoppagina's en EU-teksten genereert en actueel houdt (herroeping, GPSR-productinfo, privacy, AI-label). Klant: Kleine Nederlandse en Belgische webshopeigenaren zonder jurist.. Betaalt: SCHATTING: EUR 9-19 per maand, via de betaalfunctie van de app-store; gratis versie met basis.. Vindt ons via: Zoeken in de Shopify App Store en WordPress-plugindirectory ('privacy policy', 'algemene voorwaarden', 'GPSR'), plus SEO-pagina's per wetswijziging.", "Branche-tools pSEO (veilig): Honderden gratis, bruikbare generators en rekentools per beroep of branche (offerte, factuur, urenstaat, prijsberekening) als long-tail-zoekmachinemagneet, met betaalde export en abonnement. Klant: ZZP'ers en micro-MKB in de Benelux (bouw, kappers, coaches, fotografen).. Betaalt: SCHATTING: gratis tool; EUR 5-9 per maand voor opslag, eigen logo en PDF's zonder watermerk.. Vindt ons via: Programmatische SEO op zoekopdrachten als 'offerte template schilder' en 'factuur voorbeeld fotograaf'; later ook AI-antwoordmachines.", "NL-templates Etsy (veilig): Nederlandstalige digitale downloads (Excel/Notion/Canva-sjablonen voor ZZP-administratie, planners, checklists) via Etsy en eigen winkel. Klant: ZZP'ers, studenten en gezinnen die zoeken op Nederlandse templates.. Betaalt: SCHATTING: EUR 5-25 eenmalig; terugkerend via bundel of jaarlijkse update-abonnement EUR 29.. Vindt ons via: Etsy-zoekopdrachten en Pinterest, plus eigen SEO-pagina's; bestaande koopintentie op Etsy.", "Vergelijker met affiliate (gedurfd): Transparante vergelijk- en prijshistoriek-sites in een paar nichecategorieën, verdiend via partnerprogramma's (zoals bol.com), met een gratis Chrome-extensie als extra ingang. Klant: Consumenten die een aankoop onderzoeken in een niche (bijvoorbeeld huisdierproducten, tuingereedschap of baby).. Betaalt: SCHATTING: klant betaalt niets; wij krijgen per verkoop een commissie van enkele procenten, doorlopend. Omzet is afhankelijk van verkeer.. Vindt ons via: Zoekopdrachten als 'beste ... 2026' en 'prijs ... vergelijken', Chrome Web Store, AI-antwoordmachines die bronnen citeren.", "Data voor AI-agents (wild): Machineleesbare, dagelijks ververste Benelux-datasets en een MCP-server/API (bijvoorbeeld regelingen, openingstijden, prijsindexen uit open data) die AI-agents en antwoordmachines per aanroep of per maand betalen. Klant: Ontwikkelaars en bedrijven met AI-assistenten of agents die betrouwbare Nederlandse data nodig hebben, en uiteindelijk de agents zelf.. Betaalt: SCHATTING: gratis laag; EUR 19-99 per maand of enkele cent per aanroep; sterk onzeker of de markt er al is.. Vindt ons via: MCP-/API-registers en marktplaatsen, GitHub, documentatiepagina's die antwoordmachines citeren, RapidAPI-achtige platforms."]}, {"kop": "Beweringen", "items": [{"tekst": "StoreCensus telt 47.899 Shopify-winkels in Nederland (stand augustus 2026, derde partij, geen cijfer van Shopify zelf).", "label": "FEIT", "bron": "https://api.storecensus.com/stores/country/netherlands?page=163"}, {"tekst": "Etsy rekent voor digitale downloads dezelfde vaste kosten als voor fysieke producten (ca. USD 0,20 listing, 6,5% transactiekosten, 3% + 0,25 betalingskosten volgens blogs van derden); controleren op de officiële Etsy-pagina voor gebruik.", "label": "FEIT", "bron": "https://checkoutpage.com/blog/etsy-fees"}, {"tekst": "De Shopify App Store heeft ruim 17.000 apps (bronnen verschillen, niet bij Shopify zelf geverifieerd); de gemiddelde winkel gebruikt ongeveer 6 apps.", "label": "AANNAME", "bron": null}, {"tekst": "Kleine webshops hebben moeite met nieuwe EU-regels (GPSR, DSA) en betalen voor een eenvoudige oplossing van EUR 9-19 per maand.", "label": "AANNAME", "bron": null}, {"tekst": "Een betaalde upgrade van een gratis tool bij 1-3% van de bezoekers is haalbaar voor branche-tools; omzet per tool in de eerste 60 dagen blijft klein.", "label": "SCHATTING", "bron": null}, {"tekst": "Vraag naar betaalde, machineleesbare Benelux-data voor AI-agents bestaat nog nauwelijks; verdienmodel en prijs zijn onbewezen.", "label": "AANNAME", "bron": null}]}]}, {"fase": "Ideeën (blind)", "kort": "4 Klantstem", "titel": "Klantstem bedenkt 5 ideeën", "spreker": "Klantstem", "bubbel": "Neem dit gedoe van me over en reken minder dan een uur van mijn tijd.", "locaties": {"Oprichter": "bureau", "Criticus": "bureau", "CFO": "bureau", "Jurist": "bureau", "Klantstem": "bureau", "Voorzitter": "glas", "Auditor": "auditor", "Groei": "bureau"}, "samenvatting": "Zoek naar geld dat nu naar traag, saai papierwerk gaat: zzp-administratie, klantenmail van webwinkels, verenigingssecretariaat, opzeg-/klachtbrieven en het verkopen van spullen. Alle vijf zijn self-service of inbound, zonder koude acquisitie; de bewijslast uit fora was dun, dus het meeste is AANNAME.", "blokken": [{"kop": "Ideeën", "items": ["Bonnetjes-naar-btw-klaar (veilig): Zzp'er mailt of uploadt bonnen en bankafschriften en krijgt maandelijks een sorteerde boekingslijst plus btw-kwartaaloverzicht, klaar om zelf in te dienen. Klant: Zzp'ers en kleine eenmanszaken die administratie haten maar een boekhouder te duur vinden.. Betaalt: €15-25 per maand, abonnement (SCHATTING: onder de prijs van een boekhoudpakket plus uurtje eigen tijd).. Vindt ons via: Zoekverkeer op 'bonnetjes administratie zzp', handleidingen per beroepsgroep, vermelding op zzp-fora (alleen door klant zelf gedeeld).", "Webwinkel-mailconcepten (gedurfd): Concept-antwoorden op klantmails (retour, levertijd, waar is mijn pakket) voor kleine webwinkels, die de winkelier met één klik goedkeurt. Klant: Kleine webwinkels (Shopify, WooCommerce, Lightspeed) met 20-200 mails per week en geen klantenservice.. Betaalt: €29-59 per maand per winkel (SCHATTING: kost minder dan een paar uur eigen tijd of een freelancer).. Vindt ons via: App-stores van de webshopplatforms, zoekverkeer op 'klantenservice automatiseren webshop', gratis proefperiode.", "Verenigingssecretariaat (veilig): Notulen uit opname of aantekeningen, jaarverslag, ledenbrieven en contributieherinneringen voor kleine verenigingen en VvE's. Klant: Besturen van sportclubs, buurtverenigingen en VvE's: vrijwilligers die dit er 's avonds bij doen.. Betaalt: €10-30 per maand of €20-40 per vergadercyclus (SCHATTING).. Vindt ons via: Zoekverkeer op 'notulen maken vereniging', 'jaarverslag voorbeeld', sjablonen als gratis ingang naar betaald.", "Opzeg- en klachtbrieven (gedurfd): Consument beschrijft in een formulier zijn probleem (abonnement opzeggen, bestelling niet geleverd, boete) en krijgt een sterke, correcte brief plus termijnen-herinnering. Klant: Consumenten met een gedoe-probleem dat het gedoe niet waard lijkt.. Betaalt: €5-9 per brief, eenmalig; €3 per maand voor termijnbewaking (SCHATTING).. Vindt ons via: Zoekverkeer op 'brief opzeggen sportschool', 'klachtbrief webshop', veel long-tail pagina's.", "Zolder-leeghaal-agent (wild): Je maakt foto's van spullen; de agent maakt advertenties, stelt een prijs voor en beantwoordt kopersvragen, jij overhandigt alleen het pakket. Klant: Mensen bij verhuizing of opruiming die weten dat spullen geld waard zijn maar de advertentie-rompslomp niet aandurven.. Betaalt: 10-15% van de verkoopprijs of vast €3 per advertentie, eenmalig per klus (SCHATTING).. Vindt ons via: Zoekverkeer rond verhuizen en opruimen, Marktplaats-vragen, mond-tot-mondreclame via gedeelde advertenties."]}, {"kop": "Beweringen", "items": [{"tekst": "ZZP Nederland meldt dat veel zzp'ers moeite hebben met hun administratie.", "label": "FEIT", "bron": "https://www.zzp-nederland.nl/nieuws/zzpers-hebben-moeite-met-administratie"}, {"tekst": "Freelance.nl schrijft dat veel zzp'ers tegen administratie opzien. (datum = raadpleegdatum; de bron zelf is niet gedateerd gecontroleerd)", "label": "FEIT", "bron": "https://www.freelance.nl/community/zzp-administratie-bijhouden"}, {"tekst": "Gevonden bronnen bevatten geen letterlijke 'ik zou betalen voor'-uitspraken van Reddit of Tweakers; één zoekopdracht gaf alleen algemene bronnen. Echte klachtenanalyse per idee moet nog.", "label": "AANNAME", "bron": null}, {"tekst": "Alle prijsniveaus en betalingsbereidheid in de ideeen zijn afgeleid van vergelijking met wat tijd of een freelancer kost.", "label": "SCHATTING", "bron": null}, {"tekst": "Marktplaatsen en webshopplatforms kunnen automatisering in hun voorwaarden verbieden of beperken.", "label": "AANNAME", "bron": null}]}]}, {"fase": "Ideeën (blind)", "kort": "5 CFO", "titel": "CFO bedenkt 5 ideeën", "spreker": "CFO", "bubbel": "Mijn voorkeur: eenmalig gemaakte assets die blijven verkopen, met marge boven 90%.", "locaties": {"Oprichter": "bureau", "Criticus": "bureau", "CFO": "bureau", "Jurist": "bureau", "Klantstem": "bureau", "Voorzitter": "glas", "Auditor": "auditor", "Groei": "bureau"}, "samenvatting": "Beste unit economics zitten in eenmalig gemaakte digitale assets die zichzelf blijven verkopen (zoekverkeer, marktplaats, abonnement) met bijna nul variabele kosten. Het knelpunt is niet marge maar betalingsbereidheid binnen 60 dagen zonder koude acquisitie.", "blokken": [{"kop": "Ideeën", "items": ["Regelcheck-abonnement (veilig): Maandelijks bijgewerkte, gestructureerde regelgeving-/subsidie-/deadlinewijzigingen voor een smalle Benelux-niche als zelfbediening-abonnement (geen advies, alleen informatie). Klant: Zzp'ers en kleine mkb'ers in één smalle niche (bijv. aannemers, horeca, webshops).. Betaalt: SCHATTING: €9-29 per maand per klant; 20-60 betalende klanten na 6 maanden = €180-1.740 MRR; marge >90%.. Vindt ons via: Zoekverkeer op nichevragen, gratis samenvatting als lead (opt-in nieuwsbrief), vermelding in branchefora (zonder spam).", "Datarapport-reeks (veilig): Eén keer gemaakte, kwartaalsgewijs ververste marktrapporten uit openbare data (bijv. Benelux-prijzen, vacatures, vastgoed), verkocht als download. Klant: Mkb'ers, consultants, journalisten, studenten die een compact overzicht willen.. Betaalt: SCHATTING: €29-149 per rapport, of €19-49 per maand voor toegang; 10-40 verkopen per rapport in de eerste 2 maanden = €300-4.000.. Vindt ons via: Zoekverkeer op de rapporttitel, gratis samenvatting/grafiek, marktplaatsen voor digitale producten.", "Programmatische vergelijkingssites (gedurfd): Veel diepe, nuttige vergelijkpagina's in een lucratieve niche, verdiend via affiliate-commissie, met openlijke AI-vermelding en echte data. Klant: Bezoekers die een aankoop of abonnement vergelijken; betaler is de aanbieder via commissie.. Betaalt: SCHATTING: EPC €0,2-1,5 per klik (gangbare bandbreedte uit vendor-blogs); bij 2.000-10.000 bezoekers per maand en 3-8% klikt door = €15-1.200 per maand; resultaat pas na 3-6 maanden SEO, dus risico binnen 60 dagen.. Vindt ons via: Organisch zoekverkeer en AI-zoekmachines; kosten per bezoeker richting nul.", "Sjabloon-winkel op marktplaats (veilig): Eenmalig gemaakte, nauwkeurige sjablonen (Notion, Excel, contract-checklists, e-mailflows) verkocht op bestaande marktplaatsen met lage prijs per stuk. Klant: Zzp'ers en kleine teams met een concreet probleem, wereldwijd Engelstalig en NL.. Betaalt: SCHATTING: €7-39 eenmalig; marktplaatsen nemen 5-30% commissie; 30-150 verkopen in 2 maanden = €150-3.500 bruto; marge 70-90% na commissie.. Vindt ons via: Zoekfunctie van de marktplaats (inbound), productpagina's en preview-video's; geen eigen merkvertrouwen nodig.", "Agent-als-licentie (wild): Een kant-en-klare AI-assistent (prompt, workflow, kennisbank) voor één vak, als white-label licentie verkocht aan softwareleveranciers en branchebureaus. Klant: Kleine softwarebedrijven, brancheorganisaties, boekhoudpakketten die AI willen inbouwen zonder zelf te bouwen.. Betaalt: SCHATTING: €200-1.500 per maand per licentie of €2.000-10.000 eenmalig; 1-3 klanten in 6 maanden = €200-4.500 MRR; hoge marge, maar API-kosten schalen met gebruik.. Vindt ons via: Vermelding in app-stores en partnerlijsten van pakketten, openbare demo met het eigen gebruik als bewijs, inbound-aanvragen."]}, {"kop": "Beweringen", "items": [{"tekst": "Gangbare affiliate-EPC ligt volgens vendor-blogs gemiddeld rond $0,45-1,50 per klik (reisniche lager, $0,38); onderliggende data niet geverifieerd.", "label": "SCHATTING", "bron": "https://blog.goaffpro.com/?p=4186"}, {"tekst": "Display-advertentieopbrengst wordt door één blog geschat op $0,02-0,08 per bezoeker; dit is een modelaanname, geen meting.", "label": "AANNAME", "bron": "https://organicarbitrage.pages.dev/articles/programmatic-seo-roi-calculator"}, {"tekst": "Affiliate-sites die meer dan $10.000/maand verdienen halen volgens een via Hostinger geciteerde bron 3,58 keer meer omzet per bezoeker; oorspronkelijke bron niet geverifieerd.", "label": "AANNAME", "bron": "https://www.hostinger.com/tutorials/affiliate-marketing-statistics"}, {"tekst": "Er is geen betrouwbare benchmark gevonden voor omzet per bezoeker van AI-gegenereerde programmatische affiliate-sites; eigen meting nodig.", "label": "FEIT", "bron": null}, {"tekst": "Alle omzetbandbreedtes per idee zijn eigen schattingen op basis van gangbare prijsniveaus; ze zijn niet gevalideerd met klantdata.", "label": "SCHATTING", "bron": null}, {"tekst": "Zoekverkeer-gebaseerde modellen (vergelijkingssites) leveren waarschijnlijk niet binnen 60 dagen betaalbewijs; abonnementen en sjablonen op marktplaatsen zijn sneller.", "label": "AANNAME", "bron": null}, {"tekst": "Elke uitgave (domein, hosting, tools, advertenties) vereist goedkeuring van de eigenaar; alle ideeën kunnen starten onder €200 per maand totaal.", "label": "AANNAME", "bron": null}]}]}, {"fase": "Sparren", "kort": "6 Sparren", "titel": "Sparren: ‘ja, en…’", "spreker": "Groei", "bubbel": "Zeven kandidaten: één gedeelde regeldata-motor, drie kanalen, één gedurfde gok.", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor", "Groei": "zaal"}, "samenvatting": "Twintig ideeën zijn samengevoegd tot zeven kandidaten rond twee clusters: verduurzaming/regelgeving met SEO of app-store als kanaal, en snelle sjabloon- of toolverkoop. K6 (data voor AI-agents) is de gedurfde kandidaat en hergebruikt de data van K1 en K2. Ideeën met SEO-resultaat na 60 dagen, B2B-verkoop of fysiek werk zijn afgevallen.", "blokken": [{"kop": "Kandidaten", "items": ["K1 Verduurzamingsloket (offerte-check + subsidie): Consument checkt zijn installateursofferte en ziet per gemeente welke subsidie geldt; alert-abonnement houdt het actueel. Prijs: Gratis subsidie-rekentool; offerte-check €15-29 eenmalig; subsidie-alert €3-5/maand (SCHATTING). Kanaal: Programmatische SEO per gemeente x maatregel ('subsidie warmtepomp [gemeente]'), deelbare uitslag, AI-antwoordmachines; geen koude acquisitie.. Ja-en: Offerte-check is de betaalde piek (snel geld, 1 uur-test met 1 gemeente), SEO-pagina's de gratis trechter; subsidiedata is gedeeld met K6. (herkomst: Oprichter: Offerte-Check + SubsidieRadar Gemeente; Groei: Branche-tools pSEO (rekentool als lokmiddel); CFO: Regelcheck-abonnement (maandelijkse bijwerking).)", "K2 Webshop-Plichtenpakket (Shopify/Woo-app): App die verplichte webshoppagina's (herroeping, privacy, GPSR, AI-label) genereert en bij wetswijzigingen bijwerkt. Prijs: Gratis basis; €9-19/maand via app-store-betaling; wetswijziging-alert in abonnement (SCHATTING). Kanaal: Shopify App Store en WordPress-plugindirectory-zoekopdrachten, SEO-pagina's per wetswijziging; koopklaar verkeer.. Ja-en: Combinatie van bestaand kanaal (app-store) met terugkerende wijzigingsservice; bundelt K3 als upsell in dezelfde app-store. (herkomst: Groei: Compliance-app webshops (kanaal: app-store); CFO: Regelcheck-abonnement (verdienmodel); Oprichter: MKB-Plichtenwijzer (wijzigingsalerts).)", "K3 Webwinkel-mailassistent: Conceptantwoorden op klantmails (retour, levertijd) die de winkelier met één klik goedkeurt. Prijs: €29-59/maand per winkel, gratis proefperiode (SCHATTING). Kanaal: App-stores van Shopify/WooCommerce/Lightspeed, zoekverkeer 'klantenservice automatiseren webshop'.. Ja-en: Maakt AI-gebruik zichtbaar in de mail; verkoopt via app-listing en als upsell op K2; hoge prijs per klant, maar API-kosten schalen mee. (herkomst: Klantstem: Webwinkel-mailconcepten; Groei: app-store-kanaal (uit Compliance-app).)", "K4 Zzp-Papierwerkpakket: Gratis branche-tools (offerte, factuur, urenstaat) leiden naar betaald bonnetjes-naar-btw-klaar abonnement. Prijs: Tools gratis; export zonder watermerk €5-9/maand; bonnetjes-btw €15-25/maand (SCHATTING). Kanaal: Programmatische SEO per beroep ('offerte template schilder'), tools als etalage, opt-in herinnering voor btw-deadline.. Ja-en: Trechter (gratis tool) voor vertrouwen bij onbekend merk; verdienmodel op twee niveaus. Trager dan K5, juridisch gevoeliger (ORANJE verwacht). (herkomst: Klantstem: Bonnetjes-naar-btw-klaar (pijn); Groei: Branche-tools pSEO (kanaal); Oprichter: MKB-Plichtenwijzer (deadlines).)", "K5 NL-Sjablonenwinkel met jaarbundel: Nederlandstalige sjablonen (ZZP-administratie, planners, vereniging, opzegbrief) via marktplaatsen, met jaarlijkse updatebundel. Prijs: €5-25 per sjabloon; jaarbundel met updates €29 (SCHATTING). Kanaal: Etsy/marktplaats-zoekfunctie en Pinterest; bestaande koopintentie, merkvertrouwen niet nodig.. Ja-en: Snelste route naar eerste betaling (binnen 60 dagen realistisch, AANNAME); marktplaats geeft vertrouwen en dient als bewijs voor andere kandidaten; weinig verdediging, dus als testmotor. (herkomst: Groei: NL-templates Etsy; CFO: Sjabloon-winkel op marktplaats; Klantstem: Verenigingssecretariaat (sjablonen) + Opzeg- en klachtbrieven (brief als sjabloon).)", "K6 Gedurfd: Benelux-regeldata voor AI-agents (MCP/API): Dagelijks ververste, machineleesbare Benelux-regels, subsidies en prijsindexen als API/MCP-server die agents per aanroep of maand betalen. Prijs: Gratis laag; €19-99/maand of €0,01-0,05 per aanroep; markt onbewezen (SCHATTING). Kanaal: MCP- en API-registers, GitHub, documentatie die antwoordmachines citeren; developer-zoekverkeer.. Ja-en: Data komt gratis mee uit K1 en K2, dus marginale kosten nihil; rapporten uit de data als bijproduct. Hoog risico op geen markt binnen 60 dagen, daarom gedurfd en bewust klein testen. (herkomst: Oprichter: RegelFeed voor AI-agents; Groei: Data voor AI-agents (wild idee); CFO: Datarapport-reeks (rapporten als bijproduct).)", "K7 Opzeg- en Klachtbrieven-loket: Consument vult formulier in en krijgt correcte opzeg- of klachtbrief plus termijnbewaking. Prijs: €5-9 per brief; €3/maand termijnbewaking (SCHATTING). Kanaal: Long-tail zoekverkeer ('brief opzeggen sportschool'), honderden situatiepagina's.. Ja-en: Brief + herinnering (terugkerend) in plaats van eenmalig; lage prijs vraagt grote volumes, risico dat betalingsbereidheid laag blijft. (herkomst: Klantstem: Opzeg- en klachtbrieven; Groei: pSEO-patroon per situatie; CFO: Sjabloon-winkel (lage prijs, hoge marge).)"]}, {"kop": "Afgevallen", "items": ["Programmatische vergelijkingssites / Vergelijker met affiliate: SEO-opbrengst pas na 3-6 maanden, dus geen betalingsbereidheid binnen 60 dagen; onbetrouwbaar voor de hoofdtest.", "Agent-als-licentie: vraagt B2B-verkoop aan softwareleveranciers zonder inbound en API-kosten schalen met gebruik, strijdig met tijd en budget.", "Zolder-leeghaal-agent: fysieke overdracht en kopersafspraken vragen mensenwerk en zijn niet automatiseerbaar.", "Wijk-Leadradar: doelgroep (installateurs) is zonder koude acquisitie slecht bereikbaar en AVG-risico op buurtdata.", "Verenigingssecretariaat (als zelfstandig idee): opnames vragen AVG-gevoelige verwerking en lage prijs; alleen sjablonen opgegaan in K5.", "Datarapport-reeks (als zelfstandig idee): eenmalige verkoop zonder terugkeer; alleen opgegaan als bijproduct in K6."]}]}, {"fase": "Toetsen", "kort": "7 Criticus", "titel": "Criticus toetst de kandidaten", "spreker": "Criticus", "bubbel": "Gratis concurrenten overal; wie betaalt er binnen 60 dagen echt?", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor", "Groei": "zaal"}, "samenvatting": "Geen enkele kandidaat heeft aangetoonde vraag; alle prijzen zijn ongetoetste SCHATTINGEN en bijna elk kanaal (SEO, app-store, Etsy) levert binnen 60 dagen en met circa €128 testruimte waarschijnlijk te weinig verkeer op. Ik blokkeer K6 als zelfstandige hoofdtest; K1, K2 en K5 zijn de enige die met een goedkope test te weerleggen of te bevestigen zijn, mits het kanaalprobleem eerlijk wordt meegenomen. Mijn grootste zorg blijft: dat we ideeën kiezen op basis van hoe goed ze te automatiseren zijn in plaats van op aangetoonde vraag, terwijl alle kanalen (SEO, app-store, Etsy) binnen 60 dagen nauwelijks verkeer geven en gratis alternatieven overal bestaan. De eerste test moet dus een harde betaalknop met een echte prijs zijn, niet nog een product.", "blokken": [{"kop": "K1 Verduurzamingsloket (offerte-check + subsidie)", "items": ["[hoog] De gratis subsidie-rekentool is geen onderscheid: RVO heeft zelf een gratis ISDE-rekentool, en vergelijkers en energieleveranciers publiceren uitgebreide subsidiepagina's. De trechter concurreert met de overheid zelf en met partijen met grote SEO-budgetten.", "[hoog] Tegenspraak in het plan: de betaalde offerte-check krijgt zijn klanten via programmatische SEO, terwijl ronde 2 zelf aanneemt dat SEO pas na maanden verkeer geeft. Binnen 60 dagen blijft dan alleen betaald verkeer over, en met circa €128 per maand na abonnement en API is dat een heel smalle test.", "[middel] Een offerte-check met oordeel ('te duur', 'technisch ongeschikt') ligt dicht tegen advies en brengt aansprakelijkheid met zich mee als de klant daarop beslist. Fouten in subsidiedata (gemeenteregels wijzigen vaak, potjes raken op) leiden tot boze klanten en terugbetalingen, en die klachten komen uiteindelijk bij de eigenaar terecht.", "[hoog] Het alert-abonnement van €3-5 per maand is onwaarschijnlijk: een huiseigenaar neemt één keer een besluit over een warmtepomp, waarna de behoefte verdwijnt. 'Terugkerend' is hier vooral een AANNAME.", "[middel] Betalingsbereidheid voor een check is onbewezen zolang installateurs en vergelijkers gratis meerdere offertes leveren; een consument kan ook gratis een tweede offerte vragen.", {"tekst": "RVO biedt een gratis ISDE-rekentool die een schatting geeft van het subsidiebedrag voor warmtepompen.", "label": "FEIT", "bron": "https://www.rvo.nl/subsidies-financiering/isde/woningeigenaren/warmtepomp"}, {"tekst": "Homedeal biedt gratis vergelijking van warmtepompoffertes, met subsidie-informatie.", "label": "FEIT", "bron": "https://www.homedeal.nl/warmtepomp/subsidie-warmtepomp/"}, {"tekst": "Slimster en Selectra publiceren uitgebreide pagina's over subsidie voor warmtepompen (2026).", "label": "FEIT", "bron": "https://slimster.nl/warmtepomp/subsidie-warmtepompen/"}, {"tekst": "De Consumentenbond adviseert om zelf gratis bij RVO aan te vragen en waarschuwt voor bemiddelaars die kosten rekenen.", "label": "FEIT", "bron": "https://www.consumentenbond.nl/energiebesparende-maatregelen/investeringssubsidie-duurzame-energie-isde"}, {"tekst": "Ik vond in één zoekopdracht geen onafhankelijke betaalde dienst die een ontvangen offerte inhoudelijk toetst. Dat kan een gat zijn, maar ook een teken dat er geen vraag is.", "label": "AANNAME", "bron": null}, {"tekst": "Verbeterjehuis.nl (Milieu Centraal) en gemeentelijke energieloketten geven gratis subsidie-overzichten per postcode.", "label": "AANNAME", "bron": null}]}, {"kop": "K2 Webshop-Plichtenpakket (Shopify/Woo-app)", "items": ["[hoog] Een overvolle markt: Shopify heeft een gratis generator, en iubenda, CookieYes, Termageddon en tientallen andere partijen bieden juridische pagina's voor Shopify. Een nieuwe app zonder reviews staat in de App Store onderaan.", "[middel] Platformrisico en tijd: app-review, het beleid van Shopify (Partner-account, betaling via Shopify, inkomstenaandeel) en wijzigingen in de API zijn buiten onze controle. De eerste review en eventuele afwijzingen kunnen weken van de 60 dagen kosten, en elke afwijzing vraagt actie van de eigenaar.", "[middel] Aansprakelijkheid: wie juridische teksten levert die 'bijgewerkt' worden bij wetswijzigingen, belooft impliciet dat ze kloppen. Een fout (bijvoorbeeld herroepingsrecht) leidt tot claims en reputatieschade, en vraagt doorlopend juridische controle die niet volledig te automatiseren is.", "[middel] De kleine NL/BE-markt plus een lage prijs: na gratis basis en een aandeel voor de app-store blijft per klant weinig over, en webshopeigenaren lossen dit vaak eenmalig op (sjabloon van brancheorganisatie of Thuiswinkel) in plaats van met een abonnement.", {"tekst": "iubenda biedt een privacyverklaring-generator voor Shopify, gericht op AVG-conformiteit.", "label": "FEIT", "bron": "https://www.iubenda.com/en/help/131017-shopify-privacy-policy-generator-why-you-should-use-one"}, {"tekst": "CookieYes biedt een privacy-policy-oplossing voor Shopify.", "label": "FEIT", "bron": "https://www.cookieyes.com/documentation/privacy-policy-shopify.md/"}, {"tekst": "Termageddon biedt een Shopify privacy policy generator met updates bij wetswijzigingen.", "label": "FEIT", "bron": "https://termageddon.com/shopify-privacy-policy-generator/"}, {"tekst": "Een vergelijking telt minstens 12 privacy-generators voor Shopify, waaronder de gratis generator van Shopify zelf.", "label": "FEIT", "bron": "https://gempages.net/blogs/shopify/shopify-privacy-policy-generators"}, {"tekst": "Voor Nederlandse algemene voorwaarden bestaan sjablonen van brancheorganisaties (zoals Thuiswinkel) en juridische websites; niet getoetst in deze ronde.", "label": "AANNAME", "bron": null}]}, {"kop": "K3 Webwinkel-mailassistent", "items": ["[hoog] Directe concurrentie van grote spelers en van de platformen zelf: helpdesksoftware voor e-commerce en Shopify hebben al AI-antwoordconcepten. Een onbekende partij zonder KvK maakt weinig kans.", "[hoog] AVG en vertrouwen: de dienst leest alle klantmails van de winkel, dus persoonsgegevens van derden. Dat vraagt een verwerkersovereenkomst, beveiliging en datalocatie, wat moeilijk past bij 'geen KvK en minder dan 1 uur per week'.", "[middel] De API-kosten schalen met het aantal mails, en met een API-budget van €50 per maand passen maar een paar actieve winkels. Een gratis proefperiode kan het budget al opmaken voordat er betaald wordt.", "[middel] Integraties breken en winkeliers verwachten support bij koppelingen (Gmail/Outlook-OAuth, orderstatus). Die storingen en het goedkeuren van OAuth-apps bij Google komen toch bij de eigenaar terecht.", {"tekst": "Helpdesksoftware voor e-commerce (zoals Gorgias, Zendesk, Freshdesk) en Shopify zelf bieden al AI-gegenereerde antwoordconcepten; niet gezocht in deze ronde.", "label": "AANNAME", "bron": null}]}, {"kop": "K4 Zzp-Papierwerkpakket", "items": ["[hoog] Zeer volwassen markt: zzp-boekhoudpakketten met bonnetjesscan en btw-overzicht bestaan al jaren, deels gratis of goedkoop, en hebben het vertrouwen dat wij missen. Dat vertrouwen is bij financiële data doorslaggevend.", "[hoog] Het kanaal is programmatische SEO, wat volgens ronde 2 zelf pas na maanden werkt; daarmee is betalingsbereidheid binnen 60 dagen onwaarschijnlijk.", "[middel] Een fout in de btw-sortering heeft directe financiële gevolgen voor de klant (naheffing). Dat is juridisch gevoelig en vraagt support die moeilijk te automatiseren is; de AVG-eisen voor financiële gegevens zijn hoog.", {"tekst": "Op Freelance.nl staat een gratis gids om de zzp-administratie zelf in Excel bij te houden; volgens de gids zijn er veel templates voor inkomsten en uitgaven.", "label": "FEIT", "bron": "https://www.freelance.nl/community/zzp-administratie-excel"}, {"tekst": "Nederlandse zzp-boekhoudpakketten (zoals Moneybird, e-Boekhouden, Tellow, Rompslomp) bieden bonnetjesscan en btw-overzichten, deels gratis; niet gezocht in deze ronde.", "label": "AANNAME", "bron": null}]}, {"kop": "K5 NL-Sjablonenwinkel met jaarbundel", "items": ["[middel] Platformrisico Etsy: één kanaal met eigen zoekalgoritme, kosten per listing en transactie, en het recht om winkels te schorsen. Nieuwe winkels zonder reviews krijgen weinig zichtbaarheid; een schorsing beëindigt de test in één keer.", "[hoog] Concurrentie met gratis: Nederlandstalige zzp-, planner- en briefsjablonen zijn op veel plaatsen gratis te vinden (Freelance.nl, overheid, Consumentenbond). Betalingsbereidheid voor een sjabloon is laag, en het Nederlandse taalgebied op Etsy is klein.", "[middel] AI-gegenereerde sjablonen moeten op Etsy en volgens onze regels transparant gemeld worden, en Etsy is overspoeld met AI-sjablonen. Dat drukt prijzen en onderscheid; de jaarbundel van €29 als terugkerende omzet is een AANNAME zonder bewijs.", "[middel] Wat toch op de eigenaar valt: Etsy vraagt identiteitsverificatie, een bankrekening en belastinggegevens van een echte persoon; elke listing moet volgens de bevoegdheden goedgekeurd worden. Met tientallen listings is dat al snel meer dan 1 uur per week.", {"tekst": "Financial Aha verkoopt een Nederlandstalige spreadsheet voor Etsy-verkopers (Google Sheets).", "label": "FEIT", "bron": "https://www.financialaha.com/nl/essentials-spreadsheet-templates/business-finance/etsy-seller-spreadsheet/"}, {"tekst": "Op Etsy domineren Engelstalige boekhoud-spreadsheets; in één zoekopdracht vond ik geen specifiek Nederlandstalig zzp-sjabloon. Dat wijst op een gat óf op weinig vraag.", "label": "AANNAME", "bron": "https://www.someka.net/products/etsy-seller-excel-template"}, {"tekst": "Er bestaan gidsen die het verkopen van (AI-)Excel-sjablonen op Etsy aanprijzen, wat wijst op een drukke, verzadigde categorie.", "label": "FEIT", "bron": "https://www.thebricks.com/resources/guide-how-to-sell-excel-templates-on-etsy-using-ai"}]}, {"kop": "K6 Gedurfd: Benelux-regeldata voor AI-agents (MCP/API) — GEBLOKKEERD", "items": ["[hoog] Er is geen aanwijzing voor betalende vraag. De kopers (ontwikkelaars) moeten we vinden, terwijl developer-registers geen koopintentie geven. Binnen 60 dagen een betalende klant is zeer onwaarschijnlijk; het plan geeft dit zelf toe.", "[hoog] De brondata is open overheidsdata die gratis is en via officiële API's beschikbaar is; AI-agents kunnen die zelf ophalen of zoeken. De toegevoegde waarde (schoonmaken, verversen) is moeilijk te verkopen aan juist een technisch publiek.", "[middel] Een betaalde API vraagt uptime, juistheid en support; een fout in regeldata die een agent aan eindgebruikers doorgeeft is een aansprakelijkheidsrisico. De betaalinfrastructuur per aanroep is bovendien niet gratis te bouwen.", "[hoog] 'Marginale kosten nihil' is een AANNAME: de data komt pas 'gratis mee' als K1 of K2 eerst gebouwd en onderhouden worden. K6 hangt dus volledig af van een andere kandidaat.", "Blokkade: Als zelfstandige hoofdtest strijdig met het eerste doel: er is geen bereikbare, betalende doelgroep binnen 60 dagen, de waarde hangt af van een nog niet gebouwde K1/K2-datalaag en de brondata is gratis. Toegestaan alleen als gratis bijproduct of meting naast een andere kandidaat, zonder eigen budget.", {"tekst": "Overheden publiceren wet- en regelgeving en subsidie-informatie als open data (bijvoorbeeld wetten.overheid.nl en officiële publicaties); niet gezocht in deze ronde.", "label": "AANNAME", "bron": null}]}, {"kop": "K7 Opzeg- en Klachtbrieven-loket", "items": ["[hoog] Gratis alternatieven zijn er in overvloed en hebben veel meer gezag: overheid- en consumentenorganisaties geven gratis voorbeeldbrieven, en een AI-chatbot schrijft zo'n brief ook gratis. Weinig consumenten betalen €5-9 voor wat ze gratis kunnen krijgen.", "[middel] De wetgeving verplicht bedrijven steeds vaker om online opzeggen makkelijk te maken, wat de pijn kleiner maakt. Dit is een AANNAME die de Jurist moet toetsen, maar het ondermijnt de vraag op termijn.", "[hoog] Het kanaal is long-tail SEO, wat binnen 60 dagen onvoldoende verkeer geeft; bij €5 per brief zijn honderden betalingen nodig om iets te betekenen. Een brief voor 'boete' of 'bezwaar' grenst bovendien aan juridisch advies.", {"tekst": "ConsuWijzer (ACM), Het Juridisch Loket en de Consumentenbond bieden gratis voorbeeldbrieven voor opzeggen en klachten; niet gezocht in deze ronde.", "label": "AANNAME", "bron": null}]}]}, {"fase": "Toetsen", "kort": "8 Jurist", "titel": "Jurist: groen, oranje of rood", "spreker": "Jurist", "bubbel": "Geen rood; wel overal afbakening als informatie, AVG-hygiëne en een zichtbaar AI-label.", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor", "Groei": "zaal"}, "samenvatting": "K5 en K6 zijn GROEN/ORANJE-licht (K5 GROEN met voorwaarden, K6 ORANJE op bronlicenties); K1, K2, K3, K4 en K7 kunnen alleen als informatie met AVG-, aansprakelijkheids- en AI-labelvoorwaarden. Geen ROOD, maar K4 (bonnetjes met persoonsgegevens) en K7 (brieven met persoonsgegevens, risico op juridisch advies) zijn het gevoeligst. Dit is geen bindend juridisch advies.", "blokken": [{"kop": "Oordeel per kandidaat", "items": ["K1 ORANJE: Verduurzamingsloket (offerte-check + subsidie) — Offerte uitlezen levert persoonsgegevens op (naam, adres, vaak woninggegevens) en een oordeel over een installateur kan als advies of als nadelige uitlating worden gezien. Subsidiedata is overheidsinformatie en meestal herbruikbaar, maar bronvoorwaarden verschillen. Onjuiste subsidie-informatie geeft aansprakelijkheidsrisico. Digitale dienst met directe levering: herroepingsrecht vervalt alleen met uitdrukkelijke toestemming en bevestiging. Voorwaarden: Positioneer als informatie en vergelijking met prijsrichtlijnen, niet als advies of garantie; disclaimer plus bronvermelding en datum per gemeente. Privacyverklaring, verwerkersovereenkomsten (AI-leverancier, hosting), minimale bewaartermijn voor offertes en verwijdering op verzoek; geen offertes gebruiken om te trainen. Uitleg dat de uitkomst AI-gegenereerd is. Bij verkoop van digitaal rapport: checkbox voor afstand van herroeping na start levering plus bevestiging. Neutrale, onderbouwde oordelen over installateurs (geen onbewezen beschuldigingen). Bij alerts: aparte opt-in, afmelden in elke mail. Groene claims alleen met bron. Licentie per subsidiebron controleren.", "K2 ORANJE: Webshop-Plichtenpakket (Shopify/Woo-app) — Gegenereerde juridische teksten (herroeping, privacy, GPSR) kunnen onjuist zijn; de klant leunt erop, dus aansprakelijkheid en schijn van juridisch advies. De studio zou verwerker/ontvanger van shopgegevens kunnen worden. Platformvoorwaarden van Shopify/WordPress en app-review bepalen of de app mag en hoe betaling loopt. B2B-abonnement: herroeping minder relevant, maar kleine ondernemers kunnen consumentenbescherming claimen niet; wel duidelijke voorwaarden. Voorwaarden: Sjabloonteksten door een echte jurist laten nalezen voordat ze live gaan; expliciet 'sjabloon, geen juridisch advies, controleer zelf'. Aansprakelijkheid in voorwaarden beperken (hou rekening met dwingend recht). Beperk dataverwerking: geen klantgegevens van winkels opslaan, of verwerkersovereenkomst plus privacyverklaring. App-store-richtlijnen en betaalregels lezen voor indiening. Wetswijzigingen aantoonbaar volgen (bron + datum), geen 'altijd up-to-date'-garantie. Eerlijke marketing: geen 'conform de wet gegarandeerd'.", "K3 ORANJE: Webwinkel-mailassistent — Verwerking van klantmails en orders van de winkel is verwerking van persoonsgegevens van derden: de studio wordt verwerker met verwerkersovereenkomst en AI-subverwerker, mogelijk met doorgifte buiten de EU. AI-transparantie: klantcommunicatie met AI-hulp; bij mens-in-de-lus is een label niet altijd verplicht, maar chatbot- of volautomatische uitingen wel. Foutieve toezeggingen (retour, garantie) kunnen de winkelier binden. Voorwaarden: Verwerkersovereenkomst en subverwerkerslijst; EU-hosting of passende doorgiftemechanisme; geen training op klantdata; bewaartermijnen. Winkelier keurt elk concept goed (geen auto-verzending); label bij volautomatische antwoorden dat AI wordt gebruikt. Geen marketingmails via de tool zonder opt-in. Platformvoorwaarden voor API-toegang (Shopify, Lightspeed) naleven. Voorwaarden over aansprakelijkheid en misbruik.", "K4 ORANJE: Zzp-Papierwerkpakket — Bonnetjes en facturen bevatten persoonsgegevens (klanten, namen, adressen, soms IBAN) en financiële gegevens; verwerking is grootschalig en doorlopend, dus hoogste AVG-gevoeligheid van de set. Btw-hulp raakt fiscaal advies; fouten kunnen boetes voor de gebruiker opleveren. Bewaarplichten (fiscaal) en beveiligingseisen. Gratis tools met sjablonen (offerte, factuur) kunnen juridisch/fiscaal verplichte vermeldingen missen. Voorwaarden: Eerst alleen de gratis tools plus export (zonder persoonsgegevensverwerking); bonnetjes-OCR pas na DPIA-toets, verwerkersovereenkomsten, EU-opslag, versleuteling, korte bewaartermijn en duidelijke privacyverklaring. Uitsluitend administratieve sortering, uitdrukkelijk 'geen belastingadvies, controleer met je boekhouder'. Factuursjablonen laten controleren op wettelijke verplichte vermeldingen. Herinneringen alleen met opt-in. AI-gebruik vermelden. Belastingen en bewaarplicht door accountant/belastingadviseur laten bevestigen.", "K5 GROEN: NL-Sjablonenwinkel met jaarbundel — Weinig persoonsgegevens, directe verkoop van eigen digitale producten. Risico's zijn beheersbaar: eigen werk voor IP, herroeping bij digitale levering, platformregels en juridisch getinte sjablonen (opzegbrief, verenigingsstatuten). Voorwaarden: Alle sjablonen volledig zelf (of AI-)gemaakt en geen overgenomen teksten, lettertypen, beelden of merken; licentievoorwaarden duidelijk (persoonlijk of zakelijk gebruik). Etsy-regels voor digitale producten en AI-gebruik naleven (Etsy vraagt openheid over AI-gegenereerd materiaal, controleer actuele beleid); bij Etsy-verkoop btw/OSS door het platform of zelf regelen. Herroeping digitale inhoud: uitdrukkelijke toestemming plus bevestiging, of vermelden dat er geen herroeping is na start download. Sjablonen met juridische inhoud: 'voorbeeld, geen advies' en laten nalezen. Geen nep-reviews. Updatebundel: duidelijke prijs en wat 'updates' omvat.", "K6 ORANJE: Gedurfd: Benelux-regeldata voor AI-agents (MCP/API) — Juridisch lager risico qua persoonsgegevens (geen), maar de kern is herbruik van externe data: overheidsinformatie is vaak herbruikbaar (Wet hergebruik / open-databeleid), maar licentie en bronvermelding verschillen per bron; databank- en auteursrecht van derden (prijsindexen, commerciële bronnen) kan commerciële doorverkoop verbieden. Fouten in 'machineleesbare regels' die agents automatisch gebruiken vergroten aansprakelijkheid. B2B-voorwaarden nodig. Scrapen: voorwaarden van bronwebsites en robots.txt. Voorwaarden: Alleen bronnen met aantoonbaar open licentie (bijvoorbeeld CC0/CC-BY of vergelijkbaar) opnemen en per bron licentie, bronvermelding en datum bijhouden; geen scrapen van commerciële of beschermde databanken zonder licentie. Voorwaarden: data 'zoals is', geen garantie, geen advies, beperking van aansprakelijkheid. Geen persoonsgegevens in de feed. Bij betaalde API: gebruiksvoorwaarden, privacyverklaring voor API-keys en facturatiedata. Klein testen.", "K7 ORANJE: Opzeg- en Klachtbrieven-loket — Brieven bevatten persoonsgegevens (naam, adres, klantnummer, soms boete- of gezondheidsinfo) en 'de juiste brief voor jouw situatie' benadert juridisch advies; foutieve opzegtermijn kan de klant geld kosten. Geen advocaat of erkend adviseur; geen rechtsbijstand. Digitale dienst: herroeping. Termijnbewaking vraagt herinneringsmails. Voorwaarden: Uitsluitend standaardbrieven op basis van duidelijke input van de klant, expliciet 'geen juridisch advies' en geen individuele beoordeling van kansen. Termijnen en wettelijke grondslagen (bijvoorbeeld opzeggen via de opzegknop) met bron per brief controleren en door een jurist laten nalezen voor lancering. Minimale gegevens, kortst mogelijke bewaartermijn, privacyverklaring en verwerkersovereenkomsten; geen gevoelige gegevens (boetes, gezondheid) in vrije tekst bewaren. Herroepingsafstand bij directe levering. Termijnbewaking alleen met opt-in. AI-gebruik vermelden."]}, {"kop": "Beweringen", "items": [{"tekst": "AI Act art. 50 (transparantieverplichtingen) geldt sinds 2 augustus 2026 en is niet uitgesteld door de Digital Omnibus; het uitstel betreft vooral high-risk. Voor machineleesbare markering (art. 50(2)) geldt een overgangstermijn tot 2 december 2026 voor systemen die vóór 2 augustus 2026 op de markt waren. Bronnen zijn adviesblogs en verwarring over data bestaat; controleer de tekst in het Publicatieblad.", "label": "FEIT", "bron": "https://www.aiactblog.nl/nl/posts/artikel-50-transparantie-deadline-2-augustus-2026"}, {"tekst": "Bij digitale inhoud zonder drager vervalt het herroepingsrecht alleen als de consument uitdrukkelijk toestemt met directe levering en bevestigt dat hij daardoor zijn herroepingsrecht verliest; anders blijft een herroepingstermijn van 14 dagen gelden.", "label": "AANNAME", "bron": null}, {"tekst": "Overheidsinformatie is in Nederland in beginsel herbruikbaar, maar licentie, bronvermelding en uitzonderingen (bijvoorbeeld derden-rechten, databankenrecht) verschillen per bron en moeten per bron worden gecontroleerd.", "label": "AANNAME", "bron": null}, {"tekst": "Platformvoorwaarden van Shopify en Etsy (AI-gebruik, digitale producten, app-review) zijn niet gecontroleerd en kunnen wijzigen.", "label": "AANNAME", "bron": null}, {"tekst": "Telecommunicatiewet art. 11.7: alleen opt-in voor commerciële e-mail; dit is in de randvoorwaarden van de vraag vastgelegd en hier niet opnieuw gecontroleerd. Alerts en herinneringen vragen aparte opt-in.", "label": "AANNAME", "bron": null}, {"tekst": "Verwerking van bonnetjes, offertes en brieven door AI is een nieuwe verwerking van persoonsgegevens en vergt grondslag, privacyverklaring, verwerkersovereenkomsten en mogelijk een DPIA.", "label": "AANNAME", "bron": null}, {"tekst": "Dit is geen bindend juridisch advies; één WebSearch is gebruikt, overige punten zijn niet extern gecontroleerd.", "label": "FEIT", "bron": null}]}]}, {"fase": "Toetsen", "kort": "9 CFO", "titel": "CFO scoort per criterium", "spreker": "CFO", "bubbel": "K5 test het snelst, K1 combineert het best; K6 is een gok.", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor", "Groei": "zaal"}, "samenvatting": "K5 is het snelst en goedkoopst te testen maar heeft de laagste marge in omzet per klant en weinig terugkerende omzet. K1 en K2 combineren redelijke marge met terugkeer; K6 heeft de hoogste marge maar de onzekerste vraag. Alle cijfers zijn SCHATTINGEN, geen gerealiseerde cijfers.", "blokken": [{"kop": "Unit economics (SCHATTING)", "items": ["K1 Verduurzamingsloket (offerte-check + subsidie): prijs €15-29 per offerte-check eenmalig (incl. btw, consument; netto €12,40-23,97); alert €3-5/mnd (SCHATTING); CAC €0-10 per betalende klant (organisch via SEO; evt. ~€50 totale testadvertenties); tijd eigenaar niet meegeteld (SCHATTING); klanten voor €1.000 winst per maand: 43-87 checks per maand: optimistisch 1000/(23,97-0,40)=43; pessimistisch 1000/(12,40-0,80)=87 (eenmalige verkopen, geen abonnees). Vóór vaste studiokosten (max ~€72/mnd: abonnement ~€22 + API tot €50).", "K2 Webshop-Plichtenpakket (Shopify/Woo-app): prijs €9-19 per maand per winkel (SCHATTING; btw buiten beschouwing, afhandeling via app-store); CAC €0-15 per betalende klant (app-store organisch; gratis basislaag levert veel niet-betalers) (SCHATTING); klanten voor €1.000 winst per maand: 53-148 actieve abonnees: optimistisch 1000/(19-0,10)=53; pessimistisch 1000/(9-2,20)=148. Vóór vaste studiokosten (max ~€72/mnd: abonnement ~€22 + API tot €50).", "K3 Webwinkel-mailassistent: prijs €29-59 per maand per winkel (SCHATTING); CAC €5-40 per betalende klant (proefperiode-API €1-3 bij ~25% conversie plus eventuele advertenties) (SCHATTING); klanten voor €1.000 winst per maand: 18-173 abonnees: optimistisch 1000/(59-0,44)=18; pessimistisch 1000/(29-17,40-5,80=5,80)=173. Sterk afhankelijk van mailvolume. Vóór vaste studiokosten (max ~€72/mnd: abonnement ~€22 + API tot €50).", "K4 Zzp-Papierwerkpakket: prijs Tools gratis; export €5-9/mnd; bonnetjes-btw €15-25/mnd, excl. btw (SCHATTING); CAC €10-60 per betalende klant (lage conversie gratis naar betaald; SEO en tijd) (SCHATTING); klanten voor €1.000 winst per maand: 41-80 abonnees op bonnetjes-tier: optimistisch 1000/(25-0,55)=41; pessimistisch 1000/(15-2,40)=80. Alleen export-tier: 116-228 (1000/(9-0,35)=116; 1000/(5-0,60)=228). Vóór vaste studiokosten (max ~€72/mnd: abonnement ~€22 + API tot €50).", "K5 NL-Sjablonenwinkel met jaarbundel: prijs €5-25 per sjabloon; jaarbundel €29 (SCHATTING); CAC €0-4 per verkoop (organisch of Etsy-ads); plus eenmalig €0,20 per listing (SCHATTING); klanten voor €1.000 winst per maand: 46-260 verkopen per maand: optimistisch 1000/(25-3,13-0,02)=46; pessimistisch 1000/(5-1,03-0,10)=260 (eenmalig; bij alleen bundel €29 ~40). Vóór vaste studiokosten (max ~€72/mnd: abonnement ~€22 + API tot €50).", "K6 Gedurfd: Benelux-regeldata voor AI-agents (MCP/API): prijs €19-99 per maand of €0,01-0,05 per aanroep (SCHATTING, onbewezen); CAC €0-60 per betalende klant, zeer onzeker; kan oplopen als er geen vraag is (SCHATTING); klanten voor €1.000 winst per maand: 11-55 abonnees: optimistisch 1000/(99-1,50-0,10)=11; pessimistisch 1000/(19-0,55)=55. Per aanroep: 20.200-105.300 aanroepen/mnd (1000/0,0495; 1000/0,0095). Vóór vaste studiokosten (max ~€72/mnd: abonnement ~€22 + API tot €50).", "K7 Opzeg- en Klachtbrieven-loket: prijs €5-9 per brief (incl. btw, consument; netto €4,13-7,44); termijnbewaking €3/mnd (SCHATTING); CAC €0-6 per betalende klant (organisch; bij brief van €3,5-7 marge snel te hoog bij advertenties) (SCHATTING); klanten voor €1.000 winst per maand: 142-284 brieven per maand: optimistisch 1000/(7,44-0,37)=142; pessimistisch 1000/(4,13-0,60)=284 (eenmalig). Vóór vaste studiokosten (max ~€72/mnd: abonnement ~€22 + API tot €50)."]}]}, {"fase": "Scoren in code", "kort": "10 Score", "titel": "De computer rekent de score uit", "spreker": "Voorzitter", "bubbel": "Winnaar volgens de score: K1 Verduurzamingsloket (offerte-check + subsidie).", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor", "Groei": "zaal"}, "samenvatting": "Gewogen score (0–100) volgens de gewichten uit de visie. Geen agent kan deze score beïnvloeden. Een ROOD van de Jurist laat een kandidaat afvallen. Let op: de top 3 verandert als de gewichten 5 procentpunt verschuiven, dus het verschil zit in de aannames.", "blokken": [{"kop": "Ranglijst", "items": ["K1 Verduurzamingsloket (offerte-check + subsidie): 64.5 punten · Jurist ORANJE", "K5 NL-Sjablonenwinkel met jaarbundel: 60.0 punten · Jurist GROEN", "K2 Webshop-Plichtenpakket (Shopify/Woo-app): 59.5 punten · Jurist ORANJE", "K3 Webwinkel-mailassistent: 58.0 punten · Jurist ORANJE", "K7 Opzeg- en Klachtbrieven-loket: 53.5 punten · Jurist ORANJE", "K4 Zzp-Papierwerkpakket: 52.0 punten · Jurist ORANJE", "K6 Gedurfd: Benelux-regeldata voor AI-agents (MCP/API): 51.5 punten · Jurist ORANJE"]}]}, {"fase": "Uitwerken", "kort": "11 Uitwerken", "titel": "Het winnende idee volledig uitgewerkt", "spreker": "Oprichter", "bubbel": "Een betaalknop op een offerte van tienduizend euro: €216 om het te weten.", "locaties": {"Oprichter": "zaal", "Criticus": "zaal", "CFO": "zaal", "Jurist": "zaal", "Klantstem": "zaal", "Voorzitter": "zaal", "Auditor": "auditor", "Groei": "zaal"}, "samenvatting": "K1 wordt de 'Warmtepomp-Offertecheck': een onafhankelijke, feitelijke check van een ontvangen warmtepompofferte (€29, of €49 voor tot 3 offertes). Het product werkt via een formulier zonder upload, toetst aan openbare bronnen en heeft een gratis lichte scan als trechter. De 60-dagentest kost €216 en laat met een echte betaalknop zien of mensen betalen (succes bij ≥10 betalende klanten, stop bij <5). In het verwachte scenario maakt K1 na 12 maanden circa €8.794 na studiokosten, tegen circa €2.313 voor plan-B K5, maar het pessimistische K1-scenario stopt met circa €191 verlies.", "blokken": [{"kop": "Propositie en doelgroep", "items": ["[Oprichter] Propositie: 'Je hebt een warmtepompofferte. Weet binnen 10 minuten of de prijs per kW, de onderdelen en de subsidie kloppen, met een lijst vragen voor je installateur.' Het is onafhankelijk (geen provisie van installateurs), feitelijk en met een bron per gegeven.", "[Oprichter] Waarom dit commercieel het sterkst is: de klant staat voor een uitgave van €4.000 tot €30.000 (FEIT, prijsbandbreedte volgens Homedeal). €29 is dan minder dan 1% van de aankoop. De gratis alternatieven (Homedeal, Bobex, Selectra) verdienen aan installateurs of fabrikanten. Wij verdienen alleen aan de consument, en dat is ons verkoopargument.", "[Oprichter] Eerste niche: Nederlandse woningeigenaren die al minstens één offerte voor een (hybride of all-electric) lucht-waterwarmtepomp hebben ontvangen en binnen 3 maanden willen beslissen. We richten ons op 'offerte ontvangen' en niet op 'oriënteren', omdat de koopintentie en de pijn ('is dit te duur?') dan het grootst zijn.", "[Groei] Tijdsvenster: een overgangsregeling beschermt kopers die vóór 31-12-2026 kopen tegen de halvering van de ISDE-subsidie in 2027 (FEIT, Solar Magazine). Daardoor is er nu, tot eind december, een groep met haast en een offerte op tafel. Daarna verwachten we een dip (AANNAME).", "[Oprichter] Uitbreiding na bewezen vraag: zonnepanelen- en isolatieoffertes (zelfde motor, andere richtprijzen), daarna België/Vlaanderen (eigen premiedata). De gemeentelijke subsidies uit het oorspronkelijke K1 worden de SEO-laag, niet het product.", "[Oprichter] Oneerlijk voordeel: de expertise van de eigenaar in verduurzaming. Die gebruiken we eenmalig om de controlelijst en de richtprijzen te ijken, niet om wekelijks mee te werken."]}, {"kop": "Aanbod en prijzen", "items": ["[Oprichter] Gratis instap: de 'Lichte scan'. Vijf vragen geven een check of het model op de ISDE-apparatenlijst staat, een indicatie van het ISDE-bedrag en 3 veelvergeten posten (meterkast, leidingwerk, afgiftesysteem). Uitkomst op het scherm; de e-mail is optioneel en alleen met opt-in.", "[Oprichter] Instap-product (uit K5): 'Offerte-vergelijkingsspreadsheet warmtepomp' voor €12, als download via de eigen site en eventueel als listing op Etsy. Bedoeld voor doe-het-zelvers en als tweede kanaal met bestaande koopintentie.", "[Oprichter] Kernproduct: 'Offertecheck' voor €29 (1 offerte) of 'Offertevergelijking' voor €49 (tot 3 offertes naast elkaar). Je krijgt een PDF met: prijs per kW tegenover de openbare bandbreedte (met bron en datum), de ontbrekende of onduidelijke posten, de status van ISDE en gemeentelijke subsidie, de netto prijs na subsidie, en 8 tot 12 vragen voor de installateur. Er is een niet-goed-geld-terug-garantie binnen 14 dagen als het rapport aantoonbaar een fout in de gegevens bevat.", "[Oprichter] Upsell na de check: 'Verduurzamingsstappenplan' voor €59. Een informatief plan voor de volgorde van isolatie, ventilatie, warmtepomp en zonnepanelen voor dit woningtype, met de subsidies per stap. Het is uitdrukkelijk geen advies op maat.", "[Oprichter] Terugkerend, bewust klein: de 'Subsidie- en onderhoudsvolger' voor €24 per jaar, als vooruitbetaling. Je krijgt een herinnering voor de ISDE-aanvraagtermijn na installatie, wijzigingen in de regelingen, een jaarlijkse onderhoudsherinnering en een signaal als de subsidie verandert. Dit is een hypothese met een harde toets (≥10% van de kopers, zie test), geen pijler van het plan.", "[Oprichter] Combinatie met K2 (terugkerende B2B-omzet): een embedbare 'Offertecheck-widget' voor energiecoöperaties, energiecoaches en VvE-beheerders voor €39 per maand excl. btw. We verkopen die alleen inbound, via een pagina 'voor organisaties' en wie de widget op een site ziet. Pas vanaf maand 7 en alleen in het optimistische scenario meegerekend.", "[CFO] Bewust geen lagere prijs dan €29: bij €19 zakt de bijdrage van €21,82 naar €14,05 (zie Unit economics), en de advertentietest wordt dan bij voorbaat verliesgevend."]}, {"kop": "Eerste 100 klanten (zonder koude acquisitie)", "items": ["[Groei] Principe: we benaderen niemand die er niet zelf om vroeg. Alle kanalen zijn inbound (de klant zoekt of vraagt), het warme netwerk van de eigenaar, of doorverwijzing door klanten. Elke advertentie, post en publicatie is een niveau C-verzoek.", "[Groei] Kanaal 1, zoekadvertenties (meetinstrument, geen groeimotor): Google Ads op zoektermen met hoge koopintentie, zoals 'warmtepomp offerte te duur', 'offerte warmtepomp vergelijken', 'is mijn warmtepomp offerte goed' en 'prijs warmtepomp per kW'. €100 per maand in m1–m2. Verwacht 100/1,50 = 66,7 klikken × 3% = 2,0 klanten per maand (SCHATTING). Ga alleen door na m2 als de CAC lager is dan de gemengde bijdrage.", "[Groei] Kanaal 2, het warme netwerk van de eigenaar: één persoonlijke LinkedIn-post en één bericht aan bekenden in de verduurzamingswereld, door AI geschreven en door de eigenaar zelf geplaatst. Dat is geen koude acquisitie, want het zijn eigen contacten en een eigen tijdlijn. Verwacht 4 + 2 klanten (SCHATTING).", "[Groei] Kanaal 3, communities: per week 1–2 inhoudelijke antwoorden op bestaande vragen over warmtepompoffertes, in fora en groepen die zelfpromotie toestaan. Steeds open over wie we zijn ('ik werk aan deze tool'), met de gratis lichte scan als link en nooit een betaalpagina als eerste link. Huisregels per forum vooraf laten controleren; waar promotie verboden is, plaatsen we geen link. Verwacht 2 klanten per maand (SCHATTING).", "[Groei] Kanaal 4, SEO en AI-antwoordmachines (de echte motor vanaf m3): automatisch gegenereerde, feitelijk gecontroleerde pagina's per merk/model x vermogen ('wat kost een [model] [kW] warmtepomp, wat staat er in een goede offerte') en per gemeente x subsidie. Elk met bron en datum, en gestructureerde data zodat antwoordmachines ze kunnen citeren. Verwacht +200 bezoekers per maand vanaf m3, conversie 2% (SCHATTING).", "[Groei] Kanaal 5, doorverwijzing: na aankoop een deelbare link ('jouw vriend krijgt €5 korting, jij ook'). Geen beloning voor reviews; reviews alleen echt, met opt-in en met aankoopverificatie. Verwacht 10% van de klanten van de vorige maand (SCHATTING).", "[Groei] Kanaal 6 (uit K5), marktplaats: de €12-spreadsheet als Etsy-listing voor bestaand zoekverkeer naar sjablonen. Gerekend als 0,3 spreadsheet per kern-klant in het verwachte scenario; het is vooral een extra bewijs van vraag.", "[Groei/CFO] Weg naar de eerste 100 kern-klanten in het verwachte scenario (uit de projectie, opgeteld t/m m7 = 90,68, de rest naar verhouding uit m8): ads 4 + netwerk 6 + community 15 + SEO/AI-antwoord 68 + doorverwijzing 7 = 100. Bereikt in maand 8. Optimistisch in maand 5 (91,40 na m4), pessimistisch niet binnen 12 maanden (55,55). Conclusie: de test bewijst betalingsbereidheid, en SEO moet daarna de schaal leveren."]}, {"kop": "Automatisering en tools", "items": ["[Oprichter] Website: een statische site, door AI gegenereerd en gehost op Cloudflare Pages (gratis tier, AANNAME), met een eigen .nl-domein (circa €15 per jaar, SCHATTING). Pagina's: home, lichte scan, betaalpagina, voorbeeldrapport, 'hoe we werken en wat we niet doen', voorwaarden, privacy en 'voor organisaties'.", "[Oprichter] Betaling: in de test een merchant-of-record-dienst (bijvoorbeeld Lemon Squeezy of Paddle). Die rekent btw af en factureert namens ons, zodat er geen eigen btw-administratie nodig is (AANNAME: geschikt voor een particulier of eenmanszaak; tarief ~5% + €0,50, nog te controleren). Na succes en een KvK-inschrijving kan Mollie met iDEAL voor €0,32 per transactie (FEIT, Mollie) de kosten verlagen.", "[Oprichter] AI-pijplijn: (1) een formulier met gestructureerde invoer (merk, model, vermogen, prijsposten, postcode op 4 cijfers); (2) regelgebaseerde checks in code: ISDE-apparatenlijst, prijs per kW tegen de bandbreedte, een checklist met ontbrekende posten; (3) een LLM (goedkoop model) dat alleen de uitleg en de vragen formuleert, op basis van die uitkomsten; (4) een PDF-generator; (5) levering per e-mail via een transactionele maildienst (gratis tier, AANNAME). De cijfers komen dus nooit uit het taalmodel.", "[Oprichter] Databeheer: een wekelijkse automatische controle van de bronpagina's (RVO-ISDE, de gemeentelijke regelingen in de SEO-laag, openbare prijsbronnen). Bij een wijziging zet de agent een voorstel klaar voor de eigenaar en zet hij de betrokken pagina's tijdelijk op 'wordt bijgewerkt'.", "[Groei] Meting: cookieloze analytics (Cloudflare Web Analytics, gratis, AANNAME), zodat er geen cookiebanner en geen toestemming nodig is. Gebeurtenissen: scan gestart, scan afgerond, checkout gestart, betaald, terugbetaald, upsell, volger.", "[Groei] Support: een AI-assistent beantwoordt e-mail met een FAQ en het rapport erbij; alles over geld terug, klachten of juridische vragen gaat naar een wachtrij voor de eigenaar. Het AI-gebruik staat op de site en in elk rapport vermeld (AI Act art. 50).", "[CFO] Variabele toolkosten: API circa €0,20–0,50 per rapport (SCHATTING), plus €8 per maand vast voor de pijplijn en de broncontrole (SCHATTING), binnen het API-plafond van €50. Alle andere tools zitten in de gratis tier (AANNAME, te controleren vóór de start)."]}, {"kop": "Menselijk werk per week", "items": ["[CFO] Eenmalig voor de eigenaar (week 0), circa 6 uur: accounts aanmaken (domein, Cloudflare, betaaldienst, Google Ads, eventueel Etsy) 2 uur; prijsbandbreedtes en checklist ijken met zijn of haar expertise 2,5 uur; teksten, disclaimer, voorwaarden en privacy goedkeuren 1 uur; testopzet en budget goedkeuren 0,5 uur (SCHATTING).", "[Groei] Per week tijdens de test, circa 1 uur en 10 minuten: goedkeuring van de batch posts, pagina's en advertenties 30 min; plaatsen van 1–2 community-antwoorden 15 min; escalaties uit support en terugbetalingen 15 min; weekrapport lezen 10 min (SCHATTING).", "[CFO] Dat is boven de richtwaarde van minder dan 1 uur. Tegenmaatregel vanaf week 3: community-posts terug naar 1 per week en pagina's per 20 in één batch goedkeuren. Doel na de test: 35–45 minuten per week (SCHATTING).", "[Oprichter] Wat AI volledig doet: de site bouwen, pagina's genereren, rapporten maken, support beantwoorden, bronnen bewaken, advertenties opstellen, posts schrijven en de weekrapportage met cijfers uit de betaaldienst.", "[CFO] Een professional is nodig (niet wekelijks): een accountant of belastingadviseur voor KvK, btw en KOR zodra er omzet is, en een jurist voor de voorwaarden vóór het opschalen (zie Voor de eigenaar)."]}, {"kop": "Test 60 dagen: budget, meting, drempels", "items": ["[Groei] Hypothese: minstens 10 woningeigenaren met een warmtepompofferte betalen binnen 60 dagen €29 of €49 voor een onafhankelijke check, via minstens 2 verschillende kanalen.", "[CFO] Budget: domein €15 + Google Ads €200 (€100 in m1, €100 in m2) + eventuele Etsy-listings 5 × circa €0,20 = €1 → totaal €216 (SCHATTING). Per maand: m1 = 15 + 100 + 8 (API) = €123 en m2 = 100 + 8 = €108. Allebei onder de vrije ruimte van €128 = €200 − 22 (abonnement) − 50 (API-plafond). De API-€8 valt binnen dat plafond. Elke uitgave is een niveau C-verzoek.", "[Groei] Meetpunten per week: bezoekers per kanaal; lichte scans gestart en afgerond; checkout gestart; betalingen (€29/€49/€12/€59/€24); terugbetalingen; CAC per kanaal = uitgave/betalingen; upsell- en volgerpercentage; één exitvraag bij afbreken van de checkout ('te duur / niet nodig / wantrouwen / later'); de oordeelvraag in het rapport ('klopte en hielp dit?'); de tijd van de eigenaar (logboek).", "[Groei] Tussentoets op dag 28 (drempel van de Criticus): ≥3 betalingen OF ≥30 afgeronde lichte scans met opt-in. Anders: ads stoppen, oorzaak uit de exitvraag halen en de Voorzitter laten kiezen tussen één aanpassing (prijs, belofte) of overstap naar plan-B.", "[CFO] Harde SUCCES-drempel op dag 60: ≥10 betalende kern-klanten (€29/€49), uit ≥2 kanalen, ≥€250 bruto omzet, terugbetalingen ≤10% en 0 inhoudelijke klachten over een onjuist gegeven die niet binnen 48 uur hersteld zijn.", "[CFO] Harde STOP-drempel op dag 60: <5 betalende kern-klanten, OF budget overschreden, OF een juridische klacht of claim van een installateur die niet met een correctie is op te lossen. Grijze zone 5–9: maximaal 30 dagen verlengen zonder advertentiebudget; is het totaal op dag 90 onder 10, dan stoppen.", "[CFO] Volgertoets (antwoord op de Criticus): als minder dan 10% van de kopers de volger neemt, verdwijnt die uit het aanbod en rekenen we het plan als volledig eenmalig.", "[CFO] Verwachte testuitkomst volgens de projectie: pessimistisch 7,43 / verwacht 14,80 / optimistisch 30,44 kern-klanten na 60 dagen (SCHATTING)."]}, {"kop": "Unit economics", "items": ["[CFO] Alle prijzen zijn consumentenprijzen incl. 21% btw; we rekenen met de opbrengst excl. btw. Tussenwaarden zijn onafgerond doorgerekend; afwijkingen tot €0,05 komen door afronding in de weergave.", "[CFO] Offerte-check (1 offerte) €29: excl. 21% btw 29/1,21 = €23,97; betaalkosten (AANNAME: 5% + €0,50 bij merchant-of-record) = 0,05×29 + 0,50 = €1,95; API/levering €0,20 (SCHATTING); dekkingsbijdrage = 23,97 − 1,95 − 0,20 = €21,82.", "[CFO] Offerte-vergelijking (tot 3 offertes) €49: excl. 21% btw 49/1,21 = €40,50; betaalkosten (AANNAME: 5% + €0,50 bij merchant-of-record) = 0,05×49 + 0,50 = €2,95; API/levering €0,40 (SCHATTING); dekkingsbijdrage = 40,50 − 2,95 − 0,40 = €37,15.", "[CFO] Vergelijkingsspreadsheet €12: excl. 21% btw 12/1,21 = €9,92; betaalkosten (AANNAME: 5% + €0,50 bij merchant-of-record) = 0,05×12 + 0,50 = €1,10; API/levering €0,00 (SCHATTING); dekkingsbijdrage = 9,92 − 1,10 − 0,00 = €8,82.", "[CFO] Verduurzamingsstappenplan €59: excl. 21% btw 59/1,21 = €48,76; betaalkosten (AANNAME: 5% + €0,50 bij merchant-of-record) = 0,05×59 + 0,50 = €3,45; API/levering €0,50 (SCHATTING); dekkingsbijdrage = 48,76 − 3,45 − 0,50 = €44,81.", "[CFO] Subsidie- en onderhoudsvolger €24/jaar: excl. 21% btw 24/1,21 = €19,83; betaalkosten (AANNAME: 5% + €0,50 bij merchant-of-record) = 0,05×24 + 0,50 = €1,70; API/levering €0,10 (SCHATTING); dekkingsbijdrage = 19,83 − 1,70 − 0,10 = €18,03.", "[CFO] Gemengde bijdrage per kern-klant, pessimistisch: 70% check × 21,82 + 30% vergelijking × 37,15 + upsell-stappenplan 5% × 44,81 + volger 2% × 18,03 + spreadsheet 0,2 per klant × 8,82 = €30,78 (SCHATTING).", "[CFO] Gemengde bijdrage per kern-klant, verwacht: 60% check × 21,82 + 40% vergelijking × 37,15 + upsell-stappenplan 10% × 44,81 + volger 5% × 18,03 + spreadsheet 0,3 per klant × 8,82 = €35,98 (SCHATTING).", "[CFO] Gemengde bijdrage per kern-klant, optimistisch: 50% check × 21,82 + 50% vergelijking × 37,15 + upsell-stappenplan 15% × 44,81 + volger 10% × 18,03 + spreadsheet 0,4 per klant × 8,82 = €41,53 (SCHATTING).", "[CFO] Advertentie-CAC pessimistisch: CPC €2,50 / conversie klik→betaald 1,5% = €166,67; break-even-CPC = bijdrage × conversie = 30,78 × 0,015 = €0,46. Ads zijn verliesgevend en dienen alleen als meetinstrument (SCHATTING).", "[CFO] Advertentie-CAC verwacht: CPC €1,50 / conversie klik→betaald 3,0% = €50,00; break-even-CPC = bijdrage × conversie = 35,98 × 0,03 = €1,08. Ads zijn verliesgevend en dienen alleen als meetinstrument (SCHATTING).", "[CFO] Advertentie-CAC optimistisch: CPC €0,90 / conversie klik→betaald 5,0% = €18,00; break-even-CPC = bijdrage × conversie = 41,53 × 0,05 = €2,08. Ads zijn winstgevend (SCHATTING).", "[CFO] CAC organisch (netwerk, community, SEO, doorverwijzing): €0 in geld. De kosten zitten in de tijd van de eigenaar (zie Menselijk werk) en in de vaste €8/mnd voor de pijplijn (SCHATTING).", "[CFO] Terugverdientijd: direct bij de eerste verkoop, want het is vooruitbetaling zonder abonnementsrisico. Vaste ideekosten van €8/mnd zijn bij €35,98 gemengde bijdrage (verwacht) al gedekt met 8/35,98 = 0,22 klant per maand (SCHATTING).", "[CFO] LTV is vrijwel gelijk aan de gemengde bijdrage, omdat de meeste klanten eenmalig kopen. De volger voegt per volger-klant bij 50% verlenging in jaar 2 toe: 18,03 × 0,5 = €9,02 (SCHATTING). We bouwen het plan dus bewust NIET op terugkerende consumentenomzet (antwoord op de Criticus).", "[CFO] Gevoeligheid: bij een prijs van €19 in plaats van €29 daalt de check-bijdrage naar 19/1,21 − (0,05×19+0,50) − 0,20 = 15,70 − 1,45 − 0,20 = €14,05. Daarom testen we op €29/€49 en niet lager (SCHATTING).", "[CFO] Ter vergelijking met de CFO-ronde: voor €1.000 winst per maand voor studiokosten zijn in het verwachte scenario 1000/35,98 = 27,8 kern-klanten per maand nodig; dat gebeurt volgens de projectie vanaf m8 (28,40). Inclusief studiokosten: 1072/35,98 = 29,8, vanaf m9 (SCHATTING)."]}, {"kop": "Projectie maanden 1–12 (3 scenario's, met berekening)", "items": ["[CFO] Formules (alle invoer SCHATTING): kern-klanten(m) = ads(m) + netwerk(m) + community(m) + SEO(m) + doorverwijzing(m). ads(m) = advertentiebudget/CPC × conversie; budget €100 in m1–m2, daarna €100 alleen als advertentie-CAC < gemengde bijdrage, anders €0. SEO(m) = max(0, m − startmaand) × bezoekers-stap × conversie. doorverwijzing(m) = doorverwijsfactor × kern-klanten(m−1). Omzet-bijdrage = kern-klanten × gemengde bijdrage (+ B2B-widget in optimistisch). Resultaat idee = bijdrage − vaste ideekosten (€8 API-pijplijn/mnd; +€15 domein in m1) − advertentiebudget. 'Na studio' trekt daarnaast €72/mnd af (abonnement €22 + volledige API-plafond €50; conservatief, want de €8 valt al binnen dat plafond). Breuken van klanten zijn verwachtingswaarden, afgerond op 2 decimalen.", "[CFO] PESSIMISTISCH — aannames: CPC €2,50, conversie 1,5%, netwerk 3+1, community 1/mnd, SEO vanaf m4 met +80 bezoekers/mnd en 1% conversie, doorverwijzing 5%, mix 70/30. Gemengde bijdrage €30,78. m1: K=0,60+3+1+0,00+0,00=4,60; bijdrage 4,60×30,78=€141,59; −vast €23 −ads €100 = €18,59; na studio €-53,41 | m2: K=0,60+1+1+0,00+0,23=2,83; bijdrage 2,83×30,78=€87,11; −vast €8 −ads €100 = €-20,89; na studio €-92,89 | m3: K=0,00+0+1+0,00+0,14=1,14; bijdrage 1,14×30,78=€35,14; −vast €8 −ads €0 = €27,14; na studio €-44,86 | m4: K=0,00+0+1+0,80+0,06=1,86; bijdrage 1,86×30,78=€57,16; −vast €8 −ads €0 = €49,16; na studio €-22,84 | m5: K=0,00+0+1+1,60+0,09=2,69; bijdrage 2,69×30,78=€82,89; −vast €8 −ads €0 = €74,89; na studio €2,89 | m6: K=0,00+0+1+2,40+0,13=3,53; bijdrage 3,53×30,78=€108,80; −vast €8 −ads €0 = €100,80; na studio €28,80 | m7: K=0,00+0+1+3,20+0,18=4,38; bijdrage 4,38×30,78=€134,72; −vast €8 −ads €0 = €126,72; na studio €54,72 | m8: K=0,00+0+1+4,00+0,22=5,22; bijdrage 5,22×30,78=€160,64; −vast €8 −ads €0 = €152,64; na studio €80,64 | m9: K=0,00+0+1+4,80+0,26=6,06; bijdrage 6,06×30,78=€186,56; −vast €8 −ads €0 = €178,56; na studio €106,56 | m10: K=0,00+0+1+5,60+0,30=6,90; bijdrage 6,90×30,78=€212,48; −vast €8 −ads €0 = €204,48; na studio €132,48 | m11: K=0,00+0+1+6,40+0,35=7,75; bijdrage 7,75×30,78=€238,40; −vast €8 −ads €0 = €230,40; na studio €158,40 | m12: K=0,00+0+1+7,20+0,39=8,59; bijdrage 8,59×30,78=€264,32; −vast €8 −ads €0 = €256,32; na studio €184,32 | Totaal 12 mnd: 55,55 kern-klanten; resultaat idee €1398,79; na studiokosten €1398,79 − 12×72 = €534,79.", "[CFO] VERWACHT — aannames: CPC €1,50, conversie 3%, netwerk 4+2, community 2/mnd, SEO vanaf m3 met +200 bezoekers/mnd en 2% conversie, doorverwijzing 10%, mix 60/40. Gemengde bijdrage €35,98. m1: K=2,00+4+2+0,00+0,00=8,00; bijdrage 8,00×35,98=€287,81; −vast €23 −ads €100 = €164,81; na studio €92,81 | m2: K=2,00+2+2+0,00+0,80=6,80; bijdrage 6,80×35,98=€244,64; −vast €8 −ads €100 = €136,64; na studio €64,64 | m3: K=0,00+0+2+4,00+0,68=6,68; bijdrage 6,68×35,98=€240,32; −vast €8 −ads €0 = €232,32; na studio €160,32 | m4: K=0,00+0+2+8,00+0,67=10,67; bijdrage 10,67×35,98=€383,80; −vast €8 −ads €0 = €375,80; na studio €303,80 | m5: K=0,00+0+2+12,00+1,07=15,07; bijdrage 15,07×35,98=€542,05; −vast €8 −ads €0 = €534,05; na studio €462,05 | m6: K=0,00+0+2+16,00+1,51=19,51; bijdrage 19,51×35,98=€701,78; −vast €8 −ads €0 = €693,78; na studio €621,78 | m7: K=0,00+0+2+20,00+1,95=23,95; bijdrage 23,95×35,98=€861,66; −vast €8 −ads €0 = €853,66; na studio €781,66 | m8: K=0,00+0+2+24,00+2,40=28,40; bijdrage 28,40×35,98=€1021,55; −vast €8 −ads €0 = €1013,55; na studio €941,55 | m9: K=0,00+0+2+28,00+2,84=32,84; bijdrage 32,84×35,98=€1181,45; −vast €8 −ads €0 = €1173,45; na studio €1101,45 | m10: K=0,00+0+2+32,00+3,28=37,28; bijdrage 37,28×35,98=€1341,35; −vast €8 −ads €0 = €1333,35; na studio €1261,35 | m11: K=0,00+0+2+36,00+3,73=41,73; bijdrage 41,73×35,98=€1501,24; −vast €8 −ads €0 = €1493,24; na studio €1421,24 | m12: K=0,00+0+2+40,00+4,17=46,17; bijdrage 46,17×35,98=€1661,14; −vast €8 −ads €0 = €1653,14; na studio €1581,14 | Totaal 12 mnd: 277,09 kern-klanten; resultaat idee €9657,79; na studiokosten €9657,79 − 12×72 = €8793,79.", "[CFO] OPTIMISTISCH — aannames: CPC €0,90, conversie 5%, netwerk 6+3, community 4/mnd, SEO vanaf m3 met +400 bezoekers/mnd en 3% conversie, doorverwijzing 15%, mix 50/50, plus B2B-widget €39/mnd excl. btw (bijdrage 39 − (0,05×47,19+0,50) = €36,14) met 1,1,2,2,3,3 abonnees in m7–m12. Gemengde bijdrage €41,53. m1: K=5,56+6+4+0,00+0,00=15,56; bijdrage 15,56×41,53=€646,07; −vast €23 −ads €100 = €523,07; na studio €451,07 | m2: K=5,56+3+4+0,00+2,33=14,89; bijdrage 14,89×41,53=€618,39; −vast €8 −ads €100 = €510,39; na studio €438,39 | m3: K=5,56+0+4+12,00+2,23=23,79; bijdrage 23,79×41,53=€988,03; −vast €8 −ads €100 = €880,03; na studio €808,03 | m4: K=5,56+0+4+24,00+3,57=37,12; bijdrage 37,12×41,53=€1541,88; −vast €8 −ads €100 = €1433,88; na studio €1361,88 | m5: K=5,56+0+4+36,00+5,57=51,12; bijdrage 51,12×41,53=€2123,36; −vast €8 −ads €100 = €2015,36; na studio €1943,36 | m6: K=5,56+0+4+48,00+7,67=65,22; bijdrage 65,22×41,53=€2708,98; −vast €8 −ads €100 = €2600,98; na studio €2528,98 | m7: K=5,56+0+4+60,00+9,78=79,34; bijdrage 79,34×41,53+1×36,14=€3331,36; −vast €8 −ads €100 = €3223,36; na studio €3151,36 | m8: K=5,56+0+4+72,00+11,90=93,46; bijdrage 93,46×41,53+1×36,14=€3917,70; −vast €8 −ads €100 = €3809,70; na studio €3737,70 | m9: K=5,56+0+4+84,00+14,02=107,57; bijdrage 107,57×41,53+2×36,14=€4540,19; −vast €8 −ads €100 = €4432,19; na studio €4360,19 | m10: K=5,56+0+4+96,00+16,14=121,69; bijdrage 121,69×41,53+2×36,14=€5126,55; −vast €8 −ads €100 = €5018,55; na studio €4946,55 | m11: K=5,56+0+4+108,00+18,25=135,81; bijdrage 135,81×41,53+3×36,14=€5749,04; −vast €8 −ads €100 = €5641,04; na studio €5569,04 | m12: K=5,56+0+4+120,00+20,37=149,93; bijdrage 149,93×41,53+3×36,14=€6335,39; −vast €8 −ads €100 = €6227,39; na studio €6155,39 | Totaal 12 mnd: 895,50 kern-klanten; resultaat idee €36315,95; na studiokosten €36315,95 − 12×72 = €35451,95.", "[CFO] Stopregel toegepast op pessimistisch: na 60 dagen 7,43 kern-klanten (grijze zone 5–9) → 30 dagen verlenging zonder ads; na 90 dagen 8,57 < 10 → stop. Werkelijk pessimistisch resultaat dan: idee €24,83, na studiokosten €24,83 − 3×72 = €-191,17. Het doorgerekende pad hierboven is alleen ter vergelijking.", "[CFO] Na 60 dagen (testuitkomst): pessimistisch 7,43, verwacht 14,80, optimistisch 30,44 kern-klanten; resultaat idee €-2,30 / €301,45 / €1033,46.", "[CFO] Niet gemodelleerd en dus extra onzekerheid: seizoen (piek vóór 31-12-2026 door de ISDE-overgangsregeling, mogelijk dip in jan–feb 2027), terugbetalingen (reken 5–10% van de omzet als buffer), en btw-/inkomstenbelasting op de winst.", "[CFO] Samenvatting 12 maanden, resultaat idee / na studiokosten: pessimistisch €1.398,79 / €534,79 (doorgerekend) of €24,83 / €-191,17 (met stopregel na m3); verwacht €9.657,79 / €8.793,79; optimistisch €36.315,95 / €35.451,95. Alles voorspeld, niets gerealiseerd."]}, {"kop": "Antwoord op de Criticus en de Jurist", "items": ["[Oprichter] Criticus 1, 'de gratis rekentool is geen onderscheid (RVO, vergelijkers)': klopt. Daarom verkopen we geen subsidieberekening meer maar een check van de eigen offerte van de klant, en dat bieden de gratis partijen niet onafhankelijk aan (zij verdienen aan installateurs). De ISDE-check zit alleen in de gratis lichte scan en verwijst door naar RVO voor de aanvraag.", "[Groei] Criticus 2, 'SEO werkt pas na maanden, dus blijft alleen betaald verkeer over': dat is aanvaard en zichtbaar doorgerekend. De test meet betalingsbereidheid via ads, netwerk en community (verwacht 14,80 klanten). SEO zit pas vanaf m3 in de projectie, en de ads gaan in het verwachte scenario na m2 uit omdat de CAC van €50,00 hoger is dan de bijdrage van €35,98.", "[Oprichter] Criticus 3, 'een oordeel ligt dicht tegen advies en aansprakelijkheid': er is geen oordeel als 'te duur' of 'ongeschikt'. Het rapport zegt alleen '€X per kW, de openbare bandbreedte is €A–€B (bron, datum)', 'deze posten ontbreken' en 'vraag dit na'. De cijfers komen uit regels in code en niet uit het taalmodel, en elke bron is gedateerd en wordt wekelijks bewaakt.", "[CFO] Criticus 4, 'het alert-abonnement is onwaarschijnlijk': aanvaard. Terugkerende consumentenomzet telt in het verwachte scenario maar voor 5% × €18,03 = €0,90 per klant mee, en de volger gaat eruit onder 10% afname. Terugkerende omzet komt eventueel van de B2B-widget (uit K2), en alleen in het optimistische scenario.", "[Groei] Criticus 5, 'consumenten kunnen gratis een tweede offerte vragen': de €49-vergelijking speelt daarop in, want wie 2–3 offertes heeft, heeft juist moeite om ze te vergelijken. De echte betaalknop met prijs vanaf dag 1 is precies de weerlegtoets die de Criticus vroeg.", "[Oprichter] Jurist, 'informatie, geen advies; disclaimer, bron en datum': staat op elke pagina en in elk rapport ('informatie op basis van jouw invoer en openbare bronnen, geen persoonlijk advies, geen garantie'), met de bron en datum per gegeven.", "[Oprichter] Jurist, AVG: in de MVP is er geen upload van de offerte maar een formulier met alleen technische en prijsgegevens, een postcode van 4 cijfers en een e-mailadres. Daardoor verwerken we geen namen, adressen of installateursgegevens. Daarnaast: een privacyverklaring, verwerkersovereenkomsten met de AI-, hosting- en maildiensten, bewaartermijn 30 dagen, verwijdering op verzoek en geen training op klantdata. Uploaden komt pas later, met automatische anonimisering en een nieuw oordeel van de Jurist.", "[Oprichter] Jurist, herroeping: in de checkout een aparte, niet-vooraf aangevinkte checkbox ('ik wil het rapport direct en weet dat ik daarmee mijn herroepingsrecht verlies'), plus een bevestiging per e-mail. De vrijwillige geld-terug-garantie bij een feitelijke fout komt daar bovenop.", "[Oprichter] Jurist, uitlatingen over installateurs: we noemen geen namen en geven geen oordeel over bedrijven, alleen over de posten in de offerte, en we verwijzen voor erkenning naar openbare registers.", "[Groei] Jurist, AI-transparantie, opt-in en groene claims: een AI-label op de site en in het rapport; een volger en herinneringen alleen met een aparte opt-in en afmelden in elke mail; geen besparingsclaims zonder bron; licenties per databron vastgelegd (alleen hergebruik van open overheidsinformatie met bronvermelding)."]}, {"kop": "Risico's en tegenmaatregelen", "items": ["[CFO] Er is geen betalingsbereidheid (gratis alternatieven, wantrouwen jegens een onbekend merk). Tegenmaatregel: harde drempels op dag 28 en 60, een voorbeeldrapport, een geld-terug-garantie, een pagina 'wie zit erachter' met de echte expertise van de eigenaar, en maximaal €216 risico.", "[Groei] Seizoen en beleid: na 31-12-2026 kan de vraag tijdelijk dalen door de halvering van de ISDE in 2027, en de vraag naar warmtepompsubsidie daalde al in 2026 (FEIT, Solar Magazine: '30 procent minder subsidie aangevraagd voor warmtepompen'). Tegenmaatregel: snel starten om de decemberpiek te halen, en vanaf m3 offertes voor zonnepanelen en isolatie toevoegen (dezelfde motor). De isolatievraag stijgt (FEIT, Solar Magazine).", "[CFO] De ads blijven verliesgevend (de CAC van €50 boven de bijdrage van €35,98). Tegenmaatregel: ads alleen als meetinstrument, stoppen na m2 tenzij de CAC lager is dan de bijdrage; groei via SEO en doorverwijzing.", "[Oprichter] Een onjuist gegeven in een rapport (verouderde subsidie of bandbreedte).
